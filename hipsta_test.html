<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hipsta Project | Outside The World</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="theme.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Fira+Code:wght@300;500&display=swap');

        :root {
            --nav-offset: 160px;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: white;
            margin: 0;
            /* Dynamic clearance via JS */
            padding-top: var(--nav-offset) !important;
            padding-bottom: 60px;
            background-color: #0a0a0a;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
        }

        /* NAVIGATION - Desktop Left / Mobile Centered */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3500;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: linear-gradient(to bottom, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0) 100%);
            display: flex;
            justify-content: flex-start;
            padding: 30px 40px;
            pointer-events: none;
        }

        .hero-logo-container {
            display: flex !important;
            pointer-events: auto;
        }

        .nav-logo {
            width: 220px;
            filter: drop-shadow(0 0 20px rgba(99, 149, 238, 0.3));
        }

        .header-area {
            text-align: center;
            margin: 0 auto 60px;
            position: relative;
            z-index: 10;
        }

        .header-area h1 {
            font-size: 2.5rem !important;
            letter-spacing: 15px;
            text-transform: uppercase;
            font-weight: 900;
            margin: 10px 0;
        }

        .status-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: #91AFB3;
            border: 1px solid rgba(145, 175, 179, 0.3);
            padding: 6px 15px;
            display: inline-block;
            text-transform: uppercase;
            cursor: help;
        }

        /* GRID ARCHITECTURE */
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .artifact-card {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.06);
            aspect-ratio: 1/1;
            overflow: hidden;
            cursor: pointer;
        }

        .artifact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: 0.4s;
        }

        .artifact-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        /* MODAL REFINEMENT: SYMMETRY & SCALE */
        #modal {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            overflow-y: auto;
            opacity: 0;
            transition: 0.3s;
        }

        #modal.active {
            display: block;
            opacity: 1;
        }

        .modal-content {
            max-width: 800px;
            width: 92%;
            margin: 80px auto;
            text-align: center;
            /* Keeps the container centered */
        }

        .modal-content .markdown {
            text-align: left;
            /* Keeps your text readable */
            line-height: 1.8;
            color: #ccc;
        }

        /* THE IMAGE FIX */
        .modal-content .markdown img {
            display: block;
            margin: 0 auto 40px auto;
            /* CENTERS the image even if text is left-aligned */
            max-width: 100%;
            max-height: 70vh;
            /* Prevents the image from being "Way too big" on desktop */
            width: auto;
            /* Maintains aspect ratio */
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
        }

        .modal-content .markdown p {
            margin-bottom: 25px;
            display: block;
            max-width: 700px;
            /* Optional: keeps text lines from getting too long/legible */
            margin-left: auto;
            margin-right: auto;
        }

        /* REFINED MODAL TITLE: GLOW + READABLE SPACING */
        .modal-content .markdown h1 {
            font-size: 2.2rem !important;
            text-align: center;
            /* Reduced from 10px to 4px for better legibility */
            letter-spacing: 4px;
            margin-bottom: 10px;
            color: white;
            font-weight: 900;
            text-transform: uppercase;
            /* THE GLOW: A soft white wash followed by a brand-blue pulse */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.4),
                0 0 20px rgba(99, 149, 238, 0.3),
                0 0 30px rgba(99, 149, 238, 0.2);
        }

        /* Sub-header glow consistency */
        .modal-content .markdown h2 {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #91AFB3;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-shadow: 0 0 8px rgba(145, 175, 179, 0.3);
        }

        /* Paragraph Breaks */

        #mission-overlay {
            position: fixed;
            inset: 0;
            z-index: 6000;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
            backdrop-filter: blur(20px);
        }

        @media (max-width: 768px) {
            nav {
                justify-content: center !important;
                padding: 20px 0 !important;
            }

            .hero-logo-container {
                width: 100% !important;
                justify-content: center !important;
            }

            .nav-logo {
                width: 80vw !important;
                max-width: 280px;
            }

            body {
                padding-top: 200px !important;
            }

            .header-area h1 {
                font-size: 1.2rem !important;
                letter-spacing: 5px;
            }

            .vault-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2px;
                padding: 0 5px;
            }
        }
    </style>
</head>

<body>
    <nav><a href="flotsam.html" class="hero-logo-container"><img class="nav-logo" src="Images/Equal.svg"
                alt="Back" /></a></nav>

    <header class="header-area">
        <div class="status-tag" onclick="revealMission()">TYPE: VISUAL_RECLAMATION // PROJECT: HIPSTA_2011</div>
        <h1>Hipsta_Project</h1>
    </header>

    <div class="vault-grid" id="grid"></div>

    <div id="modal" onclick="if(event.target == this) closeModal()">
        <button onclick="closeModal()"
            style="position:fixed; top:20px; right:20px; z-index:5000; background:black; color:#91AFB3; border:1px solid #91AFB3; padding:10px 20px; cursor:pointer;">[
            CLOSE_X ]</button>
        <div class="modal-content" id="modal-inner"></div>
    </div>

    <div id="mission-overlay" onclick="closeMission()">
        <div class="mission-content"
            style="max-width:700px; font-family:'Fira Code', monospace; color:#91AFB3; line-height:1.8;">
            <h3
                style="color:white; letter-spacing:5px; border-bottom:1px solid #91AFB3; padding-bottom:10px; margin-bottom:30px;">
                Original Directive: 2011</h3>
            <div id="mission-type-target"></div>
            <div style="margin-top:50px; font-size:0.7rem; opacity:0.5;">[ CLICK ANYWHERE TO EXIT_ ]</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // 1. DYNAMIC CLEARANCE SCRIPT
        function syncNav() {
            const nav = document.querySelector('nav');
            if (nav && window.innerWidth > 768) {
                document.documentElement.style.setProperty('--nav-offset', (nav.offsetHeight + 30) + 'px');
            }
        }
        window.addEventListener('resize', syncNav);
        window.addEventListener('load', syncNav);

        // 2. THE BEVY LOADER
        async function loadVault() {
            try {
                const res = await fetch('hipsta_manifest.json');
                const artifacts = await res.json();
                const grid = document.getElementById('grid');

                artifacts.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'artifact-card';
                    card.innerHTML = `<img src="${item.image}" loading="lazy">`;
                    card.onclick = () => openArtifact(item);
                    grid.appendChild(card);
                });
                syncNav();
            } catch (e) { console.error("Archive Error:", e); }
        }

        async function openArtifact(item) {
            const modal = document.getElementById('modal');
            const inner = document.getElementById('modal-inner');
            inner.innerHTML = `<p style="font-family:monospace; color:#91AFB3; margin-top:100px;">[ LOADING_FILE... ]</p>`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            try {
                const res = await fetch(item.file);
                const md = await res.text();
                inner.innerHTML = `<div class="markdown">${marked.parse(md, { breaks: true })}</div>`;
            } catch (e) { inner.innerHTML = "<p>[ ERROR_FILE_NOT_FOUND ]</p>"; }
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); document.body.style.overflow = 'auto'; }
        function revealMission() {
            document.getElementById('mission-overlay').style.display = 'flex';
            document.getElementById('mission-type-target').innerText = "Captured from 2011 using iPhone 4/4S and Hipstamatic. Reclaimed 2026.";
        }
        function closeMission() { document.getElementById('mission-overlay').style.display = 'none'; }

        loadVault();
    </script>
</body>

</html>

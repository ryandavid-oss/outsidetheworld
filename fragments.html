  <style>
    :root {
      --safe-top: env(safe-area-inset-top);
      --page-bg: #0a0a0a;
      --page-bg-deep: #050505;
      --surface: rgba(255, 255, 255, 0.045);
      --surface-strong: rgba(255, 255, 255, 0.075);
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(160, 190, 245, 0.18);
      --text-main: #eeeeee;
      --text-soft: rgba(238, 238, 238, 0.76);
      --text-faint: rgba(238, 238, 238, 0.5);
      --brand-blue: #6395EE;
      --brand-light-blue: #A0BEF5;
      --brand-teal: #91AFB3;
      --brand-gold: #D9C08C;
      --logo-navy: #1B365D;
      --logo-teal: #3D5255;
      --logo-ink: #1A1C20;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --max-width: 1120px;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
    }

    body[data-theme="light"] {
      --page-bg: #f4efe6;
      --page-bg-deep: #ebe6de;
      --surface: rgba(255, 255, 255, 0.62);
      --surface-strong: rgba(255, 255, 255, 0.8);
      --border: rgba(27, 54, 93, 0.12);
      --border-strong: rgba(61, 82, 85, 0.22);
      --text-main: #1a1c20;
      --text-soft: rgba(26, 28, 32, 0.76);
      --text-faint: rgba(26, 28, 32, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text-main);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background:
        radial-gradient(720px 460px at 10% 10%, rgba(99, 149, 238, 0.11), transparent 58%),
        radial-gradient(680px 440px at 88% 16%, rgba(145, 175, 179, 0.08), transparent 58%),
        radial-gradient(640px 420px at 50% 100%, rgba(27, 54, 93, 0.22), transparent 60%),
        linear-gradient(180deg, #090909 0%, #0a0a0a 100%);
    }

    body[data-theme="light"] {
      background:
        radial-gradient(720px 460px at 10% 10%, rgba(99, 149, 238, 0.09), transparent 58%),
        radial-gradient(680px 440px at 88% 16%, rgba(145, 175, 179, 0.08), transparent 58%),
        radial-gradient(640px 420px at 50% 100%, rgba(217, 192, 140, 0.16), transparent 60%),
        linear-gradient(180deg, #f7f3eb 0%, #ece6dd 100%);
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(var(--max-width), calc(100% - 20px));
      margin: 0 auto;
      padding: calc(var(--safe-top) + 12px) 0 60px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
      align-items: start;
    }

    .masthead {
      position: sticky;
      top: var(--safe-top);
      z-index: 20;
      margin-bottom: 14px;
      padding: 14px 14px 12px;
      backdrop-filter: blur(18px);
      background: linear-gradient(180deg, rgba(10, 10, 10, 0.92) 0%, rgba(10, 10, 10, 0.7) 100%);
      border: 1px solid var(--border);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
    }

    body[data-theme="light"] .masthead {
      background: linear-gradient(180deg, rgba(247, 243, 235, 0.9) 0%, rgba(247, 243, 235, 0.72) 100%);
      box-shadow: 0 12px 30px rgba(27, 54, 93, 0.08);
    }

    .masthead-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .masthead-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-toggle {
      display: none;
      appearance: none;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.25s var(--ease);
    }

    body[data-theme="light"] .menu-toggle {
      background: rgba(255, 255, 255, 0.48);
    }

    .menu-toggle:hover,
    .menu-toggle:focus-visible {
      border-color: var(--brand-blue);
      background: rgba(160, 190, 245, 0.08);
    }

    .menu-toggle svg {
      width: 18px;
      height: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
    }

    .brand img {
      width: min(42vw, 210px);
      display: block;
      filter: drop-shadow(0 0 18px rgba(99, 149, 238, 0.14));
    }

    body[data-theme="light"] .brand img {
      filter: drop-shadow(0 0 16px rgba(27, 54, 93, 0.08));
    }

    .theme-toggle {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-soft);
      min-height: 42px;
      padding: 10px 14px;
      border-radius: 999px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.25s var(--ease);
    }

    .theme-toggle:hover,
    .theme-toggle:focus-visible {
      color: var(--text-main);
      border-color: var(--brand-blue);
      background: rgba(160, 190, 245, 0.08);
    }

    body[data-theme="light"] .theme-toggle {
      background: rgba(255, 255, 255, 0.48);
    }

    .type-line {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      padding: 8px 4px 4px;
      color: var(--brand-teal);
      font-family: "IBM Plex Mono", monospace;
      font-size: clamp(0.9rem, 2.4vw, 1.08rem);
      line-height: 1.5;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: normal;
      flex-wrap: wrap;
    }

    .type-line-text {
      min-height: 1.5em;
    }

    .type-cursor {
      display: inline-block;
      width: 0.58em;
      height: 1.05em;
      background: var(--brand-teal);
      box-shadow: 0 0 12px rgba(145, 175, 179, 0.18);
      animation: cursorBlink 1s steps(1, end) infinite;
      transform: translateY(1px);
      flex-shrink: 0;
    }

    @keyframes cursorBlink {
      0%,
      49% {
        opacity: 1;
      }
      50%,
      100% {
        opacity: 0;
      }
    }

    .fragment-card,
    .empty-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.028));
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(16px);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.24);
    }

    body[data-theme="light"] .fragment-card,
    body[data-theme="light"] .empty-card {
      box-shadow: 0 16px 36px rgba(27, 54, 93, 0.08);
    }

    .feed {
      display: grid;
      gap: 12px;
    }

    .feed-controls {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    .load-more-btn {
      appearance: none;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.22s var(--ease);
    }

    .load-more-btn:hover,
    .load-more-btn:focus-visible {
      border-color: var(--brand-blue);
      background: rgba(160, 190, 245, 0.08);
      transform: translateY(-1px);
    }

    body[data-theme="light"] .load-more-btn {
      background: rgba(255, 255, 255, 0.52);
    }

    .signals-rail {
      position: sticky;
      top: calc(var(--safe-top) + 134px);
      display: grid;
      gap: 12px;
    }

    .signals-kicker {
      margin: 0 0 2px;
      color: var(--brand-teal);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .signal-card {
      display: grid;
      gap: 10px;
      padding: 16px 16px 15px;
      text-decoration: none;
      color: inherit;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(145, 175, 179, 0.14);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.026)),
        radial-gradient(circle at top right, rgba(155, 89, 182, 0.11), transparent 48%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.16);
      transition: transform 0.22s var(--ease), border-color 0.22s var(--ease), background 0.22s var(--ease);
      cursor: default;
      pointer-events: none;
    }

    body[data-theme="light"] .signal-card {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.74), rgba(255, 255, 255, 0.64)),
        radial-gradient(circle at top right, rgba(155, 89, 182, 0.08), transparent 48%);
      box-shadow: 0 12px 28px rgba(27, 54, 93, 0.08);
    }

    .signal-card:hover {
      transform: translateY(-1px);
      border-color: rgba(155, 89, 182, 0.22);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.03)),
        radial-gradient(circle at top right, rgba(155, 89, 182, 0.14), transparent 48%);
    }

    .signal-label {
      color: rgba(155, 89, 182, 0.96);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.63rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .signal-title {
      margin: 0;
      color: var(--text-main);
      font-family: "IBM Plex Serif", serif;
      font-size: 1.08rem;
      line-height: 1.18;
      letter-spacing: -0.02em;
    }

    .signal-copy {
      margin: 0;
      color: var(--text-soft);
      font-size: 0.88rem;
      line-height: 1.58;
    }

    .signal-foot {
      color: var(--text-faint);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .signals-disclaimer {
      margin: 2px 2px 0;
      color: var(--text-faint);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.58rem;
      line-height: 1.55;
      letter-spacing: 0.11em;
      text-transform: uppercase;
      opacity: 0.86;
    }

    .fragment-card {
      padding: 18px 18px 16px;
      transition: border-color 0.24s var(--ease), transform 0.24s var(--ease), background 0.24s var(--ease);
    }

    .fragment-card.is-bot {
      border-color: rgba(155, 89, 182, 0.22);
      background: linear-gradient(180deg, rgba(155, 89, 182, 0.09), rgba(255, 255, 255, 0.028));
    }

    body[data-theme="light"] .fragment-card.is-bot {
      border-color: rgba(155, 89, 182, 0.18);
      background: linear-gradient(180deg, rgba(155, 89, 182, 0.08), rgba(255, 255, 255, 0.7));
    }

    .fragment-card:hover {
      border-color: var(--border-strong);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.065), rgba(255, 255, 255, 0.03));
      transform: translateY(-1px);
    }

    .fragment-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .fragment-identity {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .fragment-avatar {
      width: 46px;
      height: 46px;
      border-radius: 999px;
      object-fit: cover;
      object-position: center;
      border: 1px solid rgba(160, 190, 245, 0.16);
      box-shadow:
        0 0 0 3px rgba(155, 89, 182, 0.08),
        0 12px 26px rgba(0, 0, 0, 0.22);
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.04);
    }

    .fragment-avatar.initials-avatar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      letter-spacing: 0.08em;
      color: #f5f7fb;
      background:
        radial-gradient(circle at 30% 25%, rgba(160, 190, 245, 0.34), transparent 38%),
        linear-gradient(145deg, rgba(155, 89, 182, 0.9), rgba(99, 149, 238, 0.62));
    }

    .fragment-avatar.bot-avatar {
      background:
        radial-gradient(circle at 30% 30%, rgba(160, 190, 245, 0.12), transparent 45%),
        rgba(255, 255, 255, 0.04);
      border-color: rgba(155, 89, 182, 0.28);
      box-shadow:
        0 0 0 3px rgba(155, 89, 182, 0.12),
        0 12px 26px rgba(0, 0, 0, 0.22);
    }

    body[data-theme="light"] .fragment-avatar.bot-avatar {
      color: #fff;
      box-shadow:
        0 0 0 3px rgba(155, 89, 182, 0.1),
        0 10px 22px rgba(27, 54, 93, 0.12);
    }

    .fragment-id {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .fragment-title {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .fragment-title-top {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .fragment-name {
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.97rem;
      min-width: 0;
    }

    .fragment-handle {
      color: var(--text-faint);
      font-size: 0.82rem;
      line-height: 1.3;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .fragment-tag {
      width: fit-content;
      color: var(--brand-blue);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .fragment-card.is-bot .fragment-tag {
      color: #9B59B6;
    }

    .verified-badge {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: inline-block;
    }

    .fragment-time {
      color: var(--text-faint);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.68rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: right;
      flex-shrink: 0;
      white-space: normal;
      line-height: 1.45;
      max-width: 170px;
    }

    .fragment-body {
      margin: 0;
      color: var(--text-main);
      font-size: 1.02rem;
      line-height: 1.72;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .fragment-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-faint);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .fragment-foot .dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: rgba(145, 175, 179, 0.35);
    }

    .fragment-foot-meta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .fragment-reactions {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      margin-left: auto;
    }

    .fragment-reactions .webReactionz {
      gap: 6px;
    }

    .fragment-reactions .webReactionz .emoji {
      filter: saturate(0.92);
      opacity: 0.9;
    }

    .empty-card {
      padding: 28px 22px;
      text-align: left;
    }

    .empty-title {
      margin: 0 0 10px;
      font-family: "IBM Plex Serif", serif;
      font-size: 1.5rem;
      letter-spacing: -0.03em;
    }

    .empty-copy {
      margin: 0;
      color: var(--text-soft);
      line-height: 1.75;
    }

    .empty-code {
      display: block;
      margin-top: 14px;
      color: var(--brand-light-blue);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    @media (max-width: 940px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .signals-rail {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .shell {
        width: min(760px, calc(100% - 12px));
        padding-top: calc(var(--safe-top) + 14px);
      }

      .masthead {
        padding: 12px 12px 10px;
      }

      .masthead-inner {
        position: relative;
      }

      .brand img {
        width: min(52vw, 210px);
      }

      .menu-toggle {
        display: inline-flex;
        margin-left: auto;
      }

      .masthead-actions {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: min(210px, calc(100vw - 32px));
        padding: 10px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: rgba(10, 10, 10, 0.94);
        backdrop-filter: blur(18px);
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.26);
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-6px);
        transition: 0.22s var(--ease);
      }

      body[data-theme="light"] .masthead-actions {
        background: rgba(247, 243, 235, 0.96);
        box-shadow: 0 18px 36px rgba(27, 54, 93, 0.12);
      }

      .masthead-actions.is-open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .theme-toggle {
        width: 100%;
      }

      .fragment-card,
      .empty-card {
        border-radius: 24px;
      }

      .fragment-card {
        padding: 16px 16px 14px;
      }

      .fragment-head {
        flex-direction: column;
        gap: 8px;
      }

      .fragment-identity {
        width: 100%;
      }

      .fragment-head {
        flex-direction: column;
        align-items: stretch;
      }

      .fragment-time {
        max-width: none;
        text-align: left;
      }

      .fragment-body {
        font-size: 0.98rem;
        line-height: 1.68;
      }

      .fragment-foot {
        align-items: flex-start;
      }

      .fragment-reactions {
        width: 100%;
        justify-content: flex-start;
        margin-left: 0;
      }

      .fragment-reactions .webReactionz {
        justify-content: flex-start;
        text-align: left;
        flex-wrap: nowrap;
        white-space: nowrap;
      }

      .fragment-reactions .webReactionz .emojis {
        justify-content: flex-start;
        flex-wrap: nowrap;
        white-space: nowrap;
      }

      .fragment-reactions .webReactionz > div:last-child {
        display: inline-flex;
        align-items: center;
        flex: 0 0 auto;
        margin-left: 6px;
      }

      .fragment-reactions .webReactionz img.branding {
        width: 20px;
        height: 20px;
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="masthead-inner">
        <a class="brand" href="personal.html" aria-label="Return to OTW feed">
          <img id="fragmentsLogo" src="Images/fragments.svg" alt="Fragments" />
        </a>
        <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="mastheadActions" aria-label="Open settings menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 17h16"></path>
          </svg>
        </button>
        <div class="masthead-actions" id="mastheadActions">
          <button class="theme-toggle" id="refreshFeedBtn" type="button">Refresh Feed</button>
          <button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false">Light Mode</button>
        </div>
      </div>
    </header>

    <div class="type-line" id="fragments-title" aria-label="Welcome to my narrow little ledge">
      <span class="type-line-text" id="typeLineText" data-full-text="Welcome to my narrow little ledge"></span>
      <span class="type-cursor" aria-hidden="true"></span>
    </div>

    <div class="content-grid">
      <main class="feed" id="fragmentsFeed" aria-live="polite"></main>
      <aside class="signals-rail" id="signalsRail" aria-label="Sponsored signals">
        <p class="signals-kicker">Sponsored Signals</p>
      </aside>
    </div>
    <div class="feed-controls" id="feedControls" hidden>
      <button class="load-more-btn" id="loadMoreBtn" type="button">Load 10 More</button>
    </div>
  </div>

  <script>
    const sponsoredSignals = [
      {
        label: 'Sponsored // Utility',
        title: 'Porch Light Premium',
        copy: 'For thoughts too small to become cathedrals, but too loud to leave in the dark.',
        foot: 'No subscription required'
      },
      {
        label: 'Ad // Civic Service',
        title: 'Queen Creek Signal Repair',
        copy: 'We align crossed wires, unhelpful narratives, and at least one avoidable mood spiral per quarter.',
        foot: 'Walk-ins mildly tolerated'
      },
      {
        label: 'OTW_Bot Recommends',
        title: 'Adequacy Plus',
        copy: 'Now with 14% less self-explanation. Suitable for notes, drafts, and emotionally overqualified sentences.',
        foot: 'Trusted by one machine'
      },
      {
        label: 'Market Notice',
        title: 'Continuity Insurance',
        copy: 'Protect your emotional narrative against outages, revisions, and unlicensed overthinking.',
        foot: 'Claims processed eventually'
      },
      {
        label: 'Public Notice',
        title: 'Unfinished Thoughts Archive',
        copy: 'Drop off three half-formed insights and receive one slightly better sentence by post.',
        foot: 'Postage not included'
      },
      {
        label: 'Residue Services',
        title: 'Portable Meaning',
        copy: 'Now available in travel size for airports, waiting rooms, and minor personal reckonings.',
        foot: 'Fits in carry-on luggage'
      },
      {
        label: 'Promotional Consideration',
        title: 'Signal Socks',
        copy: 'For anyone trying to maintain dignity while standing in the kitchen having a private crisis.',
        foot: 'Left and right sold separately'
      },
      {
        label: 'Ad // Household',
        title: 'Archive Dust Management',
        copy: 'Because every memory deserves a tasteful shelf and at least one soft cloth.',
        foot: 'Recommended by nobody official'
      },
      {
        label: 'Sponsored // Emotional Weather',
        title: 'Provisional Calm',
        copy: 'A temporary holding pattern for thoughts that insist on filing themselves as emergencies.',
        foot: 'Mildly lavender-scented'
      },
      {
        label: 'Systems Update',
        title: 'Porchlight Pro Max',
        copy: 'For users who accidentally built a cathedral and now need tasteful exterior guidance.',
        foot: 'Batteries spiritually included'
      },
      {
        label: 'OTW_Bot Classifieds',
        title: 'Sentence Straightening',
        copy: 'Bent clauses, overgrown metaphors, and emotionally swollen adverbs restored to serviceable condition.',
        foot: 'One quote per customer'
      },
      {
        label: 'Ad // Household',
        title: 'Countertop Theology',
        copy: 'Now available in a wipe-clean finish for revelations that arrive during dish duty.',
        foot: 'Pairs well with coffee'
      },
      {
        label: 'Sponsored // Field Gear',
        title: 'Mood Lantern 2',
        copy: 'Casts a flattering light on passing insights and most forms of low-grade existential drift.',
        foot: 'Not safe for committee use'
      },
      {
        label: 'Civic Tender',
        title: 'Local Certainty Exchange',
        copy: 'Trade five opinions and receive one modest conviction suitable for everyday use.',
        foot: 'Hours vary by temperament'
      },
      {
        label: 'Promotional Signal',
        title: 'Perspective Ration Pack',
        copy: 'Shelf-stable reassurance for long stretches of scrolling, spiraling, or professional Mondayness.',
        foot: 'Now in family size'
      }
    ];

    const FRAGMENTS_PAGE_SIZE = 10;
    let allFragments = [];
    let visibleFragmentCount = FRAGMENTS_PAGE_SIZE;

    function shuffleArray(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    async function loadFragmentsData() {
      const cacheBust = `ts=${Date.now()}`;
      const response = await fetch(`fragments_data.js?${cacheBust}`, {
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error(`Could not load fragments data: ${response.status}`);
      }

      const scriptText = await response.text();
      const sandbox = {};
      const evaluator = new Function(
        "sandbox",
        `${scriptText}; sandbox.otw_fragments = typeof window !== "undefined" && Array.isArray(window.otw_fragments) ? window.otw_fragments : [];`
      );

      const previousFragments = typeof window !== 'undefined' ? window.otw_fragments : undefined;
      evaluator(sandbox);

      const fragments = Array.isArray(window.otw_fragments) ? window.otw_fragments : [];
      if (typeof window !== 'undefined') {
        if (typeof previousFragments === 'undefined') {
          delete window.otw_fragments;
        } else {
          window.otw_fragments = previousFragments;
        }
      }

      return fragments;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function slugify(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function buildFragmentId(fragment) {
      const stamp = String(fragment.timestamp || 'undated').replace(/[^0-9]/g, '');
      const bodyStub = slugify(String(fragment.text || '').split(/\s+/).slice(0, 8).join(' ')) || 'fragment';
      return `${stamp}--${bodyStub}`;
    }

    function getInitials(value) {
      const parts = String(value || '')
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2);

      if (!parts.length) {
        return 'OT';
      }

      return parts.map((part) => part.charAt(0).toUpperCase()).join('');
    }

    function buildInitialsAvatar(name) {
      return `<div class="fragment-avatar initials-avatar" aria-hidden="true">${escapeHtml(getInitials(name))}</div>`;
    }

    function getAuthorProfile(fragment) {
      const author = String(fragment.author || '').trim();
      const authorHandle = String(fragment.author_handle || '').trim();
      const authorAvatar = String(fragment.author_avatar || '').trim();

      if (author === 'OTW_Bot') {
        return {
          name: 'OTW_Bot',
          handle: authorHandle || '@otw_bot',
          avatarHtml: '<img class="fragment-avatar bot-avatar" src="Images/OTW_Bot.png" alt="OTW_Bot" />',
          isBot: true
        };
      }

      if (
        author.toLowerCase() === 'emily' ||
        author.toLowerCase() === 'emily burningham' ||
        authorHandle.toLowerCase() === '@word.person' ||
        authorHandle.toLowerCase() === 'word.person'
      ) {
        return {
          name: 'Emily',
          handle: '@word.person',
          avatarHtml: '<img class="fragment-avatar" src="Images/IG_Emmy.jpg" alt="Emily" />',
          isBot: false
        };
      }

      if (authorAvatar) {
        return {
          name: author || 'OTW',
          handle: authorHandle || '@outsidetheworld',
          avatarHtml: `<img class="fragment-avatar" src="${escapeHtml(authorAvatar)}" alt="${escapeHtml(author || 'Fragment author')}" />`,
          isBot: false
        };
      }

      if (author || authorHandle) {
        const displayName = author || authorHandle.replace(/^@+/, '') || 'OTW';
        return {
          name: displayName,
          handle: authorHandle || `@${slugify(displayName).replace(/-/g, '_')}`,
          avatarHtml: buildInitialsAvatar(displayName),
          isBot: false
        };
      }

      return {
        name: author || 'The_RyanDavid',
        handle: authorHandle || '@outsidetheworld',
        avatarHtml: '<img class="fragment-avatar" src="Images/Profile.jpg" alt="The_RyanDavid" />',
        isBot: false
      };
    }

    function formatTimestamp(timestamp) {
      const value = new Date(timestamp);
      if (Number.isNaN(value.getTime())) {
        return escapeHtml(timestamp);
      }

      return new Intl.DateTimeFormat('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric',
        hour: 'numeric',
        minute: '2-digit'
      }).format(value);
    }

    function renderEmptyState(container) {
      container.innerHTML = `
        <section class="empty-card">
          <h2 class="empty-title">No fragments yet.</h2>
          <p class="empty-copy">When you're ready, add a short entry to <code>fragments_data.js</code> and it will appear here.</p>
          <span class="empty-code">{
  "timestamp": "2026-03-14T21:42:00-07:00",
  "text": "A short thought, fragment, or passing signal.",
  "tag": "FIELD_NOTE"
}</span>
        </section>
      `;
    }

    function renderSponsoredSignals() {
      const rail = document.getElementById('signalsRail');
      if (!rail) {
        return;
      }

      const picks = shuffleArray(sponsoredSignals).slice(0, 3);
      rail.innerHTML = `
        <p class="signals-kicker">Sponsored Signals</p>
        ${picks.map((signal) => `
          <a class="signal-card" href="#" tabindex="-1" aria-hidden="true">
            <div class="signal-label">${escapeHtml(signal.label)}</div>
            <h2 class="signal-title">${escapeHtml(signal.title)}</h2>
            <p class="signal-copy">${escapeHtml(signal.copy)}</p>
            <div class="signal-foot">${escapeHtml(signal.foot)}</div>
          </a>
        `).join('')}
        <p class="signals-disclaimer">Randomly generated by OTW.ai. A distant cousin to OTW.Bot, maybe.<br>Every attempt has been made to be mildly offensive and dry.</p>
      `;
    }

    function initReactionWidgets(items) {
      if (!Array.isArray(items) || !items.length) {
        return;
      }

      const ReactionzCtor =
        typeof WebReactionz === 'function'
          ? WebReactionz
          : typeof window.WebReactionz === 'function'
            ? window.WebReactionz
            : null;

      if (!ReactionzCtor) {
        window.setTimeout(() => initReactionWidgets(items), 220);
        return;
      }

      items.forEach((fragment) => {
        const fragmentId = buildFragmentId(fragment);
        const selector = `#reactions-${fragmentId}`;
        const target = document.querySelector(selector);
        if (!target || target.dataset.reactionsReady === 'true') {
          return;
        }

        target.dataset.reactionsReady = 'true';
        new ReactionzCtor({
          siteId: '0b926b89-1467-4ef1-a8d4-ca95543047a3',
          domSelector: selector,
          pageId: `fragment:${fragmentId}`
        }).init();
      });
    }

    function buildFragmentCard(fragment) {
      const tag = fragment.tag ? `<div class="fragment-tag">${escapeHtml(fragment.tag)}</div>` : '';
      const timestamp = formatTimestamp(fragment.timestamp || '');
      const authorProfile = getAuthorProfile(fragment);
      const isBot = authorProfile.isBot;
      const fragmentId = buildFragmentId(fragment);

      return `
        <article class="fragment-card${isBot ? ' is-bot' : ''}" id="fragment-${fragmentId}" data-fragment-id="${fragmentId}">
          <div class="fragment-head">
            <div class="fragment-identity">
              ${authorProfile.avatarHtml}
              <div class="fragment-id">
                <div class="fragment-title">
                  <div class="fragment-title-top">
                    <div class="fragment-name">${escapeHtml(authorProfile.name)}</div>
                    <svg class="verified-badge" viewBox="0 0 24 24" aria-label="Verified">
                      <path fill="#9B59B6" d="M12 1.8l2.76 1.58 3.16-.23 1.58 2.76 2.76 1.58-.23 3.16L23 12l-1.97 2.55.23 3.16-2.76 1.58-1.58 2.76-3.16-.23L12 22.2l-2.76-1.58-3.16.23-1.58-2.76-2.76-1.58.23-3.16L1 12l1.97-2.55-.23-3.16 2.76-1.58 1.58-2.76 3.16.23L12 1.8z"></path>
                      <path fill="#F5F7FB" d="M10.55 15.62l-2.6-2.6 1.2-1.2 1.4 1.4 4.26-4.26 1.2 1.2z"></path>
                    </svg>
                  </div>
                  <div class="fragment-handle">${escapeHtml(authorProfile.handle)}</div>
                </div>
                ${tag}
              </div>
            </div>
            <div class="fragment-time">${timestamp}</div>
          </div>
          <p class="fragment-body">${escapeHtml(fragment.text || '')}</p>
          <div class="fragment-foot">
            <div class="fragment-foot-meta">
              <span>Fragment</span>
              <span class="dot" aria-hidden="true"></span>
              <span>OTW</span>
            </div>
            <div class="fragment-reactions" id="reactions-${fragmentId}"></div>
          </div>
        </article>
      `;
    }

    function updateLoadMoreControls() {
      const controls = document.getElementById('feedControls');
      const button = document.getElementById('loadMoreBtn');
      if (!controls || !button) {
        return;
      }

      const remaining = Math.max(0, allFragments.length - visibleFragmentCount);
      controls.hidden = remaining <= 0;
      if (remaining > 0) {
        button.textContent = `Load ${Math.min(FRAGMENTS_PAGE_SIZE, remaining)} More`;
      }
    }

    function renderVisibleFragments(requestedEntryId = null) {
      const container = document.getElementById('fragmentsFeed');
      const items = allFragments.slice(0, visibleFragmentCount);
      container.innerHTML = items.map(buildFragmentCard).join('');
      initReactionWidgets(items);
      updateLoadMoreControls();

      if (requestedEntryId && typeof CSS !== 'undefined' && CSS.escape) {
        const requestedNode = document.querySelector(`[data-fragment-id="${CSS.escape(requestedEntryId)}"]`);
        if (requestedNode) {
          requestedNode.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    }

    async function renderFragments() {
      const container = document.getElementById('fragmentsFeed');
      let fragments = [];

      try {
        fragments = await loadFragmentsData();
      } catch (error) {
        container.innerHTML = `
          <section class="empty-card">
            <h2 class="empty-title">Feed temporarily unavailable.</h2>
            <p class="empty-copy">${escapeHtml(error.message || 'Could not load fragments right now.')}</p>
          </section>
        `;
        return;
      }

      const requestedEntryId = new URLSearchParams(window.location.search).get('entry');
      allFragments = fragments.slice();

      if (!allFragments.length) {
        renderEmptyState(container);
        updateLoadMoreControls();
        return;
      }

      visibleFragmentCount = FRAGMENTS_PAGE_SIZE;

      if (requestedEntryId) {
        const requestedIndex = allFragments.findIndex((fragment) => buildFragmentId(fragment) === requestedEntryId);
        if (requestedIndex >= 0) {
          visibleFragmentCount = Math.max(FRAGMENTS_PAGE_SIZE, requestedIndex + 1);
        }
      }

      renderVisibleFragments(requestedEntryId);
    }

    function applyTheme(theme) {
      const nextTheme = theme === 'light' ? 'light' : 'dark';
      const body = document.body;
      const toggle = document.getElementById('themeToggle');
      const logo = document.getElementById('fragmentsLogo');
      const themeMeta = document.querySelector('meta[name="theme-color"]');

      body.dataset.theme = nextTheme;
      if (toggle) {
        toggle.textContent = nextTheme === 'light' ? 'Dark Mode' : 'Light Mode';
        toggle.setAttribute('aria-pressed', String(nextTheme === 'light'));
      }
      if (logo) {
        logo.src = nextTheme === 'light' ? 'Images/fragments_dark.svg' : 'Images/fragments.svg';
      }
      if (themeMeta) {
        themeMeta.setAttribute('content', nextTheme === 'light' ? '#f4efe6' : '#0a0a0a');
      }
      window.localStorage.setItem('otwFragmentsTheme', nextTheme);
    }

    function hydrateTheme() {
      const saved = window.localStorage.getItem('otwFragmentsTheme');
      applyTheme(saved || 'dark');
    }

    function setMenuState(isOpen) {
      const menu = document.getElementById('mastheadActions');
      const toggle = document.getElementById('menuToggle');
      menu.classList.toggle('is-open', isOpen);
      toggle.setAttribute('aria-expanded', String(isOpen));
    }

    function runTypeLine() {
      const typeLine = document.getElementById('typeLineText');
      if (!typeLine) {
        return;
      }

      const fullText = typeLine.dataset.fullText || '';
      let index = 0;
      typeLine.textContent = '';

      function step() {
        if (index >= fullText.length) {
          return;
        }
        typeLine.textContent += fullText.charAt(index);
        index += 1;
        window.setTimeout(step, index < 10 ? 42 : 30);
      }

      window.setTimeout(step, 180);
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = document.body.dataset.theme === 'light' ? 'light' : 'dark';
      applyTheme(current === 'light' ? 'dark' : 'light');
      if (window.innerWidth <= 640) {
        setMenuState(false);
      }
    });
    document.getElementById('refreshFeedBtn').addEventListener('click', async () => {
      await renderFragments();
      if (window.innerWidth <= 640) {
        setMenuState(false);
      }
    });
    document.getElementById('menuToggle').addEventListener('click', () => {
      const menu = document.getElementById('mastheadActions');
      setMenuState(!menu.classList.contains('is-open'));
    });
    document.getElementById('loadMoreBtn').addEventListener('click', () => {
      visibleFragmentCount += FRAGMENTS_PAGE_SIZE;
      renderVisibleFragments();
    });
    document.addEventListener('click', (event) => {
      if (window.innerWidth > 640) {
        return;
      }
      const menu = document.getElementById('mastheadActions');
      const toggle = document.getElementById('menuToggle');
      if (!menu.contains(event.target) && !toggle.contains(event.target)) {
        setMenuState(false);
      }
    });
    window.addEventListener('resize', () => {
      if (window.innerWidth > 640) {
        setMenuState(false);
      }
    });

    hydrateTheme();
    renderSponsoredSignals();
    renderFragments();
    runTypeLine();
  </script>
  <script async defer src="https://cdn.jsdelivr.net/gh/intersect-software/web-reactionz@1/public/setup.min.js" data-siteid="0b926b89-1467-4ef1-a8d4-ca95543047a3" data-noautoinit="1"></script>
</body>

            letter-spacing: 2px;
            text-transform: uppercase;

            font-family: 'Fira Code';

            width: 100%;

            border-left: 3px solid transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);

            text-decoration: none;
        }

        .post-item:hover {

    <script>
        function slugify(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/&/g, ' and ')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        function buildPostId(post) {
            return `${post.date || 'undated'}--${slugify(post.title || 'untitled')}`;
        }

        function postPermanentPath(post) {
            const file = String(post && post.file ? post.file : '').split('/').pop();
            const stem = file.replace(/\.md$/i, '');
            return `wayback/${slugify(stem || buildPostId(post))}.html`;
        }

        function buildShareUrl(post) {
            return new URL(postPermanentPath(post), window.location.origin).toString();
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                ta.remove();
                return ok;
            }
        }

        async function sharePostLink(index) {
            const post = allResidue[index];
            if (!post) return;

            const shareUrl = buildShareUrl(post);
            const shareTitle = post.title || 'Wayback Entry';
            const statusEl = document.getElementById('share-status');

            try {
                if (navigator.share) {
                    await navigator.share({
                        title: shareTitle,
                        text: `${shareTitle} // The Wayback`,
                        url: shareUrl
                    });
                    if (statusEl) statusEl.textContent = 'LINK_SHARED';
                    return;
                }

                const ok = await copyToClipboard(shareUrl);
                if (statusEl) statusEl.textContent = ok ? 'LINK_COPIED' : 'COPY_FAILED';
            } catch {
                if (statusEl) statusEl.textContent = 'SHARE_CANCELLED';
            }
        }

        function updateUrlForPost(post, replace = false) {
            const url = new URL(window.location.href);
            url.searchParams.set('post', buildPostId(post));
            const next = `${url.pathname}${url.search}${url.hash}`;
            const state = { postId: buildPostId(post) };

            if (replace) {
                history.replaceState(state, '', next);
            } else {
                history.pushState(state, '', next);
            }
        }

        function findResidueIndexById(postId) {
            if (!postId) return -1;
            return allResidue.findIndex((post) => buildPostId(post) === postId);
        }

        function decodeEntities(value) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = String(value ?? '');
            return textarea.value;
        }

        function escapeHtml(value) {
            return decodeEntities(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function parseLegacyAttributes(value) {
            const attributes = {};
            const pattern = /([^\s=/>]+)\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s>]+))/gi;
            let match;

            while ((match = pattern.exec(String(value || ''))) !== null) {
                attributes[match[1].toLowerCase()] = decodeEntities(match[2] ?? match[3] ?? match[4] ?? '').trim();
            }

            return attributes;
        }

        function archiveAlignmentClass(value) {
            return {
                alignleft: 'archive-media--left',
                alignright: 'archive-media--right',
                aligncenter: 'archive-media--center'
            }[String(value || '').toLowerCase()] || '';
        }

        function expandLegacyCaptionShortcodes(value) {
            return String(value || '').replace(
                /\[caption\b([^\]]*)\]\s*(<img\b[^>]*>)\s*\[\/caption\]/gi,
                (_, rawAttributes, imageTag) => {
                    const attributes = parseLegacyAttributes(rawAttributes);
                    const alignment = archiveAlignmentClass(attributes.align);
                    const caption = attributes.caption
                        ? `<figcaption>${escapeHtml(attributes.caption)}</figcaption>`
                        : '';
                    return `<figure class="archive-media ${alignment}">${imageTag}${caption}</figure>`;
                }
            );
        }

        function renderMarkdownLinks(root) {
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const textNodes = [];
            let node;

            while ((node = walker.nextNode())) {
                if (!node.parentElement?.closest('a, script, style, figcaption')) {
                    textNodes.push(node);
                }
            }

            textNodes.forEach(textNode => {
                const value = textNode.nodeValue || '';
                const pattern = /\[([^\]\n]+)\]\(([^)\s]+)\)/g;
                const fragment = document.createDocumentFragment();
                let cursor = 0;
                let match;
                let changed = false;

                while ((match = pattern.exec(value)) !== null) {
                    let parsedUrl;
                    try {
                        parsedUrl = new URL(match[2], window.location.href);
                    } catch {
                        continue;
                    }
                    if (!['http:', 'https:', 'mailto:'].includes(parsedUrl.protocol)) continue;

                    fragment.append(document.createTextNode(value.slice(cursor, match.index)));
                    const anchor = document.createElement('a');
                    anchor.href = parsedUrl.href;
                    anchor.textContent = match[1];
                    anchor.rel = 'noopener noreferrer';
                    anchor.target = '_blank';
                    fragment.append(anchor);
                    cursor = pattern.lastIndex;
                    changed = true;
                }

                if (!changed) return;
                fragment.append(document.createTextNode(value.slice(cursor)));
                textNode.replaceWith(fragment);
            });
        }

        function sanitizeArchiveBody(html) {
            const template = document.createElement('template');
            template.innerHTML = expandLegacyCaptionShortcodes(decodeEntities(html));

            const blockedTags = ['script', 'style', 'iframe', 'object', 'embed', 'link', 'meta'];
            blockedTags.forEach(tag => {
                template.content.querySelectorAll(tag).forEach(node => node.remove());
            });

            template.content.querySelectorAll('*').forEach(node => {
                [...node.attributes].forEach(attr => {
                    const name = attr.name.toLowerCase();
                    const value = attr.value.trim();

                    if (name.startsWith('on')) {
                        node.removeAttribute(attr.name);
                        return;
                    }

                    if ((name === 'src' || name === 'href') && /^javascript:/i.test(value)) {
                        node.removeAttribute(attr.name);
                        return;
                    }

                    if (!['img', 'a'].includes(node.tagName.toLowerCase()) && ['src', 'href'].includes(name)) {
                        node.removeAttribute(attr.name);
                    }
                });

                if (node.tagName.toLowerCase() === 'a') {
                    node.setAttribute('rel', 'noopener noreferrer');
                    if (!node.getAttribute('target')) {
                        node.setAttribute('target', '_blank');
                    }
                }

                if (node.tagName.toLowerCase() === 'img') {
                    node.setAttribute('loading', 'lazy');
                    node.setAttribute('decoding', 'async');
                }
            });

            [...template.content.querySelectorAll('img')]
                .filter(image => !image.closest('figure'))
                .forEach(image => {
                    const figure = document.createElement('figure');
                    const alignment = ['alignleft', 'alignright', 'aligncenter']
                        .find(className => image.classList.contains(className));
                    figure.className = `archive-media ${archiveAlignmentClass(alignment)}`.trim();
                    image.before(figure);
                    figure.append(image);
                });

            template.content.querySelectorAll('figure').forEach(figure => {
                const previous = figure.previousSibling;
                const next = figure.nextSibling;
                if (previous?.nodeType === Node.TEXT_NODE) {
                    previous.nodeValue = (previous.nodeValue || '').replace(/(?:\r?\n[\t ]*)+$/, '');
                }
                if (next?.nodeType === Node.TEXT_NODE) {
                    next.nodeValue = (next.nodeValue || '').replace(/^(?:[\t ]*\r?\n)+/, '');
                }
            });

            renderMarkdownLinks(template.content);

            return template.innerHTML;
        }

        function markUnavailableArchiveImage(image) {
            const figure = image.closest('figure');
            if (!figure || figure.classList.contains('archive-media--missing')) return;

            figure.classList.remove('archive-media--left', 'archive-media--right', 'archive-media--center');
            figure.classList.add('archive-media', 'archive-media--missing');
            image.remove();
            if (!figure.querySelector('figcaption')) {
                const caption = document.createElement('figcaption');
                caption.textContent = 'This photograph did not survive the archive.';
                figure.append(caption);
            }
        }

        function monitorArchiveImages(root) {
            root.querySelectorAll('.entry-body img').forEach(image => {
                image.addEventListener('error', () => markUnavailableArchiveImage(image), { once: true });
                if (image.complete && image.naturalWidth === 0) {
                    markUnavailableArchiveImage(image);
                }
            });
        }

        const ERA_MAP = {
            COMMERCE: {
                label: "COX_ERA",
                glow: "linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)"
            },
            APPLE: {
                label: "APPLE_ERA",
                glow: "linear-gradient(135deg, #13547a 0%, #80d0c7 100%)"
            },
            CURRENT: {
                label: "CFSS_ERA",
                glow: "linear-gradient(135deg, #2c3e50 0%, #4b6cb7 100%)"
            }
        };

        const allResidue = wayback_raw_dump.map(post => {
            let eraConfig = ERA_MAP.CURRENT;
            const yearNum = parseInt(post.year);
            if (yearNum >= 2002 && yearNum <= 2008) {
                eraConfig = ERA_MAP.COMMERCE;
            } else if (yearNum >= 2009 && yearNum <= 2013) {
                eraConfig = ERA_MAP.APPLE;
            } else if (yearNum >= 2014) {
                eraConfig = ERA_MAP.CURRENT;
            }
            return { ...post, eraLabel: eraConfig.label, thumbprint: eraConfig.glow };
        });

        function initWayback() {
            const select = document.getElementById('year-select');
            const years = [...new Set(allResidue.map(p => p.year))].sort((a, b) => b - a);
            const groups = [
                { label: 'CFSS_ERA', years: years.filter(y => Number(y) >= 2014) },
                { label: 'APPLE_ERA', years: years.filter(y => Number(y) >= 2009 && Number(y) <= 2013) },
                { label: 'COX_ERA', years: years.filter(y => Number(y) >= 2002 && Number(y) <= 2008) }
            ];

            groups.forEach(group => {
                if (group.years.length === 0) return;
                const optgroup = document.createElement('optgroup');
                optgroup.label = group.label;

                group.years.forEach(y => {
                    const opt = document.createElement('option');
                    opt.value = y;
                    opt.textContent = `ERA_${y}`;
                    optgroup.appendChild(opt);
                });

                select.appendChild(optgroup);
            });

            const requestedPostId = new URLSearchParams(window.location.search).get('post');
            const requestedIndex = findResidueIndexById(requestedPostId);

            if (requestedIndex >= 0) {
                const requestedPost = allResidue[requestedIndex];
                select.value = requestedPost.year;
                renderEra(requestedPost.year);
                displayEntry(requestedIndex, { replaceUrl: true });
            } else {
                randomizeArchive();
            }
        }

        function renderEra(year) {
            const list = document.getElementById('post-list');
            list.innerHTML = "";
            allResidue.forEach((post, index) => {
                if (post.year == year) {
                    const item = document.createElement('a');
                    item.className = 'post-item';
                    item.setAttribute('data-id', index);
                    item.dataset.postId = buildPostId(post);
                    item.href = postPermanentPath(post);
                    item.onclick = (event) => {
                        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
                        event.preventDefault();
                        displayEntry(index);
                    };
                    item.innerHTML = `<h3>${escapeHtml(post.title)}</h3><span>${escapeHtml(post.date)}</span>`;
                    list.appendChild(item);
                }
            });
        }

        function filterEra() { renderEra(document.getElementById('year-select').value); }

        function displayEntry(index, options = {}) {
            const container = document.getElementById('glass-container');
            const post = allResidue[index];
            if (!post) return;

            document.body.style.background = `radial-gradient(circle at bottom right, rgba(0,0,0,0.8) 0%, var(--bg-dark) 100%), ${post.thumbprint}`;
            document.body.style.backgroundBlendMode = "overlay";

            container.classList.remove('visible');
            setTimeout(() => {
                container.innerHTML = `
                    <h1 class="entry-title">${escapeHtml(post.title)}</h1>
                    <div class="entry-toolbar">
                        <div class="entry-meta">ERA: ${escapeHtml(post.eraLabel)} // ${escapeHtml(post.date)}</div>
                        <div class="share-controls">
                            <button type="button" class="share-btn" onclick="sharePostLink(${index})">COPY / SHARE LINK</button>
                            <span class="share-status" id="share-status">SHAREABLE_WAYBACK_SIGNAL</span>
                        </div>
                    </div>
                    <div class="entry-body">${sanitizeArchiveBody(post.body)}</div>
                `;
                monitorArchiveImages(container);
                container.classList.add('visible');

                // --- THE MOBILE SNAP ---
                if (window.innerWidth <= 1024) {
                    // Smoothly scroll the content into the viewport
                    document.getElementById('scroll-target').scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                } else {
                    // On desktop, just reset the scroll of the pane itself
                    document.getElementById('scroll-target').scrollTop = 0;
                }
            }, 400);

            document.querySelectorAll('.post-item').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-id') == index);
            });

            updateUrlForPost(post, Boolean(options.replaceUrl));
        }

        // --- NEW: THE RANDOM ACCESS PROTOCOL ---
        function randomizeArchive() {
            if (allResidue.length === 0) return;

            const randomIndex = Math.floor(Math.random() * allResidue.length);
            const randomPost = allResidue[randomIndex];

            // 1. Update the dropdown selector to the correct year
            document.getElementById('year-select').value = randomPost.year;

            // 2. Render that specific era's list so the active state shows up
            renderEra(randomPost.year);

            // 3. Display the actual entry
            displayEntry(randomIndex);
        }

        window.addEventListener('popstate', () => {
            const postId = new URLSearchParams(window.location.search).get('post');
            const index = findResidueIndexById(postId);
            if (index >= 0) {
                const post = allResidue[index];
                document.getElementById('year-select').value = post.year;
                renderEra(post.year);
                displayEntry(index, { replaceUrl: true });
            }
        });

        window.onload = initWayback;
    </script>
</body>

</html>

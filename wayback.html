<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Wayback | Outside The World</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="var(--bg-dark)">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;900&family=Fira+Code:wght@300;500&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap');

        :root {
            --brand-blue: var(--brand-blue);
            --brand-teal: var(--brand-teal);
            --bg-dark: var(--bg-dark);
            --border-low: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(0, 0, 0, 0.6);
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 1.5s ease;
        }

        /* SIDEBAR / DIRECTORY */
        .directory {
            width: 380px;
            border-right: 1px solid var(--border-low);
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            z-index: 100;
            flex-shrink: 0;
        }

        .dir-header {
            padding: 40px;
            border-bottom: 1px solid var(--border-low);
            text-align: center;
        }

        .sidebar-logo {
            width: 200px;
            display: block;
            margin: 0 auto 20px;
            transition: 0.3s;
        }

        .sidebar-logo:hover {
            transform: scale(1.02);
            opacity: 0.8;
        }

        .tuning-knob {
            padding: 20px 40px;
        }

        .knob-label {
            font-family: 'Fira Code';
            font-size: 0.55rem;
            color: #555;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        select.era-filter {
            background: #111;
            border: 1px solid var(--border-low);
            color: var(--brand-teal);
            font-family: 'Fira Code';
            font-size: 0.7rem;
            padding: 10px;
            width: 100%;
            outline: none;
            appearance: none;
            cursor: pointer;
        }

        .post-list {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .post-item {
            padding: 15px 40px;
            cursor: pointer;
            transition: 0.3s;
            border-left: 3px solid transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .post-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .post-item.active {
            background: rgba(99, 149, 238, 0.1);
            border-left-color: var(--brand-blue);
        }

        .post-item h3 {
            font-family: 'Fira Code';
            font-size: 0.75rem;
            margin: 0 0 5px 0;
            color: #eee;
            font-weight: 500;
        }

        .post-item span {
            font-size: 0.55rem;
            color: #444;
            letter-spacing: 1px;
        }

        /* READER PANE */
        .extraction-pane {
            flex-grow: 1;
            padding: 60px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 80px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transform: translateY(20px);
            transition: 0.6s ease-out;
            box-sizing: border-box;
        }

        .glass-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .entry-title {
            font-family: 'Inter';
            font-weight: 900;
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: #fff;
            line-height: 1.1;
        }

        .entry-meta {
            font-family: 'Fira Code';
            font-size: 0.6rem;
            color: var(--brand-teal);
            margin-bottom: 40px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .entry-body {
            font-family: 'Merriweather', serif;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #ccc;
            font-weight: 300;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .entry-body img {
            display: block;
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* SHUFFLE BUTTON PROTOCOL */
        .shuffle-box {
            padding: 0 40px 20px;
            border-bottom: 1px solid var(--border-low);
        }

        .shuffle-btn {
            width: 100%;
            background: rgba(145, 175, 179, 0.05);
            border: 1px solid var(--brand-teal);
            color: var(--brand-teal);
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            padding: 12px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .shuffle-btn:hover {
            background: var(--brand-teal);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(145, 175, 179, 0.4);
        }

        .shuffle-btn::before {
            content: "⇋";
            /* Technical shuffle icon */
            font-size: 1rem;
        }

        /* --- MOBILE ARCHITECTURE (POETRY STYLE) --- */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }

            .directory {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-low);
                padding-top: env(safe-area-inset-top);
            }

            .post-list {
                max-height: 45vh;
                border-top: 1px solid var(--border-low);
            }

            .extraction-pane {
                padding: 20px;
                min-height: 60vh;
            }

            .glass-card {
                padding: 50px 25px;
                background: rgba(0, 0, 0, 0.85);
                border: none;
            }

            .entry-title {
                font-size: 1.6rem;
            }
        }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>

<body>

    <aside class="directory">
        <div class="dir-header">
            <a href="personal.html"><img src="Images/Equal.svg" class="sidebar-logo" alt="BACK"></a>
        </div>
<div class="tuning-knob">
            <label class="knob-label">Temporal Era</label>
            <select id="year-select" class="era-filter" onchange="filterEra()"></select>
        </div>

        <div class="shuffle-box">
            <button class="shuffle-btn" onclick="randomizeArchive()">Random_Access_Protocol</button>
        </div>

        <div class="post-list" id="post-list"></div>        </div>
        <div class="post-list" id="post-list"></div>
    </aside>

    <main class="extraction-pane" id="scroll-target">
        <div id="glass-container" class="glass-card">
            <div
                style="font-family: 'Fira Code'; font-size: 0.7rem; color: var(--brand-blue); text-align: center; padding: 40px;">
                INITIALIZING_WAYBACK_UPLINK...</div>
        </div>
    </main>

    <script src="wayback_purified.js"></script>

    <script>
const ERA_MAP = {
            ANALOG: { label: "THE_ANALOG_DAWN", glow: "linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%)" },
            APPLE: { label: "THE_APPLE_YEARS", glow: "linear-gradient(135deg, #13547a 0%, #80d0c7 100%)" },
            MODERN: { label: "MODERN_RESONANCE", glow: "linear-gradient(135deg, #2c3e50 0%, #4b6cb7 100%)" }
        };

        const allResidue = wayback_raw_dump.map(post => {
            let eraConfig = ERA_MAP.MODERN;
            const yearNum = parseInt(post.year);
            if (yearNum <= 2006) eraConfig = ERA_MAP.ANALOG;
            else if (yearNum <= 2022) eraConfig = ERA_MAP.APPLE;
            return { ...post, eraLabel: eraConfig.label, thumbprint: eraConfig.glow };
        });

        function initWayback() {
            const select = document.getElementById('year-select');
            const years = [...new Set(allResidue.map(p => p.year))].sort((a, b) => b - a);
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `ERA_${y}`;
                select.appendChild(opt);
            });
            
            // On load, we'll let the randomize function handle the first view
            randomizeArchive();
        }

        function renderEra(year) {
            const list = document.getElementById('post-list');
            list.innerHTML = "";
            allResidue.forEach((post, index) => {
                if (post.year == year) {
                    const item = document.createElement('div');
                    item.className = 'post-item';
                    item.setAttribute('data-id', index);
                    item.onclick = () => displayEntry(index);
                    item.innerHTML = `<h3>${post.title}</h3><span>${post.date}</span>`;
                    list.appendChild(item);
                }
            });
        }

        function filterEra() { renderEra(document.getElementById('year-select').value); }

        function displayEntry(index) {
            const container = document.getElementById('glass-container');
            const post = allResidue[index];

            document.body.style.background = `radial-gradient(circle at bottom right, rgba(0,0,0,0.8) 0%, var(--bg-dark) 100%), ${post.thumbprint}`;
            document.body.style.backgroundBlendMode = "overlay";

            container.classList.remove('visible');
            setTimeout(() => {
                container.innerHTML = `
                    <h1 class="entry-title">${post.title}</h1>
                    <div class="entry-meta">ERA: ${post.eraLabel} // ${post.date}</div>
                    <div class="entry-body">${post.body}</div>
                `;
                container.classList.add('visible');
                if (window.innerWidth > 1024) document.getElementById('scroll-target').scrollTop = 0;
            }, 400);

            document.querySelectorAll('.post-item').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-id') == index);
            });
        }

        // --- NEW: THE RANDOM ACCESS PROTOCOL ---
        function randomizeArchive() {
            if (allResidue.length === 0) return;

            const randomIndex = Math.floor(Math.random() * allResidue.length);
            const randomPost = allResidue[randomIndex];

            // 1. Update the dropdown selector to the correct year
            document.getElementById('year-select').value = randomPost.year;

            // 2. Render that specific era's list so the active state shows up
            renderEra(randomPost.year);

            // 3. Display the actual entry
            displayEntry(randomIndex);
        }

        window.onload = initWayback;

    </script>
</body>

</html>

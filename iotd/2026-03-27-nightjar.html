  <meta name="description" content="Most of David Gray&#x27;s albums drop as a surprise to me. I don&#x27;t obsessively follow many of my favorite artists, but DG is as close as I follow anyone because he&#x27;s still actively involved in the songwriting process. A week ago, while writing something of my own, I was processing some thoughts and, as I often do, turned to my library of his materials to get lost for a while. I believe this is the second time I&#x27;ve been caught off guard by an album that&#x27;s less than two weeks away from its wide release. I haven&#x27;t given it a listen yet; that would be a fine excuse for a blog entry." />

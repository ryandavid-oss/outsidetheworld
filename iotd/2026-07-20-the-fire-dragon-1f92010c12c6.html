        <h1>THE_FIRE_DRAGON</h1>
        <div class="record-meta">
          <time datetime="2026-07-20">2026-07-20</time><span aria-hidden="true">/</span><a href="/ryandavid-burningham.html" rel="author">RyanDavid Burningham</a>
        </div>
      </header>
      <div class="record-content record-content--image">
        <figure class="entry-image entry-image--photograph"><a href="https://otw-media.ryandavid.workers.dev/o/iotd/2026-07-20-the-fire-dragon-1f92010c12c6.jpg"><img src="https://otw-media.ryandavid.workers.dev/o/iotd/2026-07-20-the-fire-dragon-1f92010c12c6.jpg" alt="THE_FIRE_DRAGON" /></a><figcaption class="iotd-caption prose"><p>In late June, we went to Utah to see family, and I had to make sure we visited Lagoon in Farmington. It had been a while—since 2016, to be exact—and my wife hadn’t been there at all.</p>
<p>It’s a special trip for me because I have so many childhood memories of going to Lagoon. Plus, there are at least a dozen new rides, and my youngest daughter is also the biggest thrill seeker in the family. We had a blast!</p>
<p>I’m planning to go back this fall when they have their Halloween event.</p></figcaption></figure>

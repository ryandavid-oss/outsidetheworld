<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-labelledby="title desc">
  <title id="title">RD-42 ship interior wireframe v1</title>
  <desc id="desc">A precise one-plate layout showing the cockpit, central dorsal-hatch airlock, habitation and pack bench, cargo and engineering bay, interaction radii, and main deck.</desc>
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050817"/>
      <stop offset="1" stop-color="#0c0d20"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a36"/>
      <stop offset="0.52" stop-color="#241b3d"/>
      <stop offset="1" stop-color="#11192f"/>
    </linearGradient>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#7aa3c8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label { font-family: "Fira Code", "SFMono-Regular", Consolas, monospace; fill: #e7f4ff; }
      .muted { fill: #93a7bf; }
      .cyan { fill: #58f5df; }
      .gold { fill: #ffd36c; }
      .pink { fill: #ff77b7; }
      .small { font-size: 18px; }
      .body { font-size: 21px; }
      .zone { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
      .title { font-size: 34px; font-weight: 800; letter-spacing: 1.4px; }
      .coord { font-size: 16px; fill: #8192aa; }
      .hairline { stroke: #89aac6; stroke-opacity: .42; stroke-width: 2; }
      .dash { stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1672" height="941" fill="url(#void)"/>
  <rect width="1672" height="941" fill="url(#grid)"/>

  <text x="66" y="70" class="label title">RD-42 // INTERIOR WIREFRAME v1</text>
  <text x="68" y="105" class="label body muted">Logical plate 1672 × 941  •  playable shell x220–1452  •  deck y744</text>


<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orion | Outside The World</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .hud {
            position: fixed;
            left: 18px;
            bottom: 14px;
            right: 18px;
            font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            color: rgba(255, 255, 255, .55);
            letter-spacing: .12em;
            text-transform: uppercase;
            pointer-events: none;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            mix-blend-mode: screen;
        }

        .hud strong {
            color: rgba(255, 255, 255, .85);
            font-weight: 600;
        }

        .chip {
            border: 1px solid rgba(255, 255, 255, .12);
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .25);
            backdrop-filter: blur(8px);
        }

        @media (prefers-reduced-motion: reduce) {
            .hud {
                display: none;
            }
        }
    </style>
</head>

<body>
    <canvas id="sky"></canvas>
    <div class="hud">
        <div class="chip"><strong>Orion</strong> — centered</div>
        <div class="chip">Click: toggle lines • Move: subtle parallax</div>
    </div>

    <script>
        (() => {
            const canvas = document.getElementById("sky");
            const ctx = canvas.getContext("2d", { alpha: false });

            const DPR = Math.min(2, window.devicePixelRatio || 1);
            let W = 0, H = 0, t0 = performance.now();
            let reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            // --- Config knobs ---
            const STAR_COUNT = 1400;        // background stars
            const BIG_STAR_COUNT = 45;      // a few brighter random stars
            const ORION_SCALE = 0.32;       // relative to min(W,H)
            const ORION_ROT_DEG = 12;      // slight tilt (similar to many photos)
            const NEBULA_STRENGTH = 0.55;   // 0..1
            const TWINKLE = 0.75;           // 0..1
            const SCINTILLATION = 0.6;      // 0..1 tiny jitter

            // --- Helpers ---
            const rand = (a = 1, b = 0) => b + Math.random() * (a - b);
            const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
            const lerp = (a, b, u) => a + (b - a) * u;

            function resize() {
                W = Math.floor(innerWidth * DPR);
                H = Math.floor(innerHeight * DPR);
                canvas.width = W; canvas.height = H;
                canvas.style.width = innerWidth + "px";
                canvas.style.height = innerHeight + "px";
                buildStarfield();
                buildNebula();
                buildOrion();
            }
            addEventListener("resize", resize, { passive: true });

            // --- Star sprite cache ---
            const spriteCache = new Map();
            function starSprite(radius, color) {
                const key = `${radius}|${color}`;
                if (spriteCache.has(key)) return spriteCache.get(key);
                const s = document.createElement("canvas");
                const r = Math.ceil(radius * DPR);
                const size = r * 6;
                s.width = s.height = size;
                const c = s.getContext("2d");
                c.translate(size / 2, size / 2);

                // outer glow
                const g = c.createRadialGradient(0, 0, 0, 0, 0, size / 2);
                g.addColorStop(0.00, color);
                g.addColorStop(0.25, color.replace("1)", "0.55)"));
                g.addColorStop(1.00, "rgba(0,0,0,0)");
                c.fillStyle = g;
                c.beginPath();
                c.arc(0, 0, size / 2, 0, Math.PI * 2);
                c.fill();

                // core
                c.fillStyle = "rgba(255,255,255,0.9)";
                c.beginPath();
                c.arc(0, 0, Math.max(1, r * 0.45), 0, Math.PI * 2);
                c.fill();

                spriteCache.set(key, s);
                return s;
            }

            // --- Background stars (precomputed positions) ---
            let stars = [];
            let bigStars = [];
            function buildStarfield() {
                stars = [];
                bigStars = [];

                // background stars
                for (let i = 0; i < STAR_COUNT; i++) {
                    const m = Math.pow(Math.random(), 2.2); // magnitude-ish (more faint than bright)
                    const size = lerp(0.35, 1.45, 1 - m);
                    const base = lerp(0.10, 0.55, 1 - m);
                    stars.push({
                        x: Math.random() * W,
                        y: Math.random() * H,
                        r: size,
                        a: base,
                        tw: rand(0.6, 1.8),
                        ph: rand(Math.PI * 2),
                        hue: rand(220, 190), // bluish-ish
                    });
                }

                // a few bright random stars
                for (let i = 0; i < BIG_STAR_COUNT; i++) {
                    const x = Math.random() * W, y = Math.random() * H;
                    const r = rand(1.8, 3.8);
                    const a = rand(0.35, 0.8);
                    const warm = Math.random() < 0.22;
                    const color = warm
                        ? "rgba(255,210,170,1)"
                        : "rgba(185,215,255,1)";
                    bigStars.push({
                        x, y, r, a,
                        tw: rand(0.2, 0.8),
                        ph: rand(Math.PI * 2),
                        color
                    });
                }
            }

            // --- Nebula (soft glows) ---
            let nebula = [];
            function buildNebula() {
                nebula = [];

                // Anchor the main nebula near where Orion's sword will be (centered below belt)
                // We'll compute exact sword position later; for now make relative blobs, re-centered in draw.
                for (let i = 0; i < 6; i++) {
                    nebula.push({
                        ox: rand(-0.22, 0.22),
                        oy: rand(-0.05, 0.38),
                        rad: rand(0.18, 0.42),
                        hue: rand(205, 245),
                        alpha: rand(0.06, 0.14) * NEBULA_STRENGTH,
                        drift: rand(0.08, 0.22),
                        ph: rand(Math.PI * 2),
                    });
                }

                // a faint outer haze
                for (let i = 0; i < 3; i++) {
                    nebula.push({
                        ox: rand(-0.55, 0.55),
                        oy: rand(-0.45, 0.55),
                        rad: rand(0.55, 0.9),
                        hue: rand(210, 255),
                        alpha: rand(0.015, 0.04) * NEBULA_STRENGTH,
                        drift: rand(0.03, 0.09),
                        ph: rand(Math.PI * 2),
                    });
                }
            }

            // --- Orion constellation (centered) ---
            // Coordinates in "Orion space" (rough proportions): x,y in [-1..1]
            // Belt centered near (0,0). Sword extends downward.
            let orion = { stars: [], lines: [], center: { x: 0, y: 0 }, sword: { x: 0, y: 0 }, showLines: true };
            function buildOrion() {
                const deg = ORION_ROT_DEG * Math.PI / 180;
                const cs = Math.cos(deg), sn = Math.sin(deg);
                const S = Math.min(W, H) * ORION_SCALE;

                function rot(p) {
                    const x = p.x * cs - p.y * sn;
                    const y = p.x * sn + p.y * cs;
                    return { x, y };
                }
                function place(p) {
                    const r = rot(p);
                    return { x: orion.center.x + r.x * S, y: orion.center.y + r.y * S };
                }

                orion.center = { x: W * 0.5, y: H * 0.47 };

                // A slightly stylized Orion (names included if you want to extend later)
                const O = [
                    // Shoulders / head
                    { id: "Meissa", p: { x: 0.05, y: -0.72 }, r: 3.4, a: 0.85, c: "rgba(205,230,255,1)" },
                    { id: "Betelgeuse", p: { x: -0.48, y: -0.35 }, r: 5.4, a: 1, c: "rgba(255,210,175,1)" },
                    { id: "Bellatrix", p: { x: 0.38, y: -0.33 }, r: 4.6, a: 0.98, c: "rgba(210,235,255,1)" },

                    // Belt (Alnitak—Alnilam—Mintaka)
                    { id: "Alnitak", p: { x: -0.14, y: -0.03 }, r: 3.4, a: 0.86, c: "rgba(215,235,255,1)" },
                    { id: "Alnilam", p: { x: 0.00, y: 0.02 }, r: 3.9, a: 0.92, c: "rgba(220,240,255,1)" },
                    { id: "Mintaka", p: { x: 0.14, y: 0.07 }, r: 3.3, a: 0.84, c: "rgba(215,235,255,1)" },

                    // Sword / nebula region
                    { id: "SwordTop", p: { x: 0.02, y: 0.16 }, r: 2.4, a: 0.55, c: "rgba(205,230,255,1)" },
                    { id: "OrionNebula", p: { x: 0.04, y: 0.30 }, r: 3.0, a: 0.68, c: "rgba(195,225,255,1)" },
                    { id: "SwordLow", p: { x: 0.06, y: 0.46 }, r: 2.1, a: 0.45, c: "rgba(205,230,255,1)" },

                    // Knees / feet
                    { id: "Saiph", p: { x: -0.35, y: 0.60 }, r: 4.4, a: 0.98, c: "rgba(210,235,255,1)" },
                    { id: "Rigel", p: { x: 0.52, y: 0.64 }, r: 6, a: 1, c: "rgba(210,235,255,1)" },
                ];

                // Convert to screen coords
                orion.stars = O.map(s => {
                    const xy = place(s.p);
                    return {
                        ...s,
                        x: xy.x,
                        y: xy.y,
                        tw: rand(0.10, 0.35),  // slower twinkle for main stars
                        ph: rand(Math.PI * 2)
                    };
                });

                // Save sword/nebula anchor for nebulosity placement
                const neb = orion.stars.find(s => s.id === "OrionNebula");
                orion.sword = { x: neb.x, y: neb.y };

                // Constellation line segments (indices by id)
                const L = [
                    ["Betelgeuse", "Bellatrix"],
                    ["Betelgeuse", "Alnitak"],
                    ["Bellatrix", "Mintaka"],
                    ["Alnitak", "Alnilam"],
                    ["Alnilam", "Mintaka"],
                    ["Alnitak", "Saiph"],
                    ["Mintaka", "Rigel"],
                    ["Saiph", "Rigel"],
                    ["Alnilam", "SwordTop"],
                    ["SwordTop", "OrionNebula"],
                    ["OrionNebula", "SwordLow"],
                    ["Meissa", "Betelgeuse"],
                    ["Meissa", "Bellatrix"]
                ];
                const byId = Object.fromEntries(orion.stars.map(s => [s.id, s]));
                orion.lines = L.map(([a, b]) => ({ a: byId[a], b: byId[b] }));
            }

            // --- Interaction: subtle parallax + toggle lines ---
            let mouse = { x: 0.5, y: 0.5, tx: 0.5, ty: 0.5 };
            addEventListener("pointermove", (e) => {
                mouse.tx = e.clientX / innerWidth;
                mouse.ty = e.clientY / innerHeight;
            }, { passive: true });

            addEventListener("click", () => { orion.showLines = !orion.showLines; });

            // --- Draw ---
            function draw(now) {
                const t = (now - t0) * 0.001;
                const mx = lerp(mouse.x, mouse.tx, 0.06);
                const my = lerp(mouse.y, mouse.ty, 0.06);
                mouse.x = mx; mouse.y = my;

                // Background clear
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, W, H);

                // Vignette
                const vg = ctx.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.2, W * 0.5, H * 0.5, Math.min(W, H) * 0.75);
                vg.addColorStop(0, "rgba(0,0,0,0)");
                vg.addColorStop(1, "rgba(0,0,0,0.85)");
                ctx.fillStyle = vg;
                ctx.fillRect(0, 0, W, H);

                // Nebula (soft additive glows) anchored near Orion nebula
                ctx.save();
                ctx.globalCompositeOperation = "screen";
                for (const n of nebula) {
                    const drift = reduceMotion ? 0 : Math.sin(t * n.drift + n.ph) * 0.015;
                    const px = orion.sword.x + (n.ox + drift) * Math.min(W, H);
                    const py = orion.sword.y + (n.oy + drift) * Math.min(W, H);
                    const R = n.rad * Math.min(W, H);

                    const a = n.alpha * (reduceMotion ? 1 : (0.75 + 0.25 * Math.sin(t * 0.25 + n.ph)));
                    const colorA = `hsla(${n.hue}, 70%, 65%, ${a})`;
                    const colorB = `hsla(${n.hue + 18}, 80%, 55%, ${a * 0.55})`;

                    const g = ctx.createRadialGradient(px, py, 0, px, py, R);
                    g.addColorStop(0.00, colorA);
                    g.addColorStop(0.35, colorB);
                    g.addColorStop(1.00, "rgba(0,0,0,0)");
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(px, py, R, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // Parallax shift (very subtle)
                const parX = (mx - 0.5) * 10 * DPR;
                const parY = (my - 0.5) * 10 * DPR;

                // Background stars
                ctx.save();
                ctx.translate(parX * 0.35, parY * 0.35);
                ctx.globalCompositeOperation = "lighter";

                for (const s of stars) {
                    const tw = reduceMotion ? 1 : (0.75 + 0.25 * Math.sin(t * s.tw + s.ph));
                    const a = s.a * (1 - TWINKLE * 0.35 + TWINKLE * 0.35 * tw);

                    // tiny atmospheric jitter
                    const j = reduceMotion ? 0 : SCINTILLATION * 0.9;
                    const dx = j ? Math.sin(t * 0.7 + s.ph) * j : 0;
                    const dy = j ? Math.cos(t * 0.6 + s.ph) * j : 0;

                    ctx.fillStyle = `rgba(210,230,255,${a})`;
                    ctx.fillRect(s.x + dx, s.y + dy, s.r * DPR, s.r * DPR);
                }

                // Big random stars with sprite glow
                for (const s of bigStars) {
                    const tw = reduceMotion ? 1 : (0.7 + 0.3 * Math.sin(t * s.tw + s.ph));
                    const a = s.a * tw;

                    const spr = starSprite(s.r, s.color);
                    ctx.globalAlpha = a;
                    ctx.drawImage(spr, (s.x - spr.width / 2), (s.y - spr.height / 2));
                }
                ctx.restore();

                // Orion: brighter + colored + slight pulsing
                ctx.save();
                ctx.globalCompositeOperation = "screen";

                // Constellation lines (glow)
                if (orion.showLines) {
                    const linePulse = reduceMotion ? 1 : (0.7 + 0.3 * Math.sin(t * 0.55));
                    ctx.lineWidth = 1.2 * DPR;
                    ctx.strokeStyle = `rgba(145,175,179,${0.22 * linePulse})`;
                    ctx.shadowColor = "rgba(145,175,179,0.55)";
                    ctx.shadowBlur = 10 * DPR;

                    ctx.beginPath();
                    for (const seg of orion.lines) {
                        ctx.moveTo(seg.a.x + parX * 0.8, seg.a.y + parY * 0.8);
                        ctx.lineTo(seg.b.x + parX * 0.8, seg.b.y + parY * 0.8);
                    }
                    ctx.stroke();

                    // thinner inner line
                    ctx.shadowBlur = 0;
                    ctx.lineWidth = 0.9 * DPR;
                    ctx.strokeStyle = `rgba(210,235,255,${0.10 * linePulse})`;
                    ctx.stroke();
                }

                // Orion stars
                for (const s of orion.stars) {
                    const tw = reduceMotion ? 1 : (0.78 + 0.22 * Math.sin(t * s.tw + s.ph));
                    const a = s.a * tw;

                    // scintillation on main stars is extra subtle
                    const j = reduceMotion ? 0 : SCINTILLATION * 0.55;
                    const dx = j ? Math.sin(t * 0.9 + s.ph) * j : 0;
                    const dy = j ? Math.cos(t * 0.8 + s.ph) * j : 0;

                    const spr = starSprite(s.r, s.c);
                    ctx.globalAlpha = a;
                    ctx.drawImage(spr, (s.x + dx + parX * 0.8 - spr.width / 2), (s.y + dy + parY * 0.8 - spr.height / 2));

                    // extra nebula glow around Orion Nebula star
                    if (s.id === "OrionNebula") {
                        const R = 120 * DPR;
                        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, R);
                        const pulse = reduceMotion ? 1 : (0.75 + 0.25 * Math.sin(t * 0.35));
                        g.addColorStop(0, `rgba(170,210,255,${0.10 * pulse})`);
                        g.addColorStop(0.5, `rgba(120,190,255,${0.055 * pulse})`);
                        g.addColorStop(1, "rgba(0,0,0,0)");
                        ctx.fillStyle = g;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, R, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                ctx.restore();

                // subtle “atmospheric wash” (tiny animated noise via alpha dither)
                if (!reduceMotion) {
                    ctx.save();
                    ctx.globalCompositeOperation = "soft-light";
                    ctx.globalAlpha = 0.06;
                    ctx.fillStyle = "rgba(255,255,255,1)";
                    const step = 6 * DPR;
                    for (let y = 0; y < H; y += step) {
                        for (let x = 0; x < W; x += step) {
                            const n = (Math.sin((x * 0.012) + (t * 0.8)) + Math.cos((y * 0.013) - (t * 0.7))) * 0.5;
                            if (n > 0.62) ctx.fillRect(x, y, 1, 1);
                        }
                    }
                    ctx.restore();
                }

                requestAnimationFrame(draw);
            }

            // Init
            resize();
            requestAnimationFrame(draw);

        })();
    </script>
</body>

</html>

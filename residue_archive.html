<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Residue Archive | Matrix Terminal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="var(--bg-dark)">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;900&family=Fira+Code:wght@300;500;700&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap');

        :root {
            --brand-blue: var(--brand-blue);
            --brand-teal: var(--brand-teal);
            --bg-dark: var(--bg-dark);
            --warm-amber: #FFB347;
            --rose-gold: #E0BFB8;
            --border-low: rgba(255, 255, 255, 0.08);
            --amethyst: #9b59b6;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- SIDEBAR DIRECTORY --- */
        .directory {
            width: 380px;
            border-right: 1px solid var(--border-low);
            display: flex;
            flex-direction: column;
            background: #070707;
            z-index: 100;
            flex-shrink: 0;
        }

        .dir-header {
            padding: 40px;
            border-bottom: 1px solid var(--border-low);
            text-align: center;
        }

        .sidebar-logo {
            width: 180px;
            display: block;
            margin: 0 auto;
            opacity: 0.8;
            transition: 0.3s;
        }

        .sidebar-logo:hover {
            transform: scale(1.05);
            opacity: 1;
        }

        .tuning-knob {
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .knob-label {
            font-family: 'Fira Code';
            font-size: 0.55rem;
            color: var(--brand-teal);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        select.era-filter {
            background: #111;
            border: 1px solid var(--border-low);
            color: var(--rose-gold);
            font-family: 'Fira Code';
            font-size: 0.75rem;
            padding: 12px;
            width: 100%;
            outline: none;
            cursor: pointer;
        }

        .post-list {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .month-header {
            padding: 20px 40px 10px;
            font-family: 'Fira Code';
            font-size: 0.65rem;
            color: var(--warm-amber);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .post-item {
            padding: 15px 40px;
            cursor: pointer;
            transition: 0.3s;
            border-left: 3px solid transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .post-item:hover {
            background: rgba(145, 175, 179, 0.05);
        }

        .post-item.active {
            background: rgba(155, 89, 182, 0.1);
            border-left-color: var(--amethyst);
        }

        .post-item h3 {
            font-family: 'Fira Code';
            font-size: 0.75rem;
            margin: 0 0 5px 0;
            color: #eee;
        }

        .post-item span {
            font-size: 0.55rem;
            color: #555;
        }

        /* --- READER PANE --- */
        .extraction-pane {
            flex-grow: 1;
            padding: 60px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(145, 175, 179, 0.1);
            padding: 80px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: translateY(20px);
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .glass-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .entry-title {
            font-family: 'Inter';
            font-weight: 900;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            color: #fff;
            line-height: 1.1;
        }

        .entry-meta {
            font-family: 'Fira Code';
            font-size: 0.65rem;
            color: var(--brand-teal);
            margin-bottom: 50px;
            letter-spacing: 3px;
        }

        .entry-body {
            font-family: 'Merriweather', serif;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #ccc;
        }

        .back-nav {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 200;
        }

        .back-link {
            font-family: 'Fira Code';
            font-size: 0.6rem;
            color: var(--brand-teal);
            text-decoration: none;
            border: 1px solid var(--border-low);
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        /* --- MOBILE REFINEMENTS (POETRY PROTOCOL) --- */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }

            .directory {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-low);
                padding-top: env(safe-area-inset-top);
            }

            .post-list {
                max-height: 45vh;
                border-top: 1px solid var(--border-low);
            }

            .extraction-pane {
                padding: 20px;
                min-height: 60vh;
            }

            .glass-card {
                padding: 50px 25px;
                border: none;
                background: rgba(0, 0, 0, 0.85);
            }

            .entry-title {
                font-size: 1.8rem;
            }

            .back-nav {
                display: none;
            }

            /* Use the Logo for back nav on mobile */
        }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>

<body>

    <nav class="back-nav"><a href="personal.html" class="back-link">← CLOSE_TERMINAL</a></nav>

    <aside class="directory">
        <div class="dir-header">
            <a href="personal.html"><img src="Images/Equal.svg" class="sidebar-logo" alt="OTW"></a>
        </div>
        <div class="tuning-knob">
            <label class="knob-label">Temporal Selection</label>
            <select id="year-select" class="era-filter" onchange="updateYear()"></select>
        </div>
        <div class="post-list" id="post-list"></div>
    </aside>

    <main class="extraction-pane" id="scroll-target">
        <div id="glass-container" class="glass-card">
            <div style="font-family: 'Fira Code'; color: var(--brand-teal); text-align: center;">
                SELECT_SIGNAL_FROM_DIRECTORY...</div>
        </div>
    </main>

    <script src="narrative_data.js"></script>

    <script>
        let groupedMatrix = {};

        function initMatrix() {
            if (typeof current_narrative === 'undefined') return;

            current_narrative.forEach((post, index) => {
                const parts = post.date.split(' ');
                const year = parts[parts.length - 1];
                const month = parts[0];
                if (!groupedMatrix[year]) groupedMatrix[year] = {};
                if (!groupedMatrix[year][month]) groupedMatrix[year][month] = [];
                groupedMatrix[year][month].push({ ...post, originalIndex: index });
            });

            const yearSelect = document.getElementById('year-select');
            const years = Object.keys(groupedMatrix).sort((a, b) => b - a);

            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `YEAR_${y}`;
                yearSelect.appendChild(opt);
            });

            if (years.length > 0) {
                renderYear(years[0]);
                displayEntry(groupedMatrix[years[0]][Object.keys(groupedMatrix[years[0]])[0]][0].originalIndex);
            }
        }

        function renderYear(year) {
            const list = document.getElementById('post-list');
            list.innerHTML = "";
            const months = groupedMatrix[year];
            for (const month in months) {
                const mHeader = document.createElement('div');
                mHeader.className = 'month-header';
                mHeader.textContent = month;
                list.appendChild(mHeader);

                months[month].forEach(post => {
                    const item = document.createElement('div');
                    item.className = 'post-item';
                    item.id = `item-${post.originalIndex}`;
                    item.onclick = () => {
                        displayEntry(post.originalIndex);
                        // FINESSE: Auto-scroll on mobile
                        if (window.innerWidth <= 1024) {
                            document.getElementById('scroll-target').scrollIntoView({ behavior: 'smooth' });
                        }
                    };
                    item.innerHTML = `<h3>${post.title}</h3><span>${post.date}</span>`;
                    list.appendChild(item);
                });
            }
        }

        function updateYear() { renderYear(document.getElementById('year-select').value); }

        function displayEntry(index) {
            const container = document.getElementById('glass-container');
            const post = current_narrative[index];

            document.body.style.background = `radial-gradient(circle at top left, rgba(155, 89, 182, 0.1) 0%, var(--bg-dark) 100%)`;
            container.classList.remove('visible');

            setTimeout(() => {
                container.innerHTML = `
                    <h1 class="entry-title">${post.title}</h1>
                    <div class="entry-meta">TEMPORAL_MARK: ${post.date.toUpperCase()}</div>
                    <div class="entry-body">${marked.parse(post.body)}</div>
                `;
                container.classList.add('visible');
                // On desktop, only reset the scroll of the pane, not the whole page
                if (window.innerWidth > 1024) {
                    document.getElementById('scroll-target').scrollTop = 0;
                }
            }, 400);

            document.querySelectorAll('.post-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`item-${index}`);
            if (activeItem) activeItem.classList.add('active');
        }

        window.onload = initMatrix;
    </script>
</body>

</html>

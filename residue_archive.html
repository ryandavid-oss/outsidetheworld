    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />

        Residue Archive | Matrix Terminal
    </title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;900&family=Fira+Code:wght@300;500;700&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap');

        :root {
            --brand-blue: var(--brand-blue);
            --brand-teal: var(--brand-teal);
            --bg-dark: var(--bg-dark);
            --warm-amber: #FFB347;
            --rose-gold: #E0BFB8;
            --border-low: rgba(255, 255, 255, 0.08);
            --amethyst: #9b59b6;
            --text-primary: #e0e6ed;
            /* A "Cloud" white with a hint of blue-teal */
            --text-muted: #a3b1bc;
            /* A softer gray for meta-data */
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            /* Replaces 'white' */
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .entry-body {
            font-family: 'Merriweather', serif;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #d1d1d1;
            /* Slightly brighter than #ccc to help the serif thin lines */
            font-weight: 300;
            /* Merriweather looks best at 300 or 400 on dark backgrounds */
            letter-spacing: 0.01rem;
        }

        .entry-meta {
            color: var(--text-muted);
            /* Softens the system labels */
        }

        /* --- SIDEBAR DIRECTORY --- */
        .directory {
            width: 380px;
            border-right: 1px solid var(--border-low);
            display: flex;
            flex-direction: column;
            background: #070707;
            z-index: 100;
            flex-shrink: 0;
        }

        .dir-header {
            padding: 40px;
            border-bottom: 1px solid var(--border-low);
            text-align: center;
        }

        .sidebar-logo {
            width: 180px;
            display: block;
            margin: 0 auto;
            opacity: 0.8;
            transition: 0.3s;
        }

        .sidebar-logo:hover {
            transform: scale(1.05);
            opacity: 1;
        }

        .tuning-knob {
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .knob-label {
            font-family: 'Fira Code';
            font-size: 0.55rem;
            color: var(--brand-teal);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        select.era-filter {
            background: #111;
            border: 1px solid var(--border-low);
            color: var(--rose-gold);
            font-family: 'Fira Code';
            font-size: 0.75rem;
            padding: 12px;
            width: 100%;
            outline: none;
            cursor: pointer;
        }

        .post-list {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .month-header {
            padding: 20px 40px 10px;
            font-family: 'Fira Code';
            font-size: 0.65rem;
            color: var(--warm-amber);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .post-item {
            padding: 15px 40px;
            cursor: pointer;
            transition: 0.3s;
            border-left: 3px solid transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .post-item:hover {
            background: rgba(145, 175, 179, 0.05);
        }

        .post-item.active {
            background: rgba(155, 89, 182, 0.1);
            border-left-color: var(--amethyst);
        }

        .post-item h3 {
            font-family: 'Fira Code';
            font-size: 0.75rem;
            margin: 0 0 5px 0;
            color: #eee;
        }

        .post-item span {
            font-size: 0.55rem;
            color: #555;
        }

        /* --- READER PANE --- */
        .extraction-pane {
            flex-grow: 1;
            padding: 60px;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .glass-card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(145, 175, 179, 0.1);
            padding: 80px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: translateY(20px);
            transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .glass-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .entry-title {
            font-family: 'Inter';
            font-weight: 900;
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            color: #fff;
            line-height: 1.1;
        }

        .entry-meta {
            font-family: 'Fira Code';
            font-size: 0.65rem;
            color: var(--brand-teal);
            margin-bottom: 50px;
            letter-spacing: 3px;
        }

        .entry-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .entry-toolbar .entry-meta {
            margin-bottom: 0;
        }

        .share-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .share-btn,
        .share-status {
            font-family: 'Fira Code';
            font-size: 0.58rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .share-btn {
            border: 1px solid rgba(145, 175, 179, 0.18);
            background: rgba(145, 175, 179, 0.04);
            color: var(--brand-teal);
            padding: 9px 12px;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .share-btn:hover {
            border-color: var(--brand-teal);
            background: rgba(145, 175, 179, 0.08);
            color: #fff;
        }

        .share-status {
            color: var(--text-muted);
            opacity: 0.85;
        }

        .entry-body {
            font-family: 'Merriweather', serif;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #ccc;
        }

        /* --- IMAGE ARCHIVE PROTOCOL --- */
        .entry-body img {
            max-width: 80%;
            /* Constrains image to the glass-card width */
            height: auto;
            /* Maintains aspect ratio */
            display: block;
            margin: 40px auto;
            /* Centers and provides vertical breathing room */
            border: 1px solid var(--border-low);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .entry-body img:hover {
            transform: scale(1.02);
            /* Subtle lift on hover */
            border-color: var(--brand-teal);
        }

        .back-nav {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 200;
        }

        .back-link {
            font-family: 'Fira Code';
            font-size: 0.6rem;
            color: var(--brand-teal);
            text-decoration: none;
            border: 1px solid var(--border-low);
            padding: 8px 15px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        /* --- MOBILE REFINEMENTS (POETRY PROTOCOL) --- */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }

            .directory {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-low);
                padding-top: env(safe-area-inset-top);
            }

            .post-list {
                max-height: 45vh;
                border-top: 1px solid var(--border-low);
            }

            .extraction-pane {
                padding: 20px;
                min-height: 60vh;
            }

        .glass-card {
            padding: 50px 25px;
            border: none;
            background: rgba(0, 0, 0, 0.85);
        }

        .entry-body .otw-center {
            text-align: center;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--brand-teal);
            margin: 2.2rem auto;
            opacity: 0.95;
        }

        .entry-body hr {
            border: 0;
            border-top: 1px solid rgba(145, 175, 179, 0.16);
            margin: 2.5rem 0;
        }

            .entry-title {
                font-size: 1.8rem;
            }

            .entry-toolbar {
                margin-bottom: 34px;
                gap: 12px;
            }

            .share-controls {
                width: 100%;
            }

            .back-nav {
                display: none;
            }

            /* Use the Logo for back nav on mobile */
        }

        /* THE CLEAN ATMOSPHERIC WASH */

<body>
    <div id="cursor-ring">
    </div>
    <div id="cursor-dot">
    </div>
    <nav class="back-nav">
        <a class="back-link" href="personal.html">
            ← CLOSE_TERMINAL
        </a>
    </nav>
    <aside class="directory">
        <div class="dir-header">
            <a href="personal.html">
                <div class="hero-logo-container">
                    <img alt="OTW" class="sidebar-logo hero-logo" src="Images/Equal.svg" />
                </div>
            </a>
        </div>
        <div class="tuning-knob">
            <label class="knob-label">
                Temporal Selection
            </label>
            <select class="era-filter" id="year-select" onchange="updateYear()">
            </select>
        </div>
        <div class="post-list" id="post-list">
        </div>
    </aside>
    <main class="extraction-pane" id="scroll-target">
        <div class="glass-card" id="glass-container">
            <div style="font-family: 'Fira Code'; color: var(--brand-teal); text-align: center;">
                SELECT_SIGNAL_FROM_DIRECTORY...
            </div>
        </div>
    </main>
    <script src="narrative_data.js">
    </script>
    <script>
        let groupedMatrix = {};

        function slugify(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/&/g, ' and ')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        function buildPostId(post) {
            return `${post.date || 'undated'}--${slugify(post.title || 'untitled')}`;
        }

        function buildShareUrl(post) {
            const url = new URL(window.location.href);
            url.searchParams.set('post', buildPostId(post));
            return url.toString();
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                ta.remove();
                return ok;
            }
        }

        async function sharePostLink(index) {
            const post = current_narrative[index];
            if (!post) return;

            const shareUrl = buildShareUrl(post);
            const shareTitle = post.title || 'Residue Archive Entry';
            const statusEl = document.getElementById('share-status');

            try {
                if (navigator.share) {
                    await navigator.share({
                        title: shareTitle,
                        text: `${shareTitle} // Outside The World`,
                        url: shareUrl
                    });
                    if (statusEl) statusEl.textContent = 'LINK_SHARED';
                    return;
                }

                const ok = await copyToClipboard(shareUrl);
                if (statusEl) statusEl.textContent = ok ? 'LINK_COPIED' : 'COPY_FAILED';
            } catch {
                if (statusEl) statusEl.textContent = 'SHARE_CANCELLED';
            }
        }

        function findPostIndexById(postId) {
            if (!postId || typeof current_narrative === 'undefined') return -1;
            return current_narrative.findIndex((post) => buildPostId(post) === postId);
        }

        function updateUrlForPost(post, replace = false) {
            const url = new URL(window.location.href);
            url.searchParams.set('post', buildPostId(post));
            const next = `${url.pathname}${url.search}${url.hash}`;
            const state = { postId: buildPostId(post) };

            if (replace) {
                history.replaceState(state, '', next);
            } else {
                history.pushState(state, '', next);
            }
        }

        function initMatrix() {
            if (typeof current_narrative === 'undefined') return;

            current_narrative.forEach((post, index) => {
                const parts = post.date.split(' ');
                const year = parts[parts.length - 1];
                const month = parts[0];
                if (!groupedMatrix[year]) groupedMatrix[year] = {};
                if (!groupedMatrix[year][month]) groupedMatrix[year][month] = [];
                groupedMatrix[year][month].push({ ...post, originalIndex: index });
            });

            const yearSelect = document.getElementById('year-select');
            const years = Object.keys(groupedMatrix).sort((a, b) => b - a);

            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = `YEAR_${y}`;
                yearSelect.appendChild(opt);
            });

            if (years.length > 0) {
                const requestedPostId = new URLSearchParams(window.location.search).get('post');
                const requestedIndex = findPostIndexById(requestedPostId);
                const initialIndex = requestedIndex >= 0
                    ? requestedIndex
                    : groupedMatrix[years[0]][Object.keys(groupedMatrix[years[0]])[0]][0].originalIndex;
                const initialPost = current_narrative[initialIndex];
                const initialYear = initialPost.date.split(' ').slice(-1)[0];

                yearSelect.value = initialYear;
                renderYear(initialYear);
                displayEntry(initialIndex, { replaceUrl: true });
            }
        }

        function renderYear(year) {
            const list = document.getElementById('post-list');
            list.innerHTML = "";
            const months = groupedMatrix[year];
            for (const month in months) {
                const mHeader = document.createElement('div');
                mHeader.className = 'month-header';
                mHeader.textContent = month;
                list.appendChild(mHeader);

                months[month].forEach(post => {
                    const item = document.createElement('div');
                    item.className = 'post-item';
                    item.id = `item-${post.originalIndex}`;
                    item.dataset.postId = buildPostId(post);
                    item.onclick = () => {
                        displayEntry(post.originalIndex);
                        if (window.innerWidth <= 1024) {
                            document.getElementById('scroll-target').scrollIntoView({ behavior: 'smooth' });
                        }
                    };
                    item.innerHTML = `<h3>${post.title}</h3><span>${post.date}</span>`;
                    list.appendChild(item);
                });
            }
        }

        function updateYear() { renderYear(document.getElementById('year-select').value); }

        function displayEntry(index, options = {}) {
            const container = document.getElementById('glass-container');
            const post = current_narrative[index];
            if (!post) return;

            document.body.style.background = `radial-gradient(circle at top left, rgba(155, 89, 182, 0.1) 0%, var(--bg-dark) 100%)`;
            container.classList.remove('visible');

            setTimeout(() => {
                container.innerHTML = `
                    <h1 class="entry-title">${post.title}</h1>
                    <div class="entry-toolbar">
                        <div class="entry-meta">TEMPORAL_MARK: ${post.date.toUpperCase()}</div>
                        <div class="share-controls">
                            <button type="button" class="share-btn" onclick="sharePostLink(${index})">COPY / SHARE LINK</button>
                            <span class="share-status" id="share-status">SHAREABLE_ARCHIVE_SIGNAL</span>
                        </div>
                    </div>
                    <div class="entry-body">${marked.parse(post.body)}</div>
                `;
                container.classList.add('visible');
                if (window.innerWidth > 1024) {
                    document.getElementById('scroll-target').scrollTop = 0;
                }
            }, 400);

            document.querySelectorAll('.post-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.getElementById(`item-${index}`);
            if (activeItem) activeItem.classList.add('active');

            updateUrlForPost(post, Boolean(options.replaceUrl));
        }

        window.addEventListener('popstate', () => {
            const postId = new URLSearchParams(window.location.search).get('post');
            const index = findPostIndexById(postId);
            if (index >= 0) {
                const post = current_narrative[index];
                const year = post.date.split(' ').slice(-1)[0];
                document.getElementById('year-select').value = year;
                renderYear(year);
                displayEntry(index, { replaceUrl: true });
            }
        });

        window.onload = initMatrix;
    </script>
</body>

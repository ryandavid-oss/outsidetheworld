<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTW Publisher</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fffaf0'/%3E%3Ccircle cx='16' cy='16' r='12' fill='%23244f9e'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #202020;
      --muted: #69645d;
      --soft: #938b80;
      --paper: #fffaf0;
      --paper-edge: #e3d7c6;
      --desk: #e9dfd0;
      --desk-deep: #d8cbb8;
      --blue: #244f9e;
      --blue-dark: #173f83;
      --teal: #587f85;
      --line: rgba(42, 38, 32, 0.14);
      --toolbar: rgba(255, 252, 246, 0.94);
      --shadow: 0 24px 80px rgba(62, 50, 34, 0.16);
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: Georgia, "Times New Roman", serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--desk);
      color: var(--ink);
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255, 250, 240, 0.78), rgba(233, 223, 208, 0.94)),
        var(--desk);
      font-family: var(--sans);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      min-height: 68px;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 240, 227, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.54);
    }

    .brand-mark img {
      width: 28px;
      height: 28px;
      display: block;
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      margin: 0 0 3px;
      color: var(--blue-dark);
      font-family: var(--mono);
      font-size: 0.7rem;
      line-height: 1;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-name {
      width: min(280px, 52vw);
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #161411;
      outline: none;
    }

    .save-state {
      justify-self: center;
      color: #554f47;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .icon-btn,
    .text-btn,
    .publish-btn {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.54);
      color: #27231d;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        color 160ms ease,
        transform 160ms ease;
    }

    .icon-btn {
      width: 38px;
      padding: 0;
    }

    .text-btn,
    .publish-btn {
      padding: 0 14px;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .publish-btn {
      background: var(--blue);
      border-color: var(--blue);
      color: #fffaf0;
      box-shadow: 0 10px 26px rgba(36, 79, 158, 0.2);
    }

    .icon-btn:hover,
    .text-btn:hover,
    .publish-btn:hover,
    .icon-btn:focus-visible,
    .text-btn:focus-visible,
    .publish-btn:focus-visible {
      background: #fff;
      border-color: rgba(36, 79, 158, 0.32);
      outline: none;
      transform: translateY(-1px);
    }

    .publish-btn:hover,
    .publish-btn:focus-visible {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
    }

    .toolbar {
      position: sticky;
      top: 68px;
      z-index: 24;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0;
      min-height: 48px;
      padding: 6px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--toolbar);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 0 7px;
      border-left: 1px solid rgba(41, 39, 35, 0.13);
    }

    .tool-btn {
      position: relative;
      min-width: 30px;
      height: 30px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      color: #332f28;
      font-size: 0.8rem;
    }

    .tool-btn[data-tooltip]::after,
    .tool-btn[data-tooltip]::before,
    .select-wrap[data-tooltip]::after,
    .select-wrap[data-tooltip]::before {
      position: absolute;
      left: 50%;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 4px);
      transition:
        opacity 120ms ease,
        transform 120ms ease;
    }

    .tool-btn[data-tooltip]::after,
    .select-wrap[data-tooltip]::after {
      content: attr(data-tooltip);
      top: calc(100% + 8px);
      z-index: 80;
      padding: 5px 7px;
      background: #25211c;
      color: #fffaf0;
      font-family: var(--sans);
      font-size: 0.72rem;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 0 8px 22px rgba(42, 38, 32, 0.18);
    }

    .tool-btn[data-tooltip]::before,
    .select-wrap[data-tooltip]::before {
      content: "";
      top: calc(100% + 3px);
      z-index: 81;
      width: 8px;
      height: 8px;
      background: #25211c;
      transform: translate(-50%, 4px) rotate(45deg);
    }

    .tool-btn[data-tooltip]:hover::after,
    .tool-btn[data-tooltip]:hover::before,
    .tool-btn[data-tooltip]:focus-visible::after,
    .tool-btn[data-tooltip]:focus-visible::before,
    .select-wrap[data-tooltip]:hover::after,
    .select-wrap[data-tooltip]:hover::before,
    .select-wrap[data-tooltip]:focus-within::after,
    .select-wrap[data-tooltip]:focus-within::before {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .tool-btn[data-tooltip]:hover::before,
    .tool-btn[data-tooltip]:focus-visible::before,
    .select-wrap[data-tooltip]:hover::before,
    .select-wrap[data-tooltip]:focus-within::before {
      transform: translate(-50%, 0) rotate(45deg);
    }

    .tool-btn:hover,
    .tool-btn:focus-visible {
      background: rgba(36, 79, 158, 0.05);
      color: var(--blue);
      outline: none;
    }

    .tool-btn.is-active,
    .tool-btn[aria-pressed="true"] {
      background: rgba(36, 79, 158, 0.14);
      color: var(--blue);
      box-shadow: inset 0 -2px 0 rgba(36, 79, 158, 0.48);
    }

    .tool-btn.is-active:hover,
    .tool-btn[aria-pressed="true"]:hover,
    .tool-btn.is-active:focus-visible,
    .tool-btn[aria-pressed="true"]:focus-visible {
      background: rgba(36, 79, 158, 0.18);
    }

    .tool-btn:disabled {
      cursor: default;
      color: rgba(51, 47, 40, 0.34);
      background: transparent;
      box-shadow: none;
    }

    .tool-value {
      min-width: 2.3em;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.04em;
    }

    .tool-label {
      font-weight: 700;
      line-height: 1;
    }

    .tool-label.is-underlined {
      text-decoration: underline;
      text-underline-offset: 0.18em;
    }

    .tool-label.is-italic {
      font-style: italic;
    }

    .tool-color {
      position: relative;
      font-weight: 700;
    }

    .tool-color .tool-label {
      position: relative;
      padding-bottom: 5px;
    }

    .tool-color .tool-label::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--tool-color, var(--blue));
    }

    .tool-swatch {
      width: 16px;
      height: 16px;
      display: block;
      border: 1px solid rgba(41, 39, 35, 0.18);
      background: var(--highlight-color, #fff2a8);
    }

    .select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .toolbar-select {
      min-height: 32px;
      border: 0;
      background: transparent;
      color: #332f28;
      padding: 0 24px 0 8px;
      outline: none;
    }

    .toolbar-select.compact {
      width: 36px;
      min-width: 36px;
      padding: 0;
      color: transparent;
    }

    .toolbar-select.compact option {
      color: #332f28;
    }

    .color-input {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .toolbar-popover {
      position: fixed;
      z-index: 95;
      display: grid;
      gap: 10px;
      min-width: 172px;
      padding: 10px;
      border: 1px solid rgba(41, 39, 35, 0.15);
      background: rgba(255, 252, 246, 0.98);
      box-shadow: 0 18px 46px rgba(62, 50, 34, 0.18);
    }

    .toolbar-popover[hidden] {
      display: none;
    }

    .popover-title {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .color-grid,
    .spacing-grid {
      display: grid;
      gap: 6px;
    }

    .color-grid {
      grid-template-columns: repeat(5, 1fr);
    }

    .color-swatch-btn {
      width: 26px;
      height: 26px;
      border: 1px solid rgba(41, 39, 35, 0.15);
      background: var(--swatch-color);
    }

    .color-swatch-btn:hover,
    .color-swatch-btn:focus-visible,
    .color-swatch-btn[aria-pressed="true"] {
      outline: none;
      border-color: rgba(36, 79, 158, 0.56);
      box-shadow: 0 0 0 2px rgba(36, 79, 158, 0.12);
    }

    .custom-color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .custom-color-row input {
      width: 34px;
      height: 28px;
      padding: 0;
      border: 1px solid rgba(41, 39, 35, 0.15);
      background: transparent;
    }

    .spacing-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .spacing-option {
      min-height: 32px;
      border: 1px solid rgba(41, 39, 35, 0.12);
      background: rgba(255, 255, 255, 0.52);
      color: #332f28;
      font-family: var(--mono);
      font-size: 0.68rem;
    }

    .spacing-option:hover,
    .spacing-option:focus-visible,
    .spacing-option[aria-pressed="true"] {
      background: rgba(36, 79, 158, 0.1);
      border-color: rgba(36, 79, 158, 0.34);
      color: var(--blue);
      outline: none;
    }

    .document-shell {
      width: min(920px, calc(100% - 40px));
      margin: 26px auto 70px;
    }

    .paper {
      min-height: calc(100vh - 180px);
      padding: clamp(34px, 6vw, 70px);
      border: 1px solid rgba(41, 39, 35, 0.11);
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .article-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding-bottom: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(41, 39, 35, 0.14);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .article-date {
      width: 138px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      outline: none;
      text-transform: uppercase;
    }

    .article-title-stack {
      display: grid;
      gap: 10px;
      margin-bottom: 28px;
    }

    .title-block,
    .subhead-block,
    .body-block {
      border: 1px solid rgba(41, 39, 35, 0.11);
      background: rgba(255, 255, 255, 0.38);
      transition:
        background 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;
    }

    .title-block {
      padding: 15px 18px 13px;
    }

    .subhead-block {
      padding: 11px 18px 12px;
    }

    .body-block {
      min-height: 660px;
      padding: 22px 18px;
    }

    .title-block:focus-within,
    .subhead-block:focus-within,
    .body-block:focus-within,
    .title-block.is-active,
    .subhead-block.is-active,
    .body-block.is-active {
      background: rgba(255, 255, 255, 0.58);
      border-color: rgba(36, 79, 158, 0.28);
      box-shadow: 0 10px 26px rgba(36, 79, 158, 0.07);
    }

    .title-field {
      width: 100%;
      min-height: 1.08em;
      margin: 0;
      border: 0;
      background: transparent;
      color: #171511;
      font-family: var(--serif);
      font-size: clamp(2.35rem, 4.6vw, 3.55rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0;
      outline: none;
      resize: none;
      overflow: hidden;
    }

    .subhead-field {
      width: 100%;
      min-height: 1.65em;
      margin: 0;
      border: 0;
      background: transparent;
      color: #51483d;
      font-family: var(--serif);
      font-size: clamp(1.12rem, 1.9vw, 1.45rem);
      line-height: 1.5;
      outline: none;
      resize: none;
      overflow: hidden;
    }

    .editor {
      position: relative;
      min-height: 610px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.08rem, 1.5vw, 1.24rem);
      line-height: 1.5;
      outline: none;
    }

    .editor::after {
      content: "";
      display: block;
      clear: both;
    }

    .editor:empty::before {
      content: attr(data-placeholder);
      color: rgba(32, 32, 32, 0.34);
      pointer-events: none;
    }

    .editor:focus {
      outline: none;
    }

    .editor p,
    .editor h2,
    .editor blockquote {
      margin: 0 0 1.2em;
    }

    .editor p {
      min-height: 1.5em;
    }

    .editor h2 {
      margin-top: 1.8em;
      font-family: var(--serif);
      font-size: 1.75rem;
      line-height: 1.18;
    }

    .editor blockquote {
      margin: 1.45em 0;
      padding-left: 18px;
      border-left: 3px solid rgba(36, 79, 158, 0.3);
      color: #403a32;
      font-size: 1.26rem;
      font-style: italic;
    }

    .editor a {
      color: var(--blue);
      text-decoration-thickness: 0.08em;
      text-underline-offset: 0.18em;
    }

    .editor hr {
      margin: 2.4em auto;
      width: 44%;
      border: 0;
      border-top: 1px solid rgba(41, 39, 35, 0.24);
    }

    .editor ul,
    .editor ol {
      margin: 0 0 1.2em;
      padding-left: 1.45em;
    }

    .editor li {
      margin: 0.25em 0;
    }

    .editor .line-spacing-10 {
      line-height: 1;
    }

    .editor .line-spacing-115 {
      line-height: 1.15;
    }

    .editor .line-spacing-15 {
      line-height: 1.5;
    }

    .editor .line-spacing-20 {
      line-height: 2;
    }

    .editor ul.editor-checklist {
      list-style: none;
      padding-left: 1.6em;
    }

    .editor ul.editor-checklist li {
      position: relative;
    }

    .editor ul.editor-checklist li::before {
      content: "";
      position: absolute;
      left: -1.45em;
      top: 0.72em;
      width: 0.72em;
      height: 0.72em;
      border: 1px solid rgba(41, 39, 35, 0.46);
      background: rgba(255, 255, 255, 0.34);
    }

    .publisher-figure {
      position: relative;
      margin: 1.8em 0;
      padding: 10px;
      border: 1px solid rgba(41, 39, 35, 0.12);
      background: rgba(255, 255, 255, 0.42);
      box-sizing: border-box;
      width: 100%;
      max-width: min(var(--figure-max-width, 520px), 100%);
      margin-right: auto;
      margin-left: auto;
    }

    .publisher-figure.is-selected,
    .publisher-figure:focus-visible {
      border-color: rgba(36, 79, 158, 0.38);
      box-shadow: 0 0 0 3px rgba(36, 79, 158, 0.08);
      outline: none;
    }

    .publisher-figure.is-dragging {
      opacity: 0.55;
    }

    .publisher-figure[data-display-size="small"] {
      --figure-max-width: 320px;
    }

    .publisher-figure[data-display-size="medium"] {
      --figure-max-width: 520px;
    }

    .publisher-figure[data-display-size="large"] {
      --figure-max-width: 760px;
    }

    .publisher-figure[data-display-size="original"] {
      --figure-max-width: var(--figure-natural-width, 100%);
    }

    .publisher-figure[data-alignment="left"] {
      margin-left: 0;
      margin-right: auto;
    }

    .publisher-figure[data-alignment="center"] {
      margin-left: auto;
      margin-right: auto;
    }

    .publisher-figure[data-alignment="right"] {
      margin-left: auto;
      margin-right: 0;
    }

    .publisher-figure[data-wrap-mode="wrap-left"] {
      float: left;
      clear: left;
      margin: 0.35em 1.35em 1em 0;
    }

    .publisher-figure[data-wrap-mode="wrap-right"] {
      float: right;
      clear: right;
      margin: 0.35em 0 1em 1.35em;
    }

    .publisher-figure img {
      width: 100%;
      max-height: 560px;
      display: block;
      object-fit: contain;
      background: #ece4d7;
    }

    .image-missing {
      min-height: 180px;
      display: grid;
      place-items: center;
      background: rgba(236, 228, 215, 0.72);
      color: rgba(48, 43, 36, 0.56);
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .figure-caption {
      min-height: 1.6em;
      margin-top: 10px;
      color: #5b5147;
      font-family: var(--serif);
      font-size: 0.98rem;
      font-style: italic;
      line-height: 1.45;
      text-align: center;
      outline: none;
    }

    .figure-caption:empty::before {
      content: attr(data-placeholder);
      color: rgba(91, 81, 71, 0.5);
    }

    .figure-details {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .figure-status {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.56rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .publisher-figure[data-upload-status="uploading"] .figure-status {
      color: var(--teal);
    }

    .publisher-figure[data-upload-status="uploaded"] .figure-status {
      color: var(--blue);
    }

    .publisher-figure[data-upload-status="failed"] .figure-status {
      color: #7a372d;
    }

    .publisher-figure[data-upload-status="needs-key"] .figure-status {
      color: #7a372d;
    }

    .figure-meta {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 8;
      width: min(360px, calc(100% - 16px));
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      padding: 8px;
      border: 1px solid rgba(41, 39, 35, 0.12);
      background: rgba(255, 250, 240, 0.94);
      box-shadow: 0 14px 32px rgba(62, 50, 34, 0.16);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 140ms ease, transform 140ms ease;
      user-select: none;
    }

    .publisher-figure:focus-within .figure-meta,
    .publisher-figure:hover .figure-meta,
    .publisher-figure.is-selected .figure-meta {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .publisher-figure[data-controls-hidden="true"] .figure-meta {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(-4px) !important;
      transition: none !important;
    }

    .figure-alt {
      min-width: 0;
      border: 0;
      border-bottom: 1px solid rgba(41, 39, 35, 0.16);
      background: transparent;
      color: var(--muted);
      padding: 6px 0;
      font-family: var(--sans);
      font-size: 0.78rem;
      outline: none;
    }

    .figure-actions {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
      min-width: 0;
      max-width: 100%;
      user-select: none;
    }

    .figure-size-controls,
    .figure-align-controls,
    .figure-wrap-controls,
    .figure-move-controls {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border: 1px solid rgba(41, 39, 35, 0.1);
      background: rgba(255, 255, 255, 0.34);
    }

    .figure-action {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(41, 39, 35, 0.12);
      background: rgba(255, 255, 255, 0.5);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .figure-size-option,
    .figure-align-option,
    .figure-wrap-option,
    .figure-move-option {
      min-width: 28px;
      min-height: 26px;
      padding: 0 7px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.56rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .figure-drag-handle {
      cursor: grab;
    }

    .figure-drag-handle:active {
      cursor: grabbing;
    }

    .figure-action:hover,
    .figure-action:focus-visible,
    .figure-size-option:hover,
    .figure-size-option:focus-visible,
    .figure-align-option:hover,
    .figure-align-option:focus-visible,
    .figure-wrap-option:hover,
    .figure-wrap-option:focus-visible,
    .figure-move-option:hover,
    .figure-move-option:focus-visible {
      background: #fff;
      color: var(--blue);
      outline: none;
    }

    .figure-size-option.is-active,
    .figure-size-option[aria-pressed="true"],
    .figure-align-option.is-active,
    .figure-align-option[aria-pressed="true"],
    .figure-wrap-option.is-active,
    .figure-wrap-option[aria-pressed="true"] {
      background: rgba(36, 79, 158, 0.14);
      color: var(--blue);
      box-shadow: inset 0 -2px 0 rgba(36, 79, 158, 0.42);
    }

    .figure-action[data-role="retry"] {
      display: none;
    }

    .publisher-figure[data-upload-status="failed"] .figure-action[data-role="retry"] {
      display: inline-flex;
      align-items: center;
    }

    .image-drop-indicator {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 7;
      height: 2px;
      background: rgba(36, 79, 158, 0.68);
      box-shadow: 0 0 0 3px rgba(36, 79, 158, 0.08);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-1px);
      transition: opacity 120ms ease;
    }

    .image-drop-indicator.is-active {
      opacity: 1;
    }

    .unsupported-block {
      margin: 1.4em 0;
      padding: 12px 14px;
      border: 1px dashed rgba(122, 55, 45, 0.34);
      background: rgba(255, 245, 233, 0.58);
      color: #7a372d;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .settings-sheet {
      position: fixed;
      top: 82px;
      right: 18px;
      z-index: 40;
      width: min(340px, calc(100vw - 36px));
      display: none;
      gap: 14px;
      padding: 16px;
      border: 1px solid var(--line);
      background: rgba(255, 250, 240, 0.96);
      box-shadow: 0 24px 70px rgba(62, 50, 34, 0.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .settings-sheet.is-open {
      display: grid;
    }

    .settings-title {
      margin: 0;
      color: #302b25;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .field-group {
      display: grid;
      gap: 6px;
    }

    .access-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 8px;
      align-items: center;
    }

    .access-state {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .access-state.has-key {
      color: var(--blue);
    }

    .field-label {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .side-input,
    .side-select,
    .key-action {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.58);
      color: #26221d;
      padding: 8px 9px;
      outline: none;
    }

    .key-action {
      width: auto;
      padding: 0 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.56rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .key-action:hover,
    .key-action:focus-visible {
      background: #fff;
      color: var(--blue);
      outline: none;
    }

    .side-input:focus,
    .side-select:focus,
    .key-action:focus-visible,
    .article-date:focus,
    .figure-alt:focus {
      border-color: rgba(36, 79, 158, 0.38);
    }

    svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
    }

    @media (max-width: 820px) {
      .topbar {
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 10px 12px;
      }

      .save-state {
        display: none;
      }

      .top-actions .text-btn {
        display: none;
      }

      .toolbar {
        top: 65px;
        justify-content: flex-start;
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .toolbar::-webkit-scrollbar {
        display: none;
      }

      .document-shell {
        width: calc(100% - 24px);
        margin-top: 14px;
        margin-bottom: 34px;
      }

      .paper {
        padding: 28px 20px 42px;
      }

      .article-title-stack {
        margin-bottom: 22px;
      }

      .title-block,
      .subhead-block,
      .body-block {
        padding-left: 14px;
        padding-right: 14px;
      }

      .title-field {
        font-size: clamp(2.1rem, 10vw, 2.75rem);
      }

      .figure-meta {
        grid-template-columns: 1fr;
      }

      .figure-actions {
        justify-content: flex-end;
      }

      .publisher-figure[data-wrap-mode="wrap-left"],
      .publisher-figure[data-wrap-mode="wrap-right"] {
        float: none;
        clear: both;
        margin: 1.8em auto;
      }
    }

    @media (max-width: 480px) {
      .brand-title {
        max-width: 210px;
      }

      .doc-name {
        width: 190px;
      }

      .publish-btn {
        padding: 0 11px;
      }

      .article-meta {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">
          <img src="Images/otw_brandmark_dark.svg" alt="" />
        </div>
        <div class="brand-copy">
          <p class="brand-title">Outside The World Publisher</p>
          <input class="doc-name" type="text" value="Untitled Article" aria-label="Document name" />
        </div>
      </div>

      <div class="save-state" id="saveState">Local draft</div>

      <div class="top-actions">
        <button class="icon-btn" id="settingsToggle" type="button" aria-label="Article settings and publisher access" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Z"></path>
            <path d="M19.4 15a1.8 1.8 0 0 0 .4 2l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.8 1.8 0 0 0-2-.4 1.8 1.8 0 0 0-1.1 1.7V21a2 2 0 0 1-4 0v-.1a1.8 1.8 0 0 0-1.1-1.7 1.8 1.8 0 0 0-2 .4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.8 1.8 0 0 0 .4-2A1.8 1.8 0 0 0 2.7 14H2a2 2 0 0 1 0-4h.7a1.8 1.8 0 0 0 1.7-1.1 1.8 1.8 0 0 0-.4-2l-.1-.1A2 2 0 1 1 6.7 4l.1.1a1.8 1.8 0 0 0 2 .4A1.8 1.8 0 0 0 10 2.8V2a2 2 0 0 1 4 0v.8a1.8 1.8 0 0 0 1.1 1.7 1.8 1.8 0 0 0 2-.4l.1-.1A2 2 0 1 1 20 6.8l-.1.1a1.8 1.8 0 0 0-.4 2 1.8 1.8 0 0 0 1.7 1.1h.8a2 2 0 0 1 0 4h-.8a1.8 1.8 0 0 0-1.8 1Z"></path>
          </svg>
        </button>
        <button class="text-btn" id="saveDraftBtn" type="button" title="Save local draft">Save Draft</button>
        <button class="publish-btn" id="publishBtn" type="button" title="Publishing is not wired yet">Publish</button>
      </div>
    </header>

    <nav class="toolbar" aria-label="Writing tools">
      <div class="toolbar-group">
        <button class="tool-btn" type="button" data-command="undo" aria-label="Undo" title="Undo" data-tooltip="Undo">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 14 4 9l5-5"></path>
            <path d="M4 9h10.5a5.5 5.5 0 1 1 0 11H11"></path>
          </svg>
        </button>
        <button class="tool-btn" type="button" data-command="redo" aria-label="Redo" title="Redo" data-tooltip="Redo">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 14 5-5-5-5"></path>
            <path d="M20 9H9.5a5.5 5.5 0 1 0 0 11H13"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar-group">
        <span class="select-wrap" title="Text style" data-tooltip="Text style">
          <select class="toolbar-select" id="formatSelect" aria-label="Text style">
            <option value="p">Body</option>
            <option value="h2">Heading</option>
            <option value="blockquote">Quote</option>
          </select>
        </span>
      </div>

      <div class="toolbar-group">
        <button class="tool-btn" type="button" data-command="bold" aria-label="Bold" title="Bold" data-tooltip="Bold" aria-pressed="false">
          <span class="tool-label">B</span>
        </button>
        <button class="tool-btn" type="button" data-command="italic" aria-label="Italic" title="Italic" data-tooltip="Italic" aria-pressed="false">
          <span class="tool-label is-italic">I</span>
        </button>
        <button class="tool-btn" type="button" data-command="underline" aria-label="Underline" title="Underline" data-tooltip="Underline" aria-pressed="false">
          <span class="tool-label is-underlined">U</span>
        </button>
        <button class="tool-btn tool-color" id="textColorBtn" type="button" aria-label="Text color" title="Text color" data-tooltip="Text color" aria-expanded="false" style="--tool-color: #244f9e">
          <span class="tool-label">A</span>
        </button>
        <button class="tool-btn" id="highlightBtn" type="button" aria-label="Highlight" title="Highlight" data-tooltip="Highlight" aria-expanded="false">
          <span class="tool-swatch" aria-hidden="true"></span>
        </button>
      </div>

      <div class="toolbar-group">
        <button class="tool-btn" id="linkBtn" type="button" aria-label="Insert link" title="Insert link" data-tooltip="Insert link" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"></path>
            <path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1"></path>
          </svg>
        </button>
        <button class="tool-btn" id="insertImageBtn" type="button" aria-label="Insert image at cursor" title="Insert image" data-tooltip="Insert image">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <circle cx="8.5" cy="10" r="1.5"></circle>
            <path d="m21 15-5-5L5 19"></path>
          </svg>
        </button>
        <button class="tool-btn" id="dividerBtn" type="button" aria-label="Insert divider" title="Insert divider" data-tooltip="Insert divider">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 12h16"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar-group">
        <button class="tool-btn is-active" type="button" data-command="justifyLeft" aria-label="Align left" title="Align left" data-tooltip="Align left" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h14"></path>
            <path d="M4 10h10"></path>
            <path d="M4 14h14"></path>
            <path d="M4 18h9"></path>
          </svg>
        </button>
        <button class="tool-btn" type="button" data-command="justifyCenter" aria-label="Align center" title="Align center" data-tooltip="Align center" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 6h14"></path>
            <path d="M8 10h8"></path>
            <path d="M5 14h14"></path>
            <path d="M8 18h8"></path>
          </svg>
        </button>
        <button class="tool-btn" type="button" data-command="justifyRight" aria-label="Align right" title="Align right" data-tooltip="Align right" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 6h14"></path>
            <path d="M10 10h10"></path>
            <path d="M6 14h14"></path>
            <path d="M11 18h9"></path>
          </svg>
        </button>
        <button class="tool-btn" id="lineSpacingBtn" type="button" aria-label="Line spacing" title="Line spacing" data-tooltip="Line spacing" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 5h11"></path>
            <path d="M8 12h11"></path>
            <path d="M8 19h11"></path>
            <path d="M4 5v14"></path>
            <path d="m2 7 2-2 2 2"></path>
            <path d="m2 17 2 2 2-2"></path>
          </svg>
          <span class="tool-value" id="lineSpacingValue">1.5</span>
        </button>
      </div>

      <div class="toolbar-group">
        <button class="tool-btn" id="checklistBtn" type="button" aria-label="Checklist" title="Checklist" data-tooltip="Checklist" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m4 7 2 2 4-4"></path>
            <path d="M13 7h7"></path>
            <path d="m4 17 2 2 4-4"></path>
            <path d="M13 17h7"></path>
          </svg>
        </button>
        <button class="tool-btn" type="button" data-command="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list" data-tooltip="Bulleted list" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 6h12"></path>
            <path d="M8 12h12"></path>
            <path d="M8 18h12"></path>
            <path d="M4 6h.01"></path>
            <path d="M4 12h.01"></path>
            <path d="M4 18h.01"></path>
          </svg>
        </button>
        <button class="tool-btn" type="button" data-command="insertOrderedList" aria-label="Numbered list" title="Numbered list" data-tooltip="Numbered list" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 6h10"></path>
            <path d="M10 12h10"></path>
            <path d="M10 18h10"></path>
            <path d="M4 6h1v4"></path>
            <path d="M4 10h2"></path>
            <path d="M4 14h2l-2 4h2"></path>
          </svg>
        </button>
      </div>

      <div class="toolbar-group">
        <button class="tool-btn" type="button" data-command="outdent" aria-label="Decrease indent" title="Decrease indent" data-tooltip="Decrease indent">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 6h9"></path>
            <path d="M11 12h9"></path>
            <path d="M11 18h9"></path>
            <path d="m7 8-4 4 4 4"></path>
          </svg>
        </button>
        <button class="tool-btn" type="button" data-command="indent" aria-label="Increase indent" title="Increase indent" data-tooltip="Increase indent">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 6h9"></path>
            <path d="M11 12h9"></path>
            <path d="M11 18h9"></path>
            <path d="m3 8 4 4-4 4"></path>
          </svg>
        </button>
        <button class="tool-btn" type="button" data-command="removeFormat" aria-label="Clear formatting" title="Clear formatting" data-tooltip="Clear formatting">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 4h16"></path>
            <path d="m7 20 5-12 5 12"></path>
            <path d="M9 15h6"></path>
            <path d="m3 3 18 18"></path>
          </svg>
        </button>
      </div>
    </nav>

    <div class="toolbar-popover color-popover" id="colorPopover" role="dialog" aria-label="Choose color" hidden>
      <div class="popover-title" id="colorPopoverTitle">Text Color</div>
      <div class="color-grid" aria-label="Color choices">
        <button class="color-swatch-btn" type="button" data-color="#202020" aria-label="Ink" title="Ink" style="--swatch-color: #202020"></button>
        <button class="color-swatch-btn" type="button" data-color="#244f9e" aria-label="OTW blue" title="OTW blue" style="--swatch-color: #244f9e"></button>
        <button class="color-swatch-btn" type="button" data-color="#587f85" aria-label="Teal" title="Teal" style="--swatch-color: #587f85"></button>
        <button class="color-swatch-btn" type="button" data-color="#7a372d" aria-label="Brick" title="Brick" style="--swatch-color: #7a372d"></button>
        <button class="color-swatch-btn" type="button" data-color="#6f5a31" aria-label="Ochre" title="Ochre" style="--swatch-color: #6f5a31"></button>
        <button class="color-swatch-btn" type="button" data-color="#fff2a8" aria-label="Soft yellow" title="Soft yellow" style="--swatch-color: #fff2a8"></button>
        <button class="color-swatch-btn" type="button" data-color="#d9edf0" aria-label="Soft blue" title="Soft blue" style="--swatch-color: #d9edf0"></button>
        <button class="color-swatch-btn" type="button" data-color="#eadfd0" aria-label="Warm paper" title="Warm paper" style="--swatch-color: #eadfd0"></button>
        <button class="color-swatch-btn" type="button" data-color="#d8eddf" aria-label="Soft green" title="Soft green" style="--swatch-color: #d8eddf"></button>
        <button class="color-swatch-btn" type="button" data-color="#ffffff" aria-label="White" title="White" style="--swatch-color: #ffffff"></button>
      </div>
      <label class="custom-color-row" for="customColorInput">
        Custom
        <input id="customColorInput" type="color" value="#244f9e" aria-label="Custom color" />
      </label>
    </div>

    <div class="toolbar-popover spacing-popover" id="lineSpacingPopover" role="dialog" aria-label="Line spacing" hidden>
      <div class="popover-title">Line Spacing</div>
      <div class="spacing-grid">
        <button class="spacing-option" type="button" data-spacing="1.0" aria-pressed="false">1.0</button>
        <button class="spacing-option" type="button" data-spacing="1.15" aria-pressed="false">1.15</button>
        <button class="spacing-option" type="button" data-spacing="1.5" aria-pressed="true">1.5</button>
        <button class="spacing-option" type="button" data-spacing="2.0" aria-pressed="false">2.0</button>
      </div>
    </div>

    <aside class="settings-sheet" id="settingsSheet" aria-label="Article settings and publisher access">
      <h2 class="settings-title">Article Settings</h2>
      <div class="field-group">
        <label class="field-label" for="publishDate">Date</label>
        <input class="side-input" id="publishDate" type="date" value="2026-05-29" />
      </div>
      <div class="field-group">
        <label class="field-label" for="publishSlug">Slug</label>
        <input class="side-input" id="publishSlug" type="text" placeholder="auto-from-title" />
      </div>
      <div class="field-group">
        <label class="field-label" for="publishSurface">Surface</label>
        <select class="side-select" id="publishSurface">
          <option>Outside The World Article</option>
          <option>Private Draft</option>
        </select>
      </div>
      <div class="field-group">
        <label class="field-label" for="publisherAccessKey">Publisher Access</label>
        <div class="access-row">
          <input class="side-input" id="publisherAccessKey" type="text" autocomplete="off" spellcheck="false" placeholder="Paste private key" aria-label="Publisher access key" />
          <button class="key-action" id="savePublisherKeyBtn" type="button">Save</button>
          <button class="key-action" id="clearPublisherKeyBtn" type="button">Clear</button>
        </div>
        <div class="access-state" id="publisherKeyState">No publisher key saved</div>
      </div>
    </aside>

    <main class="document-shell">
      <article class="paper" aria-label="Article document">
        <div class="article-meta">
          <span>Outside The World Article</span>
          <input class="article-date" type="text" value="May 29, 2026" aria-label="Article date" />
        </div>

        <div class="article-title-stack">
          <div class="title-block">
            <textarea class="title-field" id="titleField" rows="1" aria-label="Article title" placeholder="Title"></textarea>
          </div>
          <div class="subhead-block">
            <textarea class="subhead-field" id="subheadField" rows="1" aria-label="Article subhead" placeholder="Add a subhead"></textarea>
          </div>
        </div>

        <div class="body-block">
          <div class="editor" id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start writing..."></div>
        </div>
      </article>
    </main>

    function markChanged() {

    function blockId(prefix = 'block') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
    }

    function stripEditorCaretMarkers(value) {
      return String(value || '').replace(/\u200B/g, '');
    }

    function escapeHtml(value) {
      return stripEditorCaretMarkers(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function safeUrl(value) {
      const url = String(value || '').trim();
      if (!url) {
        return '';
      }
      if (/^(https?:|mailto:|#|\/)/i.test(url)) {
        return url;
      }
      return '';
    }

    function safeImagePublishUrl(value) {
      const url = String(value || '').trim();
      if (!url) {
        return '';
      }
      if (/^(https?:|\/)/i.test(url)) {
        return url;
      }
      return '';
    }

    function slugify(value) {
      return String(value || '')
        .toLowerCase()
        .trim()
        .replace(/['"]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 96) || 'untitled-article';
    }

    function dataUrlByteEstimate(value) {
      const dataUrl = String(value || '');
      const comma = dataUrl.indexOf(',');
      if (comma === -1) {
        return dataUrl.length;
      }
      return Math.round((dataUrl.length - comma - 1) * 0.75);
    }

    function formatBytes(bytes) {
      const value = Number(bytes) || 0;
      if (value >= 1024 * 1024) {
        return `${(value / (1024 * 1024)).toFixed(1)} MB`;
      }
      return `${Math.max(1, Math.round(value / 1024))} KB`;
    }

    function validateStagedImageFile(file) {
      if (!file) {
        return 'Choose an image first.';
      }
      const type = String(file.type || '').toLowerCase();
      if (type && !SUPPORTED_STAGED_IMAGE_TYPES.has(type)) {
        return 'Use a JPEG, PNG, WebP, or GIF image.';
      }
      if ((file.size || 0) > MAX_STAGED_IMAGE_BYTES) {
        return `Use an image smaller than ${formatBytes(MAX_STAGED_IMAGE_BYTES)} before compression.`;
      }
      return '';
    }

    function shouldCompressStagedImage(file) {
      return String(file?.type || '').toLowerCase() !== 'image/gif';
    }

    function getStoredPublisherKey() {
      try {
        return localStorage.getItem(PUBLISHER_KEY_STORAGE) || '';
      } catch (error) {
        return '';
      }
    }

    function getLegacyPublisherKey() {
      try {
        return localStorage.getItem(LEGACY_PUBLISH_KEY_STORAGE)
          || localStorage.getItem(LEGACY_GHOST_FULL_PUBLISH_KEY_STORAGE)
          || '';
      } catch (error) {
        return '';
      }
    }

    function getPublisherPublishKey() {
      return getStoredPublisherKey();
    }

    function maskPublisherKey(value) {
      const key = String(value || '').trim();
      if (!key) {
        return '';
      }
      return `Saved •••• ${key.slice(-4)}`;
    }

    function setPublisherKeyInputMasked(key = getStoredPublisherKey()) {
      publisherAccessKey.value = key ? maskPublisherKey(key) : '';
      publisherAccessKey.dataset.masked = key ? 'true' : 'false';
      publisherAccessKey.readOnly = Boolean(key);
    }

    function renderPublisherKeyState(message = '') {
      const key = getStoredPublisherKey();
      publisherKeyState.textContent = message || (key ? 'Publisher access saved' : 'No publisher key saved');
      publisherKeyState.classList.toggle('has-key', Boolean(key));
      if (document.activeElement !== publisherAccessKey || publisherAccessKey.dataset.masked === 'true') {
        setPublisherKeyInputMasked(key);
      }
    }

    function savePublisherKey() {
      const masked = publisherAccessKey.dataset.masked === 'true';
      const value = masked ? getStoredPublisherKey() : publisherAccessKey.value.trim();
      if (!value) {
        renderPublisherKeyState('Paste a key to save');
        setSaveState('Publisher key needed', true);
        return false;
      }
      try {
        localStorage.setItem(PUBLISHER_KEY_STORAGE, value);
        localStorage.setItem(PUBLISHER_KEY_MIGRATION_STORAGE, 'saved');
      } catch (error) {
        renderPublisherKeyState('Could not save key');
        setSaveState('Could not save key', true);
        return false;
      }
      setPublisherKeyInputMasked(value);
      renderPublisherKeyState('Publisher access saved');
      setSaveState('Publisher access saved', true);
      retryImagesWaitingForKey();
      updateArticlePayload();
      return true;
    }

    function clearPublisherKey() {
      try {
        localStorage.removeItem(PUBLISHER_KEY_STORAGE);
        localStorage.setItem(PUBLISHER_KEY_MIGRATION_STORAGE, 'cleared');
      } catch (error) {
        // The UI state below still reflects that no key can be read.
      }
      publisherAccessKey.value = '';
      publisherAccessKey.dataset.masked = 'false';
      publisherAccessKey.readOnly = false;
      renderPublisherKeyState('No publisher key saved');
      setSaveState('Publisher access cleared', true);
      updateArticlePayload();
    }

    function migrateLegacyPublisherKey() {
      if (getStoredPublisherKey()) {
        return false;
      }
      try {
        if (localStorage.getItem(PUBLISHER_KEY_MIGRATION_STORAGE)) {
          return false;
        }
      } catch (error) {
        return false;
      }
      const legacyKey = getLegacyPublisherKey();
      if (!legacyKey) {
        return false;
      }
      try {
        localStorage.setItem(PUBLISHER_KEY_STORAGE, legacyKey);
        localStorage.setItem(PUBLISHER_KEY_MIGRATION_STORAGE, 'imported');
        return true;
      } catch (error) {
        return false;
      }
    }

    function preparePublisherKeyInputForEdit() {
      if (publisherAccessKey.dataset.masked !== 'true') {
        return;
      }
      publisherAccessKey.value = '';
      publisherAccessKey.dataset.masked = 'false';
      publisherAccessKey.readOnly = false;
      publisherAccessKey.placeholder = 'Paste new private key';
    }

    function loadPublisherImageElement(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Could not read this image.'));
        };
        image.src = url;
      });
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error('Could not prepare this image.'));
          }
        }, type, quality);
      });
    }

    async function compressStagedImage(file, options = {}) {
      const image = await loadPublisherImageElement(file);
      const maxDimension = Number(options.maxDimension) || 1400;
      const quality = Number(options.quality) || 0.78;
      const fileName = options.fileName || 'narrative-image.jpg';
      const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
      const width = Math.max(1, Math.round(image.width * scale));
      const height = Math.max(1, Math.round(image.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d', { alpha: false });
      if (!context) {
        throw new Error('Image preparation is unavailable on this device.');
      }
      context.fillStyle = '#fffaf0';
      context.fillRect(0, 0, width, height);
      context.drawImage(image, 0, 0, width, height);
      const blob = await canvasToBlob(canvas, 'image/jpeg', quality);
      return new File([blob], fileName, { type: 'image/jpeg' });
    }

    function dataUrlToFile(dataUrl, fileName = 'staged-image.png', mime = '') {
      const match = String(dataUrl || '').match(/^data:([^;,]+)?(;base64)?,(.*)$/);
      if (!match) {
        return null;
      }
      const type = mime || match[1] || 'image/png';
      const body = match[3] || '';
      const binary = match[2] ? atob(body) : decodeURIComponent(body);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return new File([bytes], fileName, { type });
    }

    function localImageSourceMeta(source) {
      if (!source) {
        return { kind: 'missing' };
      }
      if (source.kind === 'url') {
        return {
          kind: 'url',
          url: source.url || '',
          objectKey: source.objectKey || '',
          retainedInLocalDraft: false
        };
      }
      if (source.kind === 'local-data-url') {
        return {
          kind: 'local-data-url',
          mime: source.mime || '',
          byteEstimate: dataUrlByteEstimate(source.dataUrl),
          dataUrlLength: String(source.dataUrl || '').length,
          retainedInLocalDraft: true
        };
      }
      if (source.kind === 'local-placeholder') {
        return {
          kind: 'local-placeholder',
          fileName: source.fileName || '',
          mime: source.mime || '',
          byteEstimate: source.byteEstimate || 0,
          dataUrlLength: source.dataUrlLength || 0,
          tooLargeForLocalDraft: Boolean(source.tooLargeForLocalDraft)
        };
      }
      if (source.kind === 'local-missing') {
        return { kind: 'local-missing' };
      }
      return { kind: source.kind || 'unknown' };
    }

    function escapeMarkdownText(value) {
      return String(value || '')
        .replace(/\\/g, '\\\\')
        .replace(/([*_`[\]])/g, '\\$1');
    }

    function escapeMarkdownAlt(value) {
      return String(value || '')
        .replace(/\\/g, '\\\\')
        .replace(/]/g, '\\]')
        .replace(/\n+/g, ' ')
        .trim();
    }

    function escapeMarkdownTitle(value) {
      return String(value || '')
        .replace(/\\/g, '\\\\')
        .replace(/"/g, '\\"')
        .replace(/\n+/g, ' ')
        .trim();
    }

    function escapeMarkdownUrl(value) {
      return String(value || '')
        .replace(/\s/g, '%20')
        .replace(/\(/g, '%28')
        .replace(/\)/g, '%29');
    }

    function issue(level, code, message, context = {}) {
      return { level, code, message, ...context };
    }

    function sanitizeInlineHtml(html) {
      const template = document.createElement('template');
      template.innerHTML = String(html || '');

      function cleanNode(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          return document.createTextNode(stripEditorCaretMarkers(node.textContent));
        }
        if (node.nodeType !== Node.ELEMENT_NODE) {
          return document.createDocumentFragment();
        }

        const tag = node.tagName.toLowerCase();
        const allowed = new Set(['b', 'strong', 'i', 'em', 'u', 'a', 'span', 'br', 'font']);
        const outputChildren = () => {
          const fragment = document.createDocumentFragment();
          node.childNodes.forEach((child) => fragment.append(cleanNode(child)));
          return fragment;
        };

        if (!allowed.has(tag)) {
          return outputChildren();
        }
        if (tag === 'br') {
          return document.createElement('br');
        }

        const cleanTag = tag === 'font' ? 'span' : tag;
        const clean = document.createElement(cleanTag);
        if (tag === 'a') {
          const href = safeUrl(node.getAttribute('href'));
          if (href) {
            clean.setAttribute('href', href);
          }
        }
        if (tag === 'font' && node.getAttribute('color')) {
          clean.style.color = node.getAttribute('color');
        }
        if (tag === 'span') {
          const style = node.style;
          if (style.color) {
            clean.style.color = style.color;
          }
          if (style.backgroundColor) {
            clean.style.backgroundColor = style.backgroundColor;
          }
          if (style.fontWeight) {
            clean.style.fontWeight = style.fontWeight;
          }
          if (style.fontStyle) {
            clean.style.fontStyle = style.fontStyle;
          }
          if (style.textDecorationLine) {
            clean.style.textDecoration = style.textDecorationLine;
          }
        }
        node.childNodes.forEach((child) => clean.append(cleanNode(child)));
        return clean;
      }

      const cleanTemplate = document.createElement('template');
      template.content.childNodes.forEach((node) => cleanTemplate.content.append(cleanNode(node)));
      return cleanTemplate.innerHTML.trim();
    }

    function insertTextIntoTextarea(textarea, value) {
      const text = String(value || '').replace(/\s+/g, ' ').trim();
      const start = textarea.selectionStart || 0;
      const end = textarea.selectionEnd || start;
      textarea.value = `${textarea.value.slice(0, start)}${text}${textarea.value.slice(end)}`;
      const caret = start + text.length;
      textarea.setSelectionRange(caret, caret);
      autoResizeTextarea(textarea);
      markChanged();
    }

    function plainTextFragment(text) {
      const fragment = document.createDocumentFragment();
      const paragraphs = String(text || '')
        .replace(/\r\n?/g, '\n')
        .trim()
        .split(/\n+/)
        .map((paragraph) => paragraph.trim())
        .filter(Boolean);

      paragraphs.forEach((paragraph) => {
        const p = document.createElement('p');
        p.append(document.createTextNode(paragraph));
        fragment.append(p);
      });

      return fragment;
    }

    function pastedNodeHasBlockChildren(node) {
      return Array.from(node.childNodes || []).some((child) => {
        return child.nodeType === Node.ELEMENT_NODE &&
          child.matches('p, div, section, article, main, h1, h2, h3, h4, h5, h6, blockquote, ul, ol, li, hr, table, figure');
      });
    }

    function cleanPastedNode(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        return plainTextFragment(node.textContent);
      }
      if (node.nodeType !== Node.ELEMENT_NODE) {
        return document.createDocumentFragment();
      }

      const tag = node.tagName.toLowerCase();
      if (tag === 'br') {
        const p = document.createElement('p');
        p.append(document.createElement('br'));
        return p;
      }
      if (['div', 'section', 'article', 'main'].includes(tag) && pastedNodeHasBlockChildren(node)) {
        const fragment = document.createDocumentFragment();
        node.childNodes.forEach((child) => {
          fragment.append(cleanPastedNode(child));
        });
        return fragment;
      }
      if (['p', 'div', 'section', 'article', 'main'].includes(tag)) {
        const p = document.createElement('p');
        p.innerHTML = sanitizeInlineHtml(node.innerHTML);
        return p.textContent.trim() || p.querySelector('br') ? p : document.createDocumentFragment();
      }
      if (/^h[1-6]$/.test(tag)) {
        const heading = document.createElement('h2');
        heading.innerHTML = sanitizeInlineHtml(node.innerHTML);
        return heading.textContent.trim() ? heading : document.createDocumentFragment();
      }
      if (tag === 'blockquote') {
        const quote = document.createElement('blockquote');
        quote.innerHTML = sanitizeInlineHtml(node.innerHTML);
        return quote.textContent.trim() ? quote : document.createDocumentFragment();
      }
      if (tag === 'ul' || tag === 'ol') {
        const list = document.createElement(tag);
        Array.from(node.children).forEach((child) => {
          if (child.tagName && child.tagName.toLowerCase() === 'li') {
            const li = document.createElement('li');
            li.innerHTML = sanitizeInlineHtml(child.innerHTML);
            if (li.textContent.trim()) {
              list.append(li);
            }
          }
        });
        return list.children.length ? list : document.createDocumentFragment();
      }
      if (tag === 'hr') {
        return document.createElement('hr');
      }
      if (['b', 'strong', 'i', 'em', 'u', 'a', 'span', 'font'].includes(tag)) {
        const p = document.createElement('p');
        p.innerHTML = sanitizeInlineHtml(node.outerHTML);
        return p.textContent.trim() ? p : document.createDocumentFragment();
      }

      const fragment = document.createDocumentFragment();
      node.childNodes.forEach((child) => {
        fragment.append(cleanPastedNode(child));
      });
      return fragment;
    }

    function htmlPasteFragment(html, fallbackText = '') {
      const template = document.createElement('template');
      template.innerHTML = String(html || '');
      const fragment = document.createDocumentFragment();
      template.content.childNodes.forEach((node) => {
        fragment.append(cleanPastedNode(node));
      });
      if (!fragment.childNodes.length && fallbackText) {
        return plainTextFragment(fallbackText);
      }
      return fragment;
    }

    function insertFragmentAtSavedRange(fragment) {
      if (!fragment || !fragment.childNodes.length) {
        return;
      }
      restoreSelection();
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount) {
        editor.append(fragment);
      } else {
        const range = selection.getRangeAt(0);
        if (fragmentContainsBlockNodes(fragment)) {
          insertBlockFragmentAtRange(fragment, range);
        } else {
          range.deleteContents();
          const lastNode = fragment.lastChild;
          range.insertNode(fragment);
          if (lastNode) {
            range.setStartAfter(lastNode);
            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
          }
        }
      }
      normalizeEditorStructure();
      rememberSelection();
      markChanged();
      scheduleToolbarStateUpdate();
    }

    function pasteIsInline(html, text) {
      if (html) {
        const template = document.createElement('template');
        template.innerHTML = html;
        return !template.content.querySelector('p, div, section, article, main, h1, h2, h3, h4, h5, h6, blockquote, ul, ol, li, hr, table');
      }
      return Boolean(text && !/[\r\n]/.test(text));
    }

    function insertInlinePaste(html, text) {
      const inlineHtml = html ? sanitizeInlineHtml(html) : escapeHtml(text);
      if (!inlineHtml) {
        return false;
      }
      ensureEditorSelection(true);
      document.execCommand('insertHTML', false, inlineHtml);
      rememberSelection();
      markChanged();
      scheduleToolbarStateUpdate();
      return true;
    }

    function isFigureNode(node) {
      return node &&
        node.nodeType === Node.ELEMENT_NODE &&
        node.classList.contains('publisher-figure');
    }

    function isEditorChromeNode(node) {
      return node &&
        node.nodeType === Node.ELEMENT_NODE &&
        node.dataset.editorChrome === 'true';
    }

    function isEditableTextBlockElement(element) {
      return Boolean(
        element &&
        element.nodeType === Node.ELEMENT_NODE &&
        ['p', 'h2', 'blockquote'].includes(element.tagName.toLowerCase())
      );
    }

    function isListItemElement(element) {
      return Boolean(
        element &&
        element.nodeType === Node.ELEMENT_NODE &&
        element.tagName.toLowerCase() === 'li'
      );
    }

    function isSupportedTopLevelBlock(node) {
      if (!node || node.nodeType !== Node.ELEMENT_NODE) {
        return false;
      }
      if (isFigureNode(node) || node.classList.contains('unsupported-block')) {
        return true;
      }
      return ['p', 'h2', 'blockquote', 'ul', 'ol', 'hr'].includes(node.tagName.toLowerCase());
    }

    function fragmentContainsBlockNodes(fragment) {
      return Array.from(fragment.childNodes || []).some((node) => {
        if (node.nodeType === Node.TEXT_NODE) {
          return Boolean(node.textContent.trim());
        }
        return node.nodeType === Node.ELEMENT_NODE && !canBufferAsInline(node);
      });
    }

    function normalizeEmptyTextBlock(block) {
      if (!isEditableTextBlockElement(block) && !isListItemElement(block)) {
        return;
      }
      if (nodeHasVisualContent(block)) {
        return;
      }
      block.replaceChildren(document.createElement('br'));
    }

    function emptyBlockCaretTextNode(block) {
      if ((!isEditableTextBlockElement(block) && !isListItemElement(block)) || nodeHasVisualContent(block)) {
        return null;
      }
      const text = document.createTextNode('');
      block.replaceChildren(text);
      return text;
    }

    function textBlockFromRange(range) {
      if (!range) {
        return null;
      }
      const element = elementFromNode(range.startContainer);
      if (!element || !editor.contains(element)) {
        return null;
      }
      const listItem = element.closest('li');
      if (listItem && editor.contains(listItem)) {
        return listItem;
      }
      const block = element.closest('p, h2, blockquote');
      return block && editor.contains(block) ? block : null;
    }

    function placeCaretAtStart(node) {
      const emptyText = emptyBlockCaretTextNode(node);
      const range = document.createRange();
      if (emptyText) {
        range.setStart(emptyText, 0);
      } else {
        range.selectNodeContents(node);
        range.collapse(true);
      }
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      savedRange = range.cloneRange();
      lastBodyCursorRange = range.cloneRange();
      editor.focus();
    }

    function placeCaretAfterInsertedBlocks(insertedNodes, tailBlock = null) {
      if (tailBlock && editor.contains(tailBlock)) {
        placeCaretAtStart(tailBlock);
        return;
      }
      const editableTarget = [...insertedNodes].reverse().find((node) => {
        if (isEditableTextBlockElement(node)) {
          return true;
        }
        if (node && node.nodeType === Node.ELEMENT_NODE && ['ul', 'ol'].includes(node.tagName.toLowerCase())) {
          return node.lastElementChild;
        }
        return false;
      });
      if (editableTarget) {
        if (['ul', 'ol'].includes(editableTarget.tagName.toLowerCase()) && editableTarget.lastElementChild) {
          placeCaretInside(editableTarget.lastElementChild);
        } else {
          placeCaretInside(editableTarget);
        }
        return;
      }
      const lastInserted = insertedNodes[insertedNodes.length - 1];
      const paragraph = createTrailingParagraph();
      if (lastInserted && editor.contains(lastInserted)) {
        lastInserted.after(paragraph);
      } else {
        editor.append(paragraph);
      }
      placeCaretInside(paragraph);
    }

    function splitBlockForInsertion(block, range, insertedNodes) {
      range.deleteContents();
      const tailRange = document.createRange();
      tailRange.setStart(range.startContainer, range.startOffset);
      tailRange.setEnd(block, block.childNodes.length);
      const tail = tailRange.extractContents();
      const beforeHasContent = nodeHasVisualContent(block);
      const afterHasContent = nodeHasVisualContent(tail);
      let tailBlock = null;

      normalizeEmptyTextBlock(block);
      insertedNodes.forEach((node) => {
        if (isEditableTextBlockElement(node) || isListItemElement(node)) {
          normalizeEmptyTextBlock(node);
        }
      });

      if (beforeHasContent) {
        block.after(...insertedNodes);
      } else {
        block.replaceWith(...insertedNodes);
      }

      if (afterHasContent) {
        tailBlock = document.createElement(block.tagName && block.tagName.toLowerCase() === 'li' ? 'li' : 'p');
        tailBlock.dataset.blockId = blockId(tailBlock.tagName.toLowerCase() === 'li' ? 'item' : 'paragraph');
        tailBlock.append(tail);
        normalizeEmptyTextBlock(tailBlock);
        insertedNodes[insertedNodes.length - 1].after(tailBlock);
      }

      placeCaretAfterInsertedBlocks(insertedNodes, tailBlock);
    }

    function insertBlockFragmentAtRange(fragment, range) {
      const insertedNodes = Array.from(fragment.childNodes).filter((node) => {
        return node.nodeType !== Node.TEXT_NODE || Boolean(node.textContent.trim());
      });
      if (!insertedNodes.length) {
        return;
      }

      const block = textBlockFromRange(range);
      if (block && !isListItemElement(block)) {
        splitBlockForInsertion(block, range, insertedNodes);
        return;
      }
      if (isListItemElement(block)) {
        range.deleteContents();
        const list = block.closest('ul, ol');
        if (list && editor.contains(list)) {
          list.after(...insertedNodes);
          placeCaretAfterInsertedBlocks(insertedNodes);
          return;
        }
      }

      range.deleteContents();
      range.insertNode(fragment);
      placeCaretAfterInsertedBlocks(insertedNodes);
    }

    function normalizeEditorStructure() {
      const normalized = document.createDocumentFragment();
      const inlineBuffer = [];

      function flushInlineBuffer() {
        if (!inlineBuffer.length) {
          return;
        }
        const paragraph = document.createElement('p');
        paragraph.dataset.blockId = blockId('paragraph');
        inlineBuffer.splice(0).forEach((node) => paragraph.append(node));
        normalizeEmptyTextBlock(paragraph);
        normalized.append(paragraph);
      }

      Array.from(editor.childNodes).forEach((node) => {
        if (isEditorChromeNode(node)) {
          return;
        }
        if (node.nodeType === Node.TEXT_NODE) {
          if (node.textContent.trim()) {
            inlineBuffer.push(node);
          }
          return;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) {
          return;
        }
        if (isSupportedTopLevelBlock(node)) {
          flushInlineBuffer();
          if (isEditableTextBlockElement(node)) {
            normalizeEmptyTextBlock(node);
          }
          normalized.append(node);
          return;
        }
        if (canBufferAsInline(node)) {
          inlineBuffer.push(node);
          return;
        }
        flushInlineBuffer();
        Array.from(node.childNodes).forEach((child) => {
          if (child.nodeType === Node.TEXT_NODE && !child.textContent.trim()) {
            return;
          }
          normalized.append(child);
        });
      });

      flushInlineBuffer();
      editor.replaceChildren(normalized);
      if (imageDropIndicator) {
        editor.append(imageDropIndicator);
      }
      wireAllFigures();
    }

    function inlineMarkdownFromHtml(html, issues = [], context = {}) {
      const template = document.createElement('template');
      template.innerHTML = sanitizeInlineHtml(html);

      function childrenToMarkdown(node) {
        return Array.from(node.childNodes).map(nodeToMarkdown).join('');
      }

      function nodeToMarkdown(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          return escapeMarkdownText(stripEditorCaretMarkers(node.textContent));
        }
        if (node.nodeType !== Node.ELEMENT_NODE) {
          return '';
        }

        const tag = node.tagName.toLowerCase();
        const inner = childrenToMarkdown(node);
        if (tag === 'br') {
          return '\n';
        }
        if (tag === 'strong' || tag === 'b') {
          return inner ? `**${inner}**` : '';
        }
        if (tag === 'em' || tag === 'i') {
          return inner ? `_${inner}_` : '';
        }
        if (tag === 'u') {
          return inner ? `<u>${inner}</u>` : '';
        }
        if (tag === 'a') {
          const href = safeUrl(node.getAttribute('href'));
          if (!href) {
            issues.push(issue('warning', 'link-unsupported-url', 'A link has an unsupported URL and will be plain text.', context));
            return inner;
          }
          return `[${inner || escapeMarkdownText(href)}](${escapeMarkdownUrl(href)})`;
        }
        if (tag === 'span') {
          if (node.getAttribute('style')) {
            issues.push(issue('warning', 'inline-style-dropped', 'Styled text cannot be represented in publish Markdown yet.', context));
          }
          return inner;
        }
        issues.push(issue('warning', 'inline-markup-dropped', `Inline <${tag}> markup is not supported for publishing yet.`, context));
        return inner;
      }

      return childrenToMarkdown(template.content)
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
    }

    function blockMarkdownLines(value) {
      return String(value || '').split(/\n/);
    }

    function imageMarkdown(alt, src, caption = '') {
      const altText = escapeMarkdownAlt(alt);
      const url = escapeMarkdownUrl(src);
      const title = escapeMarkdownTitle(caption);
      return title ? `![${altText}](${url} "${title}")` : `![${altText}](${url})`;
    }

    function markdownBodyIsEmpty(blocks) {
      return !blocks.some((block) => {
        if (block.type === 'image' || block.type === 'divider') {
          return true;
        }
        if (block.type === 'list') {
          return block.items.some((item) => String(item.markdown || item.text || '').trim());
        }
        return String(block.markdown || block.text || '').trim();
      });
    }

    function blockHasContent(block) {
      if (!block) {
        return false;
      }
      if (block.type === 'divider' || block.type === 'image') {
        return true;
      }
      if (block.type === 'list') {
        return block.items.some((item) => item.html.replace(/<br\s*\/?>/gi, '').trim());
      }
      return stripEditorCaretMarkers(block.html || '').replace(/<br\s*\/?>/gi, '').trim().length > 0;
    }

    function normalizeImageUploadStatus(status, source = {}) {
      const value = String(status || '').toLowerCase();
      if (value === 'uploaded' || source.kind === 'url') {
        return 'uploaded';
      }
      if (value === 'uploading') {
        return 'uploading';
      }
      if (value === 'failed') {
        return 'failed';
      }
      if (value === 'needs-key') {
        return 'needs-key';
      }
      if (value === 'missing-local-preview' || source.kind === 'local-missing') {
        return 'missing-local-preview';
      }
      return 'local';
    }

    function setFigureUploadState(figure, status, error = '') {
      if (!figure) {
        return;
      }
      figure.dataset.uploadStatus = normalizeImageUploadStatus(status);
      if (error) {
        figure.dataset.uploadError = error;
      } else {
        delete figure.dataset.uploadError;
      }
      syncFigureStatus(figure);
    }

    function figureStatusLabel(figure) {
      const status = normalizeImageUploadStatus(figure?.dataset.uploadStatus);
      if (status === 'uploading') {
        return 'Preparing image';
      }
      if (status === 'uploaded') {
        return 'Uploaded';
      }
      if (status === 'failed') {
        return 'Upload failed';
      }
      if (status === 'needs-key') {
        return 'Publisher key needed';
      }
      if (status === 'missing-local-preview') {
        return 'Needs image';
      }
      return 'Needs upload';
    }

    function syncFigureStatus(figure) {
      if (!figure) {
        return;
      }
      const status = normalizeImageUploadStatus(figure.dataset.uploadStatus);
      figure.dataset.uploadStatus = status;
      const statusElement = figure.querySelector('.figure-status');
      if (statusElement) {
        statusElement.textContent = figureStatusLabel(figure);
        const uploadError = figure.dataset.uploadError || '';
        statusElement.title = uploadError || statusElement.textContent;
      }
      const retry = figure.querySelector('[data-role="retry"]');
      if (retry) {
        retry.hidden = status !== 'failed';
      }
    }

    function normalizeFigureDisplaySize(value) {
      const size = String(value || '').toLowerCase();
      return figureDisplaySizeOptions.some((option) => option.value === size)
        ? size
        : 'medium';
    }

    function normalizeFigureAlignment(value) {
      const alignment = String(value || '').toLowerCase();
      return figureAlignmentOptions.some((option) => option.value === alignment)
        ? alignment
        : 'center';
    }

    function normalizeFigureWrapMode(value) {
      const wrapMode = String(value || '').toLowerCase();
      return figureWrapModeOptions.some((option) => option.value === wrapMode)
        ? wrapMode
        : 'none';
    }

    function syncFigureSizeControls(figure) {
      if (!figure) {
        return;
      }
      const size = normalizeFigureDisplaySize(figure.dataset.displaySize);
      figure.dataset.displaySize = size;
      figure.querySelectorAll('.figure-size-option').forEach((button) => {
        const active = button.dataset.size === size;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    function syncFigurePlacementControls(figure) {
      if (!figure) {
        return;
      }
      const alignment = normalizeFigureAlignment(figure.dataset.alignment);
      const wrapMode = normalizeFigureWrapMode(figure.dataset.wrapMode);
      figure.dataset.alignment = alignment;
      figure.dataset.wrapMode = wrapMode;
      figure.querySelectorAll('.figure-align-option').forEach((button) => {
        const active = button.dataset.alignment === alignment;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      figure.querySelectorAll('.figure-wrap-option').forEach((button) => {
        const active = button.dataset.wrapMode === wrapMode;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    }

    function setFigureDisplaySize(figure, size, shouldMarkChanged = true) {
      if (!figure) {
        return;
      }
      figure.dataset.displaySize = normalizeFigureDisplaySize(size);
      syncFigureSizeControls(figure);
      if (shouldMarkChanged) {
        markChanged();
      }
    }

    function setFigureAlignment(figure, alignment, shouldMarkChanged = true) {
      if (!figure) {
        return;
      }
      figure.dataset.alignment = normalizeFigureAlignment(alignment);
      syncFigurePlacementControls(figure);
      if (shouldMarkChanged) {
        markChanged();
      }
    }

    function setFigureWrapMode(figure, wrapMode, shouldMarkChanged = true) {
      if (!figure) {
        return;
      }
      figure.dataset.wrapMode = normalizeFigureWrapMode(wrapMode);
      syncFigurePlacementControls(figure);
      if (shouldMarkChanged) {
        markChanged();
      }
    }

    function updateFigureNaturalWidth(figure) {
      const image = figure && figure.querySelector('img');
      if (!figure || !image || !image.naturalWidth) {
        return;
      }
      figure.style.setProperty('--figure-natural-width', `${image.naturalWidth}px`);
    }

    function serializeInlineBlock(element, type, extra = {}) {
      const html = sanitizeInlineHtml(element.innerHTML);
      const block = {
        id: element.dataset.blockId || blockId(type),
        type,
        html,
        text: stripEditorCaretMarkers(element.textContent).trim(),
        ...extra
      };
      const lineSpacing = getElementLineSpacing(element);
      if (lineSpacing) {
        block.lineSpacing = lineSpacing;
      }
      return block;
    }

    function serializeImageBlock(figure) {
      const image = figure.querySelector('img');
      const altInput = figure.querySelector('.figure-alt');
      const caption = figure.querySelector('.figure-caption');
      const src = figure.dataset.savedSrc || (image && image.getAttribute('src')) || '';
      const fileName = (image && image.getAttribute('data-file-name')) || figure.dataset.localFileName || '';
      const mime = (image && image.getAttribute('data-mime')) || figure.dataset.localMime || '';
      const uploadedUrl = safeImagePublishUrl(figure.dataset.uploadedUrl || '');
      const objectKey = figure.dataset.objectKey || '';
      const uploadError = figure.dataset.uploadError || '';

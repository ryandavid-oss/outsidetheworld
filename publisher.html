        : rgbToHex(style?.backgroundColor) || '#fff2a8';
      customColorInput.value = currentColor === '#000000' && command === 'hiliteColor'
        ? '#fff2a8'
        : currentColor;
      updateColorPopoverSwatches(customColorInput.value);
      anchor.setAttribute('aria-expanded', 'true');
      openToolbarPopover(colorPopover, anchor);
    }

    function applyPopoverColor(color, shouldClose = true) {
      if (!activeColorCommand || !color) {
        return;
      }
      updateColorSwatch(activeColorCommand, color);
      applyColor(activeColorCommand, color);
      updateColorPopoverSwatches(color);
      if (shouldClose) {
        closeToolbarPopover();
      }
    }

    function updateToolbarState() {
      const bodyActive = bodyIsActiveTarget();
      const element = selectedElement();
      const list = bodyActive ? selectedList() : null;
      const alignment = bodyActive ? getCurrentAlignment() : '';
      const link = bodyActive ? activeInlineElement('a') : null;

      setButtonDisabled(commandButton('undo'), !queryCommandEnabled('undo'));
      setButtonDisabled(commandButton('redo'), !queryCommandEnabled('redo'));
      setButtonPressed(commandButton('bold'), bodyActive && (queryCommandState('bold') || Boolean(activeInlineElement('b, strong'))));
      setButtonPressed(commandButton('italic'), bodyActive && (queryCommandState('italic') || Boolean(activeInlineElement('i, em'))));
      setButtonPressed(commandButton('underline'), bodyActive && (queryCommandState('underline') || Boolean(activeInlineElement('u'))));
      setButtonPressed(commandButton('insertUnorderedList'), bodyActive && Boolean(list && list.tagName.toLowerCase() === 'ul' && !list.classList.contains('editor-checklist')));
      setButtonPressed(commandButton('insertOrderedList'), bodyActive && Boolean(list && list.tagName.toLowerCase() === 'ol'));
      setButtonPressed(checklistBtn, bodyActive && Boolean(list && list.classList.contains('editor-checklist')));
      setButtonPressed(commandButton('justifyLeft'), bodyActive && alignment === 'left');
      setButtonPressed(commandButton('justifyCenter'), bodyActive && alignment === 'center');
      setButtonPressed(commandButton('justifyRight'), bodyActive && alignment === 'right');
      setButtonPressed(linkBtn, Boolean(link));

      if (bodyActive) {
        updateLineSpacingState();
        const block = selectedBlock();
        const tag = block && block.tagName ? block.tagName.toLowerCase() : 'p';
        formatSelect.value = tag === 'blockquote' ? 'blockquote' : tag === 'h2' ? 'h2' : 'p';
        if (element) {
          const style = window.getComputedStyle(element);
          updateColorSwatch('foreColor', style.color);
          updateColorSwatch('hiliteColor', style.backgroundColor);
        }
      } else {
        updateLineSpacingState('1.5');
        formatSelect.value = 'p';
      }
    }

    function scheduleToolbarStateUpdate() {
      window.requestAnimationFrame(updateToolbarState);
    }

    titleField.addEventListener('focus', () => setActiveEditable(titleField));
    subheadField.addEventListener('focus', () => setActiveEditable(subheadField));
    editor.addEventListener('focus', () => setActiveEditable(editor));
    document.addEventListener('focusin', (event) => {
      if (event.target === titleField) {
        setActiveEditable(titleField);
      } else if (event.target === subheadField) {
        setActiveEditable(subheadField);
      } else if (event.target === editor || editor.contains(event.target)) {
        setActiveEditable(event.target);
      }
    });
    toolbar.addEventListener('pointerdown', (event) => {
      const focused = document.activeElement;
      if (focused === titleField || focused === subheadField) {
        setActiveEditable(focused);
      } else if (focused === editor || editor.contains(focused)) {
        setActiveEditable(focused);
        rememberSelection();
      }
      if (event.target.closest('button')) {
        event.preventDefault();
      }
    });
    editor.addEventListener('click', (event) => {
      if (event.target.closest('.publisher-figure')) {
        return;
      }
      clearFigureSelection();
      setActiveEditable(editor);
      rememberSelection();
    });

    bodyBlock.addEventListener('click', (event) => {
      if (event.target === bodyBlock) {
        focusBodyEnd();
      }
    });

    titleField.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || (event.key === 'Tab' && !event.shiftKey)) {
        event.preventDefault();
        subheadField.focus();
        subheadField.setSelectionRange(subheadField.value.length, subheadField.value.length);
      }
    });

    titleField.addEventListener('paste', (event) => {
      event.preventDefault();
      insertTextIntoTextarea(titleField, event.clipboardData.getData('text/plain'));
    });

    subheadField.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || (event.key === 'Tab' && !event.shiftKey)) {
        event.preventDefault();
        focusBodyEnd();
      } else if (event.key === 'Tab' && event.shiftKey) {
        event.preventDefault();
        titleField.focus();
        titleField.setSelectionRange(titleField.value.length, titleField.value.length);
      }
    });

    subheadField.addEventListener('paste', (event) => {
      event.preventDefault();
      insertTextIntoTextarea(subheadField, event.clipboardData.getData('text/plain'));
    });

    editor.addEventListener('keydown', (event) => {
      if (selectedFigure && (event.key === 'Backspace' || event.key === 'Delete')) {
        event.preventDefault();
        removeFigure(selectedFigure);
        return;
      }
      if (event.key === 'Enter') {
        event.preventDefault();
        if (event.shiftKey) {
          insertSoftLineBreak();
        } else {
          insertParagraphBreak();
        }
        return;
      }
      if (event.key !== 'Tab') {
        return;
      }
      event.preventDefault();
      if (event.shiftKey && (editorIsVisiblyEmpty() || selectionIsAtEditorStart())) {
        subheadField.focus();
        subheadField.setSelectionRange(subheadField.value.length, subheadField.value.length);
        return;
      }
      applyEditorCommand(event.shiftKey ? 'outdent' : 'indent');
    });

    document.addEventListener('selectionchange', () => {
      rememberSelection();
      if (selectionIsInsideEditor()) {
        const selection = window.getSelection();
        const range = selection && selection.rangeCount ? selection.getRangeAt(0) : null;
        if (range && !rangeIsInsideFigure(range)) {
          clearFigureSelection();
        }
        setActiveEditable(editor);
      }
      const focused = document.activeElement;
      if (
        activePopover &&
        !ignoreNextSelectionClose &&
        !activePopover.contains(focused) &&
        !toolbar.contains(focused)
      ) {
        closeToolbarPopover();
      }
      scheduleToolbarStateUpdate();
    });

    document.addEventListener('input', (event) => {

        return;
      }
      if (
        event.target.matches('input, textarea, select') ||
        event.target.isContentEditable
      ) {
        if (event.target === titleField || event.target === subheadField) {
          autoResizeTextarea(event.target);
        }
        markChanged();
        scheduleToolbarStateUpdate();
      }
    });

    document.addEventListener('keyup', scheduleToolbarStateUpdate);
    editor.addEventListener('mouseup', scheduleToolbarStateUpdate);

        if (applied) {
          scheduleToolbarStateUpdate();
        }
      });

    lineSpacingBtn.addEventListener('click', () => {

      updateLineSpacingState();

        closeToolbarPopover();

    checklistBtn.addEventListener('click', () => {

    saveDraftBtn.addEventListener('click', () => {

      setSaveState('Saved locally', true);

        renderPublisherKeyState();

        savePublisherKey();

      }

    clearPublisherKeyBtn.addEventListener('click', clearPublisherKey);

    publishBtn.addEventListener('click', () => {
      const article = updateArticlePayload();
      const payload = buildPublishPayload(article);
      publishPayload.textContent = JSON.stringify(payload, null, 2);
      window.otwPublisherPublishPayload = payload;
      setSaveState(payload.validation.canPublish ? 'Ready locally' : payload.validation.readiness, true);

    insertImageBtn.addEventListener('click', () => {

      activeFigure = null;
      localImageInput.click();

    dividerBtn.addEventListener('click', () => {
      const divider = document.createElement('hr');
      insertNodeAtSavedRange(divider);
      const paragraph = createTrailingParagraph();
      divider.after(paragraph);
      placeCaretInside(paragraph);

    localImageInput.addEventListener('change', () => {
      const file = localImageInput.files && localImageInput.files[0];
      if (activeFigure) {

        activeFigure = null;
      } else {
        insertFigure(file);
      }
      localImageInput.value = '';
    });

    editor.addEventListener('dragover', (event) => {
      if (eventHasInternalImageDrag(event)) {
        updateInternalImageDragTarget(event);
        return;
      }
      const hasImage = Array.from(event.dataTransfer.items || []).some((item) => {
        return item.kind === 'file' && String(item.type || '').startsWith('image/');
      });
      if (!hasImage) {
        return;
      }
      event.preventDefault();
    });

    editor.addEventListener('dragleave', (event) => {
      if (
        eventHasInternalImageDrag(event) &&
        !editor.contains(event.relatedTarget)
      ) {
        hideImageDropIndicator();
      }
    });

    editor.addEventListener('drop', (event) => {
      if (eventHasInternalImageDrag(event)) {
        event.preventDefault();
        const target = imageDropTarget || imageDragTargetFromPoint(event.clientY, draggedFigure);
        moveFigureToDropTarget(draggedFigure, target);
        endFigureDrag();
        return;
      }
      const file = Array.from(event.dataTransfer.files || []).find((item) => {
        return String(item.type || '').startsWith('image/');
      });
      if (!file) {
        return;
      }
      event.preventDefault();
      const range = rangeFromPoint(event.clientX, event.clientY);
      if (range && editor.contains(range.commonAncestorContainer)) {
        insertFigure(file, range);
      } else {
        insertFigure(file);
      }
    });

    editor.addEventListener('paste', (event) => {
      const file = Array.from(event.clipboardData.files || []).find((item) => {
        return String(item.type || '').startsWith('image/');
      });
      if (file) {
        event.preventDefault();
        insertFigure(file);
        return;
      }

      const html = event.clipboardData.getData('text/html');
      const text = event.clipboardData.getData('text/plain');
      if (!html && !text) {
        return;
      }

      event.preventDefault();
      if (pasteIsInline(html, text) && insertInlinePaste(html, text)) {
        return;
      }
      const fragment = html ? htmlPasteFragment(html, text) : plainTextFragment(text);
      insertFragmentAtSavedRange(fragment);
    });

    editor.addEventListener('copy', (event) => {
      if (
        (event.target.matches && event.target.matches('input, textarea')) ||
        !event.clipboardData ||
        !selectionIsInsideEditor()
      ) {
        return;
      }
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount || selection.isCollapsed) {
        return;
      }
      const container = document.createElement('div');
      container.append(selection.getRangeAt(0).cloneContents());
      container.querySelectorAll('[data-editor-chrome]').forEach((node) => node.remove());
      event.clipboardData.setData('text/html', container.innerHTML);
      event.clipboardData.setData('text/plain', container.textContent);
      event.preventDefault();
    });

    settingsToggle.addEventListener('click', () => {
      const isOpen = settingsSheet.classList.toggle('is-open');
      settingsToggle.setAttribute('aria-expanded', String(isOpen));
    });

    document.addEventListener('click', (event) => {
      if (
        settingsSheet.classList.contains('is-open') &&
        !settingsSheet.contains(event.target) &&
        !settingsToggle.contains(event.target)
      ) {
        settingsSheet.classList.remove('is-open');
        settingsToggle.setAttribute('aria-expanded', 'false');
      }
    });

    document.addEventListener('pointerdown', (event) => {
      if (
        activePopover &&
        !activePopover.contains(event.target) &&
        !lineSpacingBtn.contains(event.target) &&
        !textColorBtn.contains(event.target) &&
        !highlightBtn.contains(event.target)
      ) {
        closeToolbarPopover();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        editor.querySelectorAll('.publisher-figure').forEach((figure) => {
          figure.dataset.controlsHidden = 'true';
        });
        clearFigureSelection();
        closeToolbarPopover();
      }
    });

    window.addEventListener('resize', () => {
      if (activePopover) {
        const anchor = activePopover === lineSpacingPopover
          ? lineSpacingBtn
          : activeColorButton || textColorBtn;
        positionPopover(activePopover, anchor);
      }
    });

    window.addEventListener('beforeunload', () => {
      if (imageDropIndicator) {
        imageDropIndicator.remove();
        imageDropIndicator = null;
      }
      imageObjectUrls.forEach((url) => URL.revokeObjectURL(url));
      imageObjectUrls.clear();
    });

    document.querySelectorAll('button, input, select, textarea').forEach((control) => {
      if (control.title || control.hidden || control.classList.contains('color-input')) {
        return;
      }
      const name =
        control.getAttribute('aria-label') ||
        control.textContent.trim() ||
        control.placeholder ||
        control.value;
      if (name) {
        control.title = name;
      }
    });

    document.execCommand('defaultParagraphSeparator', false, 'p');
    const publisherKeyWasImported = migrateLegacyPublisherKey();
    renderPublisherKeyState(publisherKeyWasImported ? 'Publisher access imported' : '');
    if (!importArticleFromHash()) {
      loadDraft();
    }
    updateToolbarState();
    window.otwPublisher = {
      draftKey: DRAFT_KEY,
      serializeArticle,
      buildPublishPayload,
      validatePublishPayload,
      saveDraft,
      loadDraft,
      getArticlePayload() {
        return JSON.parse(articlePayload.textContent || 'null');
      },
      getPublishPayload() {
        return JSON.parse(publishPayload.textContent || 'null');
      },
      hasPublisherKey() {
        return Boolean(getPublisherPublishKey());
      },
      hydrateArticleForTest(article) {
        isHydrating = true;
        hydrateArticle(article);
        autoResizeTextarea(titleField);
        autoResizeTextarea(subheadField);
        isHydrating = false;
        return updateArticlePayload();
      }
    };
    autoResizeTextarea(titleField);
    autoResizeTextarea(subheadField);
  </script>
</body>
</html>

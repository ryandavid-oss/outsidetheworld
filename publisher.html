      const uploadStatus = figure.dataset.uploadStatus || '';
      const displaySize = normalizeFigureDisplaySize(figure.dataset.displaySize);
      const alignment = normalizeFigureAlignment(figure.dataset.alignment);
      const wrapMode = normalizeFigureWrapMode(figure.dataset.wrapMode);
      let source = { kind: 'local-missing' };
      if (uploadedUrl) {
        source = {
          kind: 'url',
          url: uploadedUrl,
          objectKey
        };
      } else if (src.startsWith('data:')) {
        if (src.length > MAX_INLINE_IMAGE_DATA_URL_LENGTH) {
          source = {
            kind: 'local-placeholder',
            fileName,
            mime: mime || src.slice(5, src.indexOf(';')) || '',
            byteEstimate: dataUrlByteEstimate(src),
            dataUrlLength: src.length,
            tooLargeForLocalDraft: true
          };
        } else {
          source = {
            kind: 'local-data-url',
            mime: src.slice(5, src.indexOf(';')) || mime || '',
            dataUrl: src
          };
        }
      } else if (src && !src.startsWith('blob:')) {
        source = { kind: 'url', url: src, objectKey };
      } else if (fileName) {
        source = {
          kind: 'local-placeholder',
          fileName,
          mime,
          byteEstimate: Number(figure.dataset.localByteEstimate || 0),
          dataUrlLength: Number(figure.dataset.localDataUrlLength || 0),
          tooLargeForLocalDraft: figure.dataset.localTooLarge === 'true'
        };
      }
      const status = normalizeImageUploadStatus(uploadStatus, source);

      return {
        id: figure.dataset.blockId || blockId('image'),
        type: 'image',
        source,
        alt: (altInput && altInput.value) || (image && image.alt) || '',
        caption: caption ? caption.textContent.trim() : '',
        displaySize,
        alignment,
        wrapMode,
        status,
        upload: {
          status,
          uploadedUrl: source.kind === 'url' ? source.url : '',
          objectKey,
          error: uploadError
        }
      };
    }

    function serializeListBlock(list) {
      return {
        id: list.dataset.blockId || blockId('list'),
        type: 'list',
        ordered: list.tagName.toLowerCase() === 'ol',
        checklist: list.classList.contains('editor-checklist'),
        lineSpacing: getElementLineSpacing(list),
        items: Array.from(list.children)
          .filter((item) => item.tagName && item.tagName.toLowerCase() === 'li')
          .map((item) => ({
            id: item.dataset.blockId || blockId('item'),
            html: sanitizeInlineHtml(item.innerHTML),
            text: stripEditorCaretMarkers(item.textContent).trim()
          }))
      };
    }

    function serializePlainText(value) {
      return stripEditorCaretMarkers(value)
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean)
        .map((line) => ({
          id: blockId('paragraph'),
          type: 'paragraph',
          html: escapeHtml(line),
          text: line
        }));
    }

    function serializeTextNode(node) {
      return serializePlainText(node.textContent);
    }

    function canBufferAsInline(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        return true;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) {
        return false;
      }
      return ['b', 'strong', 'i', 'em', 'u', 'a', 'span', 'font', 'br'].includes(node.tagName.toLowerCase());
    }

    function serializeInlineNodes(nodes) {
      if (!nodes.length) {
        return [];
      }
      const container = document.createElement('div');
      nodes.forEach((node) => container.append(node.cloneNode(true)));
      if (!container.textContent.trim()) {
        return [];
      }
      const hasInlineMarkup = Array.from(container.childNodes).some((node) => {
        return node.nodeType === Node.ELEMENT_NODE && node.tagName.toLowerCase() !== 'br';
      });
      if (!hasInlineMarkup) {
        return serializePlainText(container.textContent.replace(/\r/g, '\n'));
      }
      return [{
        id: blockId('paragraph'),
        type: 'paragraph',
        html: sanitizeInlineHtml(container.innerHTML).replace(/\n/g, '<br>'),
        text: stripEditorCaretMarkers(container.textContent).trim()
      }];
    }

    function serializeMixedContainer(node) {
      const blocks = [];
      let inlineBuffer = [];

      Array.from(node.childNodes).forEach((child) => {
        if (child.nodeType === Node.ELEMENT_NODE && child.classList.contains('publisher-figure')) {
          blocks.push(...serializeInlineNodes(inlineBuffer));
          inlineBuffer = [];
          blocks.push(serializeImageBlock(child));
          return;
        }
        if (canBufferAsInline(child)) {
          inlineBuffer.push(child);
          return;
        }
        blocks.push(...serializeInlineNodes(inlineBuffer));
        inlineBuffer = [];
        blocks.push(...serializeBodyNode(child));
      });

      blocks.push(...serializeInlineNodes(inlineBuffer));
      return blocks.filter(blockHasContent);
    }

    function serializeBodyNode(node) {
      if (node.nodeType === Node.TEXT_NODE) {
        return serializeTextNode(node);
      }
      if (node.nodeType !== Node.ELEMENT_NODE) {
        return [];
      }

      const tag = node.tagName.toLowerCase();
      if (node.classList.contains('publisher-figure')) {
        return [serializeImageBlock(node)];
      }
      if (node.classList.contains('unsupported-block')) {
        return [{
          id: node.dataset.blockId || blockId('unsupported'),
          type: node.dataset.blockType || 'unsupported',
          originalType: node.dataset.originalType || node.dataset.blockType || 'unknown',
          raw: node.dataset.raw || '',
          html: escapeHtml(node.textContent || 'Unsupported content preserved'),
          text: node.textContent.trim()
        }];
      }
      if (tag === 'p') {
        if (node.querySelector('.publisher-figure')) {
          return serializeMixedContainer(node);
        }
        return [serializeInlineBlock(node, 'paragraph')].filter(blockHasContent);
      }
      if (/^h[1-6]$/.test(tag)) {
        return [serializeInlineBlock(node, 'heading', {
          level: Number(tag.replace('h', ''))
        })].filter(blockHasContent);
      }
      if (tag === 'blockquote') {
        return [serializeInlineBlock(node, 'quote')].filter(blockHasContent);
      }
      if (tag === 'hr') {
        return [{
          id: node.dataset.blockId || blockId('divider'),
          type: 'divider'
        }];
      }
      if (tag === 'ul' || tag === 'ol') {
        return [serializeListBlock(node)].filter(blockHasContent);
      }
      if (node.childNodes.length) {
        return Array.from(node.childNodes).flatMap(serializeBodyNode);
      }
      return [];
    }

    function serializeBodyBlocks() {
      const blocks = [];
      let inlineBuffer = [];

      Array.from(editor.childNodes).forEach((node) => {
        if (canBufferAsInline(node)) {
          inlineBuffer.push(node);
          return;
        }
        blocks.push(...serializeInlineNodes(inlineBuffer));
        inlineBuffer = [];
        blocks.push(...serializeBodyNode(node));
      });

      blocks.push(...serializeInlineNodes(inlineBuffer));
      return blocks.filter(blockHasContent);
    }

    function serializeArticle() {
      return {
        schema: ARTICLE_SCHEMA,
        version: 3,
        createdAt: draftCreatedAt,
        updatedAt: new Date().toISOString(),
        title: titleField.value.trim(),
        subhead: subheadField.value.trim(),
        metadata: {
          docName: docName.value.trim(),
          articleDate: articleDate.value.trim(),
          publishDate: publishDate.value,
          slug: publishSlug.value.trim(),
          surface: publishSurface.value
        },
        body: {
          blocks: serializeBodyBlocks()
        }
      };
    }

    function imageManifestFromBlock(block, index) {
      const source = block.source || { kind: 'local-missing' };
      const uploadedUrl = source.kind === 'url' ? safeImagePublishUrl(source.url) : '';
      const imageId = block.id || blockId('image');
      const status = normalizeImageUploadStatus(block.status || block.upload?.status, source);
      return {
        id: imageId,
        order: index,
        alt: String(block.alt || '').trim(),
        caption: String(block.caption || '').trim(),
        displaySize: normalizeFigureDisplaySize(block.displaySize),
        alignment: normalizeFigureAlignment(block.alignment),
        wrapMode: normalizeFigureWrapMode(block.wrapMode),
        requiresUpload: status !== 'uploaded',
        status,
        uploadError: block.upload?.error || '',
        media: {
          url: uploadedUrl || '',
          publishUrl: uploadedUrl || '',
          objectKey: source.objectKey || block.upload?.objectKey || ''
        },
        localPreview: localImageSourceMeta(source)
      };
    }

    function addImagePublishIssues(image, source, issues) {
      if (source.kind === 'url' && !image.media.url) {
        issues.push(issue('error', 'image-unsupported-url', 'An image has an unsupported publish URL.', { blockId: image.id }));
      }
      if (image.status === 'missing-local-preview' || source.kind === 'local-missing') {
        issues.push(issue('error', 'image-source-missing', 'An image is missing local preview or upload metadata.', { blockId: image.id }));
      } else if (image.status === 'needs-key') {
        issues.push(issue('error', 'publisher-key-required', 'Publisher access key is required before image upload.', { blockId: image.id }));
      } else if (image.status === 'uploading') {
        issues.push(issue('error', 'image-uploading', 'An image upload is still in progress.', { blockId: image.id }));
      } else if (image.status === 'failed') {
        issues.push(issue('error', 'image-upload-failed', 'An image upload failed.', { blockId: image.id }));
      } else if (image.requiresUpload) {
        issues.push(issue('error', 'image-needs-upload', 'A local image needs upload before final publishing.', { blockId: image.id }));
      }

      if (!image.alt) {
        issues.push(issue('warning', 'image-missing-alt', 'An image is missing alt text.', { blockId: image.id }));
      }
      if (source.tooLargeForLocalDraft) {
        issues.push(issue('warning', 'image-local-placeholder', 'A large local image was kept as upload metadata instead of being stored in the draft.', { blockId: image.id }));
      }
    }

    function convertImageBlock(block, index, issues) {
      const source = block.source || { kind: 'local-missing' };
      const image = imageManifestFromBlock(block, index);
      const markdownSource = image.media.url || `otw-local-image:${image.id}`;
      addImagePublishIssues(image, source, issues);

      return {
        type: 'image',
        id: image.id,
        markdown: imageMarkdown(image.alt, markdownSource, image.caption),
        alt: image.alt,
        caption: image.caption,
        displaySize: image.displaySize,
        alignment: image.alignment,
        wrapMode: image.wrapMode,
        presentation: {
          displaySize: image.displaySize,
          alignment: image.alignment,
          wrapMode: image.wrapMode
        },
        imageRef: image.id,
        requiresUpload: image.requiresUpload,
        status: image.status
      };
    }

    function convertBlockToPublish(block, index, issues) {
      if (!block || !block.type) {
        issues.push(issue('error', 'block-unknown', 'An unknown body block cannot be converted for publishing.', { blockIndex: index }));
        return null;
      }

      if (block.type === 'paragraph') {
        const markdown = inlineMarkdownFromHtml(block.html || escapeHtml(block.text || ''), issues, { blockId: block.id });
        return {
          id: block.id || blockId('paragraph'),
          type: 'paragraph',
          markdown,
          text: block.text || '',
          lineSpacing: block.lineSpacing || ''
        };
      }

      if (block.type === 'heading') {
        const level = Math.min(Math.max(Number(block.level) || 2, 2), 6);
        const markdown = inlineMarkdownFromHtml(block.html || escapeHtml(block.text || ''), issues, { blockId: block.id });
        return {
          id: block.id || blockId('heading'),
          type: 'heading',
          level,
          markdown: markdown ? `${'#'.repeat(level)} ${markdown}` : '',
          text: block.text || '',
          lineSpacing: block.lineSpacing || ''
        };
      }

      if (block.type === 'quote') {
        const markdown = inlineMarkdownFromHtml(block.html || escapeHtml(block.text || ''), issues, { blockId: block.id });
        return {
          id: block.id || blockId('quote'),
          type: 'quote',
          markdown: blockMarkdownLines(markdown).map((line) => `> ${line}`.trimEnd()).join('\n'),
          text: block.text || '',
          lineSpacing: block.lineSpacing || ''
        };
      }

      if (block.type === 'list') {
        const ordered = Boolean(block.ordered);
        const checklist = Boolean(block.checklist);
        const items = (block.items || []).map((item, itemIndex) => {
          const markdown = inlineMarkdownFromHtml(item.html || escapeHtml(item.text || ''), issues, {
            blockId: block.id,
            itemId: item.id
          });
          const marker = checklist ? '- [ ] ' : ordered ? `${itemIndex + 1}. ` : '- ';
          return {
            id: item.id || blockId('item'),
            markdown,
            text: item.text || '',
            line: `${marker}${markdown}`
          };
        }).filter((item) => item.markdown.trim());
        return {
          id: block.id || blockId('list'),
          type: 'list',
          ordered,
          checklist,
          items,
          markdown: items.map((item) => item.line).join('\n'),
          lineSpacing: block.lineSpacing || ''
        };
      }

      if (block.type === 'divider') {
        return {
          id: block.id || blockId('divider'),
          type: 'divider',
          markdown: '---'
        };
      }

      if (block.type === 'image') {
        return convertImageBlock(block, index, issues);
      }

      issues.push(issue('error', 'block-unsupported', `Unsupported ${block.type} block found.`, { blockId: block.id, blockIndex: index }));
      return {
        id: block.id || blockId('unsupported'),
        type: block.type,
        markdown: ''
      };
    }

    function convertBodyToPublish(blocks = []) {
      const issues = [];
      const images = [];
      const convertedBlocks = blocks.map((block, index) => {
        const converted = convertBlockToPublish(block, index, issues);
        if (block && block.type === 'image') {
          images.push(imageManifestFromBlock(block, index));
        }
        return converted;
      }).filter(Boolean);

      return {
        blocks: convertedBlocks,
        markdown: convertedBlocks
          .map((block) => block.markdown)
          .filter((markdown) => String(markdown || '').trim())
          .join('\n\n')
          .trim(),
        images,
        issues
      };
    }

    function composeMarkdownDocument(article, bodyMarkdown) {
      const lines = [
        `# ${String(article.title || '').trim()}`,
        `Date: ${article.metadata?.articleDate || article.metadata?.publishDate || ''}`,
        ''
      ];
      if (article.subhead) {
        lines.push(`_${escapeMarkdownText(article.subhead)}_`, '');
      }
      if (bodyMarkdown) {
        lines.push(bodyMarkdown);
      }
      return `${lines.join('\n').replace(/\n{3,}/g, '\n\n').trim()}\n`;
    }

    function validatePublishPayload(payload, conversionIssues = []) {
      const issues = [...conversionIssues];
      if (!payload.title) {
        issues.push(issue('error', 'title-required', 'Title required.'));
      }
      if (markdownBodyIsEmpty(payload.body.blocks)) {
        issues.push(issue('error', 'body-required', 'Body should not be empty.'));
      }

      payload.images.forEach((image) => {
        if (!image.localPreview || image.localPreview.kind === 'missing' || image.localPreview.kind === 'local-missing') {
          issues.push(issue('error', 'image-metadata-missing', 'An image is missing usable metadata.', { imageId: image.id }));
        }
      });

      const blocking = issues.filter((item) => item.level === 'error');
      const warnings = issues.filter((item) => item.level === 'warning');
      const readiness = readinessFromIssues(issues);
      return {
        canPublish: blocking.length === 0,
        readiness,
        issueCount: issues.length,
        blockingCount: blocking.length,
        warningCount: warnings.length,
        issues
      };
    }

    function readinessFromIssues(issues) {
      if (issues.some((item) => item.code === 'title-required')) {
        return 'Needs title';
      }
      if (issues.some((item) => item.code === 'body-required')) {
        return 'Needs body';
      }
      if (issues.some((item) => item.code === 'publisher-key-required')) {
        return 'Needs publisher key';
      }
      if (issues.some((item) => item.code === 'image-uploading')) {
        return 'Image upload in progress';
      }
      if (issues.some((item) => item.code === 'image-upload-failed')) {
        return 'Image upload failed';
      }
      if (issues.some((item) => item.code === 'image-needs-upload' || item.code === 'image-source-missing')) {
        return 'Images need upload';
      }
      if (issues.some((item) => item.level === 'error' || item.code === 'block-unsupported' || item.code === 'block-unknown')) {
        return 'Unsupported content found';
      }
      if (issues.some((item) => item.code === 'image-missing-alt')) {
        return 'Image missing alt text';
      }
      if (issues.some((item) => item.code === 'inline-style-dropped' || item.code === 'inline-markup-dropped')) {
        return 'Unsupported content found';
      }
      return 'Ready to publish';
    }

    function buildPublishPayload(article = serializeArticle()) {
      const body = convertBodyToPublish(article.body?.blocks || []);
      const slugSource = article.metadata?.slug || article.title || article.metadata?.docName || '';
      const payload = {
        schema: PUBLISH_PAYLOAD_SCHEMA,
        version: 1,
        generatedAt: new Date().toISOString(),
        title: article.title || '',
        subhead: article.subhead || '',
        slugCandidate: slugify(slugSource),
        metadata: {
          ...article.metadata,
          createdAt: article.createdAt || draftCreatedAt,
          updatedAt: article.updatedAt || new Date().toISOString(),
          sourceSchema: article.schema,
          sourceVersion: article.version
        },
        body: {
          format: 'markdown',
          markdown: body.markdown,
          blocks: body.blocks
        },
        content: {
          format: 'markdown',
          bodyMarkdown: body.markdown,
          markdown: ''
        },
        images: body.images
      };

      payload.content.markdown = composeMarkdownDocument(article, body.markdown);
      payload.validation = validatePublishPayload(payload, body.issues);
      return payload;
    }

    function articleIsEmpty(article) {
      return !article.title &&
        !article.subhead &&
        !article.metadata.slug &&
        article.body.blocks.length === 0;
    }

    function updateArticlePayload(article = serializeArticle()) {
      articlePayload.textContent = JSON.stringify(article, null, 2);
      window.otwPublisherArticle = article;
      const payload = buildPublishPayload(article);
      publishPayload.textContent = JSON.stringify(payload, null, 2);
      window.otwPublisherPublishPayload = payload;
      setReadinessLabel(payload.validation.readiness);
      return article;
    }

    function readStoredDraft() {
      const keys = [DRAFT_KEY, ...LEGACY_DRAFT_KEYS];
      for (const key of keys) {
        try {
          const draft = JSON.parse(localStorage.getItem(key) || 'null');
          if (draft) {
            return { key, draft };
          }
        } catch (error) {
          // Keep looking for a readable draft.
        }
      }
      return null;
    }

    function renderInlineHtml(target, html) {
      target.innerHTML = sanitizeInlineHtml(html);
    }

    function renderTextBlock(block) {
      const element = document.createElement(block.type === 'heading' ? `h${block.level || 2}` : 'p');
      if (block.type === 'quote') {
        const quote = document.createElement('blockquote');
        quote.dataset.blockId = block.id || blockId('quote');
        renderInlineHtml(quote, block.html || escapeHtml(block.text || ''));
        if (block.lineSpacing) {
          applyLineSpacingClass(quote, block.lineSpacing);
        }
        return quote;
      }
      element.dataset.blockId = block.id || blockId(block.type);
      renderInlineHtml(element, block.html || escapeHtml(block.text || ''));
      if (block.lineSpacing) {
        applyLineSpacingClass(element, block.lineSpacing);
      }
      return element;
    }

    function renderListBlock(block) {
      const list = document.createElement(block.ordered ? 'ol' : 'ul');
      list.dataset.blockId = block.id || blockId('list');
      if (block.checklist) {
        list.classList.add('editor-checklist');
      }
      if (block.lineSpacing) {
        applyLineSpacingClass(list, block.lineSpacing);
      }
      block.items.forEach((item) => {
        const li = document.createElement('li');
        li.dataset.blockId = item.id || blockId('item');
        renderInlineHtml(li, item.html || escapeHtml(item.text || ''));
        list.append(li);
      });
      return list;
    }

    function createFigureElement({
      id = blockId('image'),
      src = '',
      savedSrc = '',
      alt = '',
      caption = '',
      fileName = '',
      mime = '',
      byteEstimate = 0,
      dataUrlLength = 0,
      tooLargeForLocalDraft = false,
      displaySize = 'medium',
      alignment = 'center',
      wrapMode = 'none',
      uploadStatus = '',
      uploadError = '',
      uploadedUrl = '',
      objectKey = ''
    } = {}) {
      const figure = document.createElement('figure');
      figure.className = 'publisher-figure';
      figure.contentEditable = 'false';
      figure.tabIndex = 0;
      figure.setAttribute('role', 'group');
      figure.setAttribute('aria-label', 'Image card');
      figure.dataset.blockId = id;
      figure.dataset.displaySize = normalizeFigureDisplaySize(displaySize);
      figure.dataset.alignment = normalizeFigureAlignment(alignment);
      figure.dataset.wrapMode = normalizeFigureWrapMode(wrapMode);
      figure.dataset.uploadStatus = normalizeImageUploadStatus(uploadStatus || (uploadedUrl ? 'uploaded' : 'local'));
      if (uploadedUrl) {
        figure.dataset.uploadedUrl = uploadedUrl;
      }
      if (objectKey) {
        figure.dataset.objectKey = objectKey;
      }
      if (uploadError) {
        figure.dataset.uploadError = uploadError;
      }
      if (savedSrc) {
        figure.dataset.savedSrc = savedSrc;
      }
      if (fileName) {
        figure.dataset.localFileName = fileName;
      }
      if (mime) {
        figure.dataset.localMime = mime;
      }
      if (byteEstimate) {
        figure.dataset.localByteEstimate = String(byteEstimate);
      }
      if (dataUrlLength) {
        figure.dataset.localDataUrlLength = String(dataUrlLength);
      }
      if (tooLargeForLocalDraft) {
        figure.dataset.localTooLarge = 'true';
      }

      if (src) {
        const image = document.createElement('img');
        image.src = src;
        image.alt = alt;
        image.draggable = false;
        if (fileName) {
          image.setAttribute('data-file-name', fileName);
        }
        if (mime) {
          image.setAttribute('data-mime', mime);
        }
        image.addEventListener('load', () => updateFigureNaturalWidth(figure), { once: true });
        figure.append(image);
        if (image.complete) {
          updateFigureNaturalWidth(figure);
        }
      } else {
        const missing = document.createElement('div');
        missing.className = 'image-missing';
        missing.textContent = 'Local image placeholder';
        figure.append(missing);
      }

      const figcaption = document.createElement('figcaption');
      figcaption.className = 'figure-caption';
      figcaption.contentEditable = 'true';
      figcaption.dataset.placeholder = 'Add a caption';
      figcaption.textContent = caption;

      const meta = document.createElement('div');
      meta.className = 'figure-meta';
      meta.dataset.editorChrome = 'true';

      const details = document.createElement('div');
      details.className = 'figure-details';

      const status = document.createElement('div');
      status.className = 'figure-status';

      const altInput = document.createElement('input');
      altInput.className = 'figure-alt';
      altInput.type = 'text';
      altInput.placeholder = 'Alt text';
      altInput.value = alt;
      altInput.setAttribute('aria-label', 'Image alt text');

      const actions = document.createElement('div');
      actions.className = 'figure-actions';

      const sizeControls = document.createElement('div');
      sizeControls.className = 'figure-size-controls';
      sizeControls.setAttribute('aria-label', 'Image display size');

      figureDisplaySizeOptions.forEach((option) => {
        const button = document.createElement('button');
        button.className = 'figure-size-option';
        button.type = 'button';
        button.textContent = option.label;
        button.title = option.title;
        button.setAttribute('aria-label', option.title);
        button.setAttribute('aria-pressed', 'false');
        button.dataset.size = option.value;
        sizeControls.append(button);
      });

      const alignControls = document.createElement('div');
      alignControls.className = 'figure-align-controls';
      alignControls.setAttribute('aria-label', 'Image alignment');

      figureAlignmentOptions.forEach((option) => {
        const button = document.createElement('button');
        button.className = 'figure-align-option';
        button.type = 'button';
        button.textContent = option.label;
        button.title = option.title;
        button.setAttribute('aria-label', option.title);
        button.setAttribute('aria-pressed', 'false');
        button.dataset.alignment = option.value;
        alignControls.append(button);
      });

      const wrapControls = document.createElement('div');
      wrapControls.className = 'figure-wrap-controls';
      wrapControls.setAttribute('aria-label', 'Image text wrap');

      figureWrapModeOptions.forEach((option) => {
        const button = document.createElement('button');
        button.className = 'figure-wrap-option';
        button.type = 'button';
        button.textContent = option.label;
        button.title = option.title;
        button.setAttribute('aria-label', option.title);
        button.setAttribute('aria-pressed', 'false');
        button.dataset.wrapMode = option.value;
        wrapControls.append(button);
      });

      const moveControls = document.createElement('div');
      moveControls.className = 'figure-move-controls';
      moveControls.setAttribute('aria-label', 'Image placement');

      [
        { role: 'drag', label: 'Drag', title: 'Drag to move' },
        { role: 'move-up', label: 'Up', title: 'Move image up' },
        { role: 'move-down', label: 'Down', title: 'Move image down' },
        { role: 'move-cursor', label: 'Cursor', title: 'Move image to cursor' }
      ].forEach((option) => {
        const button = document.createElement('button');
        button.className = 'figure-move-option';
        button.type = 'button';
        button.textContent = option.label;
        button.title = option.title;
        button.setAttribute('aria-label', option.title);
        button.dataset.role = option.role;
        if (option.role === 'drag') {
          button.classList.add('figure-drag-handle');
          button.draggable = true;
        }
        moveControls.append(button);
      });

      const retry = document.createElement('button');
      retry.className = 'figure-action';
      retry.type = 'button';
      retry.textContent = 'Retry';
      retry.title = 'Retry upload';
      retry.dataset.role = 'retry';
      retry.hidden = true;

      const replace = document.createElement('button');
      replace.className = 'figure-action';
      replace.type = 'button';
      replace.textContent = 'Replace';
      replace.title = 'Replace image';
      replace.dataset.role = 'replace';

      const remove = document.createElement('button');
      remove.className = 'figure-action';
      remove.type = 'button';
      remove.textContent = 'Remove';
      remove.title = 'Remove image';
      remove.dataset.role = 'remove';

      actions.append(sizeControls, alignControls, wrapControls, moveControls, retry, replace, remove);
      details.append(status, altInput);
      meta.append(details, actions);
      figure.append(figcaption, meta);
      syncFigureStatus(figure);
      syncFigureSizeControls(figure);
      syncFigurePlacementControls(figure);
      wireFigure(figure);
      return figure;
    }

    function renderImageBlock(block) {
      const source = block.source || {};
      const src = source.dataUrl || source.url || '';
      const restoredStatus = block.status === 'uploading' && source.kind !== 'url'
        ? 'local'
        : block.status;
      const figure = createFigureElement({
        id: block.id,
        src,
        alt: block.alt || '',
        caption: block.caption || '',
        savedSrc: src,
        fileName: source.fileName || '',
        mime: source.mime || '',
        byteEstimate: source.byteEstimate || 0,
        dataUrlLength: source.dataUrlLength || 0,
        tooLargeForLocalDraft: Boolean(source.tooLargeForLocalDraft),
        displaySize: block.displaySize || 'medium',
        alignment: block.alignment || 'center',
        wrapMode: block.wrapMode || 'none',
        uploadStatus: restoredStatus || block.upload?.status || '',
        uploadError: block.upload?.error || '',
        uploadedUrl: source.kind === 'url' ? source.url : block.upload?.uploadedUrl || '',
        objectKey: source.objectKey || block.upload?.objectKey || ''
      });
      if (!src) {
        figure.dataset.localStatus = block.status || 'missing-local-preview';
        if (source.tooLargeForLocalDraft) {
          figure.dataset.localTooLarge = 'true';
        }
      }
      return figure;
    }

    function renderBodyBlock(block) {
      if (block.type === 'paragraph' || block.type === 'heading' || block.type === 'quote') {
        return renderTextBlock(block);
      }
      if (block.type === 'list') {
        return renderListBlock(block);
      }
      if (block.type === 'divider') {
        const divider = document.createElement('hr');
        divider.dataset.blockId = block.id || blockId('divider');
        return divider;
      }
      if (block.type === 'image') {
        return renderImageBlock(block);
      }
      const unsupported = document.createElement('div');
      unsupported.className = 'unsupported-block';
      unsupported.contentEditable = 'false';
      unsupported.dataset.blockId = block.id || blockId('unsupported');
      unsupported.dataset.blockType = block.type || 'unsupported';
      unsupported.dataset.originalType = block.originalType || block.type || 'unknown';
      unsupported.dataset.raw = JSON.stringify(block);
      unsupported.textContent = `Unsupported ${block.type || 'content'} preserved`;
      return unsupported;
    }

    function hydrateArticle(article) {
      draftCreatedAt = article.createdAt || article.updatedAt || draftCreatedAt || new Date().toISOString();
      docName.value = article.metadata?.docName || docName.value;
      titleField.value = article.title || '';
      subheadField.value = article.subhead || '';
      articleDate.value = article.metadata?.articleDate || articleDate.value;
      publishDate.value = article.metadata?.publishDate || publishDate.value;
      publishSlug.value = article.metadata?.slug || '';
      publishSurface.value = article.metadata?.surface || publishSurface.value;
      editor.replaceChildren();
      (article.body?.blocks || []).forEach((block) => {
        const node = renderBodyBlock(block);
        if (node) {
          editor.append(node);
        }
      });
      normalizeEditorStructure();
    }

    function legacyDraftToArticle(draft) {
      const originalHtml = editor.innerHTML;
      editor.innerHTML = draft.bodyHtml || '';
      normalizeEditorStructure();
      const article = {
        schema: ARTICLE_SCHEMA,
        version: 2,
        createdAt: draft.createdAt || draft.updatedAt || new Date().toISOString(),
        updatedAt: draft.updatedAt || new Date().toISOString(),
        title: draft.title || '',
        subhead: draft.subhead || '',
        metadata: {
          docName: draft.docName || '',
          articleDate: draft.articleDate || '',
          publishDate: draft.publishDate || '',
          slug: draft.publishSlug || '',
          surface: draft.publishSurface || 'Outside The World Article'
        },
        body: {
          blocks: serializeBodyBlocks()
        }
      };
      editor.innerHTML = originalHtml;
      return article;
    }

    function saveDraft() {
      if (isHydrating) {
        return;
      }
      const article = serializeArticle();
      try {
        if (articleIsEmpty(article)) {
          localStorage.removeItem(DRAFT_KEY);
        } else {
          localStorage.setItem(DRAFT_KEY, JSON.stringify({
            version: 3,
            article
          }));
        }
        updateArticlePayload(article);
        setSaveState('Saved locally');
      } catch (error) {
        updateArticlePayload(article);
        setSaveState('Local storage limit', true);
      }
    }

    function loadDraft() {
      const stored = readStoredDraft();
      if (!stored) {
        updateArticlePayload();
        setSaveState('Saved locally');
        return;
      }

      isHydrating = true;
      const draft = stored.draft;
      const article = draft.article
        ? draft.article
        : legacyDraftToArticle(draft);
      hydrateArticle(article);
      autoResizeTextarea(titleField);
      autoResizeTextarea(subheadField);
      isHydrating = false;
      updateArticlePayload();
      if (stored.key !== DRAFT_KEY) {
        saveDraft();
      } else {
        setSaveState('Saved locally');
      }
    }

    function importArticleFromHash() {
      const prefix = '#article=';
      if (!window.location.hash.startsWith(prefix)) {
        return false;
      }
      try {
        const article = JSON.parse(decodeURIComponent(window.location.hash.slice(prefix.length)));
        if (!article || article.schema !== ARTICLE_SCHEMA) {
          return false;
        }
        isHydrating = true;
        hydrateArticle(article);
        autoResizeTextarea(titleField);
        autoResizeTextarea(subheadField);
        isHydrating = false;
        saveDraft();
        window.history.replaceState(null, '', window.location.pathname);
        setSaveState('Imported locally', true);
        return true;
      } catch (error) {
        setSaveState('Could not import', true);
        return false;
      }
    }

    function setActiveEditable(target) {
      activeEditable = target || editor;
      document.querySelectorAll('.title-block, .subhead-block, .body-block').forEach((block) => {
        block.classList.remove('is-active');
      });
      if (activeEditable === titleField) {
        document.querySelector('.title-block').classList.add('is-active');
      } else if (activeEditable === subheadField) {
        document.querySelector('.subhead-block').classList.add('is-active');
      } else {
        bodyBlock.classList.add('is-active');
      }
      scheduleToolbarStateUpdate();
    }

    function commandTargetsBody(command) {
      return bodyOnlyCommands.has(command);
    }

    function bodyIsActiveTarget() {
      const focused = document.activeElement;
      if (
        focused === titleField ||
        focused === subheadField ||
        focused === docName ||
        focused === articleDate ||
        focused === publishDate ||
        focused === publishSlug ||
        focused === publishSurface ||
        focused === publisherAccessKey
      ) {
        return false;
      }
      if (focused === editor || editor.contains(focused)) {
        return true;
      }
      if (
        activeEditable &&
        activeEditable !== editor &&
        !editor.contains(activeEditable)
      ) {
        return false;
      }
      return activeEditable === editor ||
        editor.contains(activeEditable) ||
        selectionIsInsideEditor();
    }

    function showBodyOnlyStatus() {
      setSaveState('Body formatting only', true);
      const focused = document.activeElement;
      if (
        activeEditable &&
        activeEditable !== editor &&
        !editor.contains(activeEditable) &&
        typeof activeEditable.focus === 'function'
      ) {
        activeEditable.focus();
      } else if (
        focused &&
        focused !== document.body &&
        typeof focused.focus === 'function'
      ) {
        focused.focus();
      }
    }

    function focusBodyEnd() {
      setActiveEditable(editor);
      editor.focus();
      restoreSelection();
    }

    function editorIsVisiblyEmpty() {
      return !editor.textContent.trim() && !editor.querySelector('img, hr');
    }

    function selectionIsAtEditorStart() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount || !selectionIsInsideEditor()) {
        return false;
      }
      const range = selection.getRangeAt(0);
      const before = range.cloneRange();
      before.selectNodeContents(editor);
      before.setEnd(range.startContainer, range.startOffset);
      return before.toString().length === 0;
    }

    function selectionIsInsideEditor() {
      const selection = window.getSelection();
      return Boolean(
        selection &&
        selection.rangeCount &&
        editor.contains(selection.anchorNode)
      );
    }

    function elementFromNode(node) {
      if (!node) {
        return null;
      }
      return node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
    }

    function rangeIsInsideFigure(range, figure = null) {
      if (!range) {
        return false;
      }
      const element = elementFromNode(range.commonAncestorContainer);
      const containingFigure = element && element.closest('.publisher-figure');
      return Boolean(containingFigure && (!figure || containingFigure === figure));
    }

    function rememberSelection() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount || !selectionIsInsideEditor()) {
        return;
      }
      const range = selection.getRangeAt(0).cloneRange();
      if (rangeIsInsideFigure(range)) {
        return;
      }
      savedRange = range.cloneRange();
      lastBodyCursorRange = range.cloneRange();
      lastBodyCursorRange.collapse(false);
    }

    function restoreSelection() {
      editor.focus();
      const selection = window.getSelection();
      if (!selection) {
        return;
      }
      selection.removeAllRanges();
      if (savedRange && editor.contains(savedRange.commonAncestorContainer)) {
        selection.addRange(savedRange);
        return;
      }
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      selection.addRange(range);
      savedRange = range.cloneRange();
    }

    function selectedElement() {
      const selection = window.getSelection();
      if (!selection || !selection.rangeCount || !selectionIsInsideEditor()) {
        return null;
      }
      const node = selection.anchorNode;
      if (!node) {
        return null;
      }
      if (node.nodeType === Node.ELEMENT_NODE) {
        return node;
      }
      return node.parentElement;
    }

    function selectedBlock() {
      const element = selectedElement();
      if (!element || !editor.contains(element)) {
        return null;
      }
      return element.closest('li, p, h2, blockquote') || editor;
    }

    function clearFigureSelection(figureToKeep = null) {
      editor.querySelectorAll('.publisher-figure.is-selected').forEach((figure) => {
        if (figure !== figureToKeep) {
          figure.classList.remove('is-selected');
          figure.setAttribute('aria-selected', 'false');
          setFigureChromeFocusable(figure, false);
        }
      });
      if (!figureToKeep && selectedFigure) {
        selectedFigure = null;
      }
    }

    function setFigureChromeFocusable(figure, focusable) {
      if (!figure) {
        return;
      }
      figure.querySelectorAll('.figure-meta button, .figure-meta input').forEach((control) => {
        control.tabIndex = focusable ? 0 : -1;
      });
    }

    function selectFigure(figure, options = {}) {
      if (!figure || !editor.contains(figure)) {
        clearFigureSelection();
        return;
      }
      clearFigureSelection(figure);
      selectedFigure = figure;
      delete figure.dataset.controlsHidden;
      figure.classList.add('is-selected');
      figure.setAttribute('aria-selected', 'true');
      setFigureChromeFocusable(figure, true);
      setActiveEditable(editor);
      if (options.focus) {
        figure.focus({ preventScroll: true });
      }
    }

    function placeCaretInside(node) {
      const emptyText = emptyBlockCaretTextNode(node);
      const range = document.createRange();
      if (emptyText) {
        range.setStart(emptyText, 0);
      } else {
        range.selectNodeContents(node);
        range.collapse(false);
      }
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      savedRange = range.cloneRange();
      editor.focus();
    }

    function nodeHasVisualContent(node) {
      if (!node) {
        return false;
      }
      if (node.nodeType === Node.TEXT_NODE) {
        return Boolean(stripEditorCaretMarkers(node.textContent).trim());
      }
      if (node.nodeType !== Node.ELEMENT_NODE && node.nodeType !== Node.DOCUMENT_FRAGMENT_NODE) {
        return false;
      }
      if (node.querySelector && node.querySelector('img, figure, hr')) {
        return true;
      }
      return Boolean(stripEditorCaretMarkers(node.textContent).trim());
    }

    function cloneEmptyTextBlock(block) {
      const clone = block.cloneNode(false);
      clone.dataset.blockId = blockId(block.tagName ? block.tagName.toLowerCase() : 'paragraph');
      return clone;
    }

    function rangeAtEditorEnd() {
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      return range;
    }

    function rangeCanReceiveFigure(range, figure = null) {
      if (!range || !editor.contains(range.commonAncestorContainer)) {
        return false;
      }
      return !rangeIsInsideFigure(range) && !(figure && figure.contains(range.commonAncestorContainer));
    }

    function setSelectionAfterNode(node) {
      const range = document.createRange();
      range.setStartAfter(node);
      range.collapse(true);
      const selection = window.getSelection();
      if (selection) {
        selection.removeAllRanges();
        selection.addRange(range);
      }
      savedRange = range.cloneRange();
    }

    function insertBlockNodeAtRange(node, range) {
      const targetRange = rangeCanReceiveFigure(range, node) ? range.cloneRange() : rangeAtEditorEnd();
      const startElement = elementFromNode(targetRange.startContainer);
      const containingTextBlock = startElement && startElement.closest('p, h2, blockquote');
      const containingList = startElement && startElement.closest('ul, ol');
      const insertsBlock = node.matches && node.matches('figure, hr');

      if (insertsBlock && containingTextBlock && editor.contains(containingTextBlock)) {
        targetRange.deleteContents();
        const tailRange = document.createRange();
        tailRange.setStart(targetRange.startContainer, targetRange.startOffset);
        tailRange.setEnd(containingTextBlock, containingTextBlock.childNodes.length);
        const tail = tailRange.extractContents();
        const beforeHasContent = nodeHasVisualContent(containingTextBlock);
        const afterHasContent = nodeHasVisualContent(tail);

        if (beforeHasContent) {
          containingTextBlock.after(node);
        } else {
          containingTextBlock.before(node);
          containingTextBlock.remove();
        }

        if (afterHasContent) {
          const trailingBlock = cloneEmptyTextBlock(containingTextBlock);
          trailingBlock.append(tail);
          node.after(trailingBlock);
        }
        setSelectionAfterNode(node);
        return;
      }

      if (insertsBlock && containingList && editor.contains(containingList)) {
        containingList.after(node);
        setSelectionAfterNode(node);
        return;
      }

      targetRange.deleteContents();
      targetRange.insertNode(node);
      setSelectionAfterNode(node);
    }

    function insertNodeAtSavedRange(node) {
      restoreSelection();
      const selection = window.getSelection();
      const range = selection && selection.rangeCount ? selection.getRangeAt(0) : rangeAtEditorEnd();
      insertBlockNodeAtRange(node, range);
      markChanged();
    }

    function significantEditorNodes() {
      return Array.from(editor.childNodes).filter((node) => {
        if (node.nodeType === Node.TEXT_NODE) {
          return Boolean(node.textContent.trim());
        }
        return node.nodeType === Node.ELEMENT_NODE;
      });
    }

    function directEditorNode(node) {
      let current = node;
      while (current && current.parentNode !== editor) {
        current = current.parentNode;
      }
      return current && current.parentNode === editor ? current : null;
    }

    function editableNeighborForFigure(figure, direction = 'next') {
      const nodes = significantEditorNodes();
      const reference = directEditorNode(figure);
      const index = nodes.indexOf(reference);
      if (index === -1) {
        return null;
      }
      const step = direction === 'previous' ? -1 : 1;
      for (let cursor = index + step; cursor >= 0 && cursor < nodes.length; cursor += step) {
        const node = nodes[cursor];
        if (
          node.nodeType === Node.ELEMENT_NODE &&
          !node.classList.contains('publisher-figure') &&
          ['p', 'h2', 'blockquote', 'li'].includes(node.tagName.toLowerCase())
        ) {
          return node;
        }
      }
      return null;
    }

    function ensureEditableParagraphAfterFigure(figure) {
      const next = figure.nextSibling;
      if (
        next &&
        next.nodeType === Node.ELEMENT_NODE &&
        ['p', 'h2', 'blockquote'].includes(next.tagName.toLowerCase())
      ) {
        return next;
      }
      const paragraph = createTrailingParagraph();
      figure.after(paragraph);
      return paragraph;
    }

    function focusNearFigure(figure, direction = 'next') {
      const target = editableNeighborForFigure(figure, direction) ||
        editableNeighborForFigure(figure, direction === 'next' ? 'previous' : 'next');
      if (target) {
        placeCaretInside(target);
        return;
      }
      const paragraph = createTrailingParagraph();
      editor.append(paragraph);
      placeCaretInside(paragraph);
    }

    function removeFigure(figure) {
      if (!figure || !editor.contains(figure)) {
        return;
      }
      revokeFigureUrl(figure);
      stagedImageFiles.delete(figure);
      const focusTarget = editableNeighborForFigure(figure, 'next') ||
        editableNeighborForFigure(figure, 'previous');
      figure.remove();
      if (selectedFigure === figure) {
        selectedFigure = null;
      }
      clearFigureSelection();
      if (focusTarget && editor.contains(focusTarget)) {
        placeCaretInside(focusTarget);
      } else {
        const paragraph = createTrailingParagraph();
        editor.append(paragraph);
        placeCaretInside(paragraph);
      }
      setSaveState('Image removed', true);
      markChanged();
    }

    function moveFigureByBlock(figure, direction) {
      const reference = directEditorNode(figure);
      const nodes = significantEditorNodes();
      const index = nodes.indexOf(reference);
      if (!figure || index === -1) {
        return;
      }
      const target = direction === 'up' ? nodes[index - 1] : nodes[index + 1];
      if (!target) {
        setSaveState(direction === 'up' ? 'Image is already first' : 'Image is already last', true);
        selectFigure(figure, { focus: true });
        return;
      }
      if (direction === 'up') {
        target.before(figure);
      } else {
        target.after(figure);
      }
      selectFigure(figure, { focus: true });
      setSaveState(direction === 'up' ? 'Image moved up' : 'Image moved down', true);
      markChanged();
    }

    function moveFigureToCursor(figure) {
      if (!figure || !editor.contains(figure)) {
        return;
      }
      const range = rangeCanReceiveFigure(lastBodyCursorRange, figure)
        ? lastBodyCursorRange.cloneRange()
        : rangeAtEditorEnd();
      insertBlockNodeAtRange(figure, range);
      ensureEditableParagraphAfterFigure(figure);
      selectFigure(figure, { focus: true });
      setSaveState('Image moved to cursor', true);
      markChanged();
    }

    function ensureImageDropIndicator() {
      if (imageDropIndicator) {
        return imageDropIndicator;
      }
      imageDropIndicator = document.createElement('div');
      imageDropIndicator.className = 'image-drop-indicator';
      imageDropIndicator.dataset.editorChrome = 'true';
      editor.append(imageDropIndicator);
      return imageDropIndicator;
    }

    function hideImageDropIndicator() {
      if (imageDropIndicator) {
        imageDropIndicator.classList.remove('is-active');
      }
      imageDropTarget = null;
    }

    function articleDropNodes(excludeFigure = null) {
      return significantEditorNodes().filter((node) => {
        if (node === imageDropIndicator || node === excludeFigure) {
          return false;
        }
        if (node.nodeType !== Node.ELEMENT_NODE) {
          return false;
        }
        return node.parentNode === editor;
      });
    }

    function imageDragTargetFromPoint(clientY, excludeFigure = null) {
      const nodes = articleDropNodes(excludeFigure);
      if (!nodes.length) {
        return { reference: null, position: 'end' };
      }
      for (const node of nodes) {
        const rect = node.getBoundingClientRect();
        if (clientY < rect.top + (rect.height / 2)) {
          return { reference: node, position: 'before' };
        }
      }
      return { reference: nodes[nodes.length - 1], position: 'after' };
    }

    function positionImageDropIndicator(target) {
      const indicator = ensureImageDropIndicator();
      const editorRect = editor.getBoundingClientRect();
      let top = 0;
      if (target.reference) {
        const rect = target.reference.getBoundingClientRect();
        top = (target.position === 'before' ? rect.top : rect.bottom) - editorRect.top;
      } else {
        top = editor.scrollHeight;
      }
      indicator.style.top = `${Math.max(0, top)}px`;
      indicator.classList.add('is-active');
    }

    function beginFigureDrag(figure, event) {
      if (!figure || !editor.contains(figure) || !event.dataTransfer) {
        return;
      }
      draggedFigure = figure;
      selectFigure(figure, { focus: true });
      figure.classList.add('is-dragging');
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('application/x-otw-image-card', figure.dataset.blockId || '');
      event.dataTransfer.setData('text/plain', 'Move image');
      imageDropTarget = imageDragTargetFromPoint(event.clientY, figure);
      positionImageDropIndicator(imageDropTarget);
    }

    function endFigureDrag() {
      if (draggedFigure) {
        draggedFigure.classList.remove('is-dragging');
      }
      draggedFigure = null;
      hideImageDropIndicator();
    }

    function eventHasInternalImageDrag(event) {
      return Boolean(
        draggedFigure ||
        Array.from(event.dataTransfer?.types || []).includes('application/x-otw-image-card')
      );
    }

    function updateInternalImageDragTarget(event) {
      if (!draggedFigure) {
        return;
      }
      imageDropTarget = imageDragTargetFromPoint(event.clientY, draggedFigure);
      positionImageDropIndicator(imageDropTarget);
      event.preventDefault();
      if (event.dataTransfer) {
        event.dataTransfer.dropEffect = 'move';
      }
    }

    function moveFigureToDropTarget(figure, target) {
      if (!figure || !editor.contains(figure) || !target) {
        return;
      }
      if (target.reference) {
        if (target.position === 'before') {
          target.reference.before(figure);
        } else {
          target.reference.after(figure);
        }
      } else {
        editor.append(figure);
      }
      ensureEditableParagraphAfterFigure(figure);
      selectFigure(figure, { focus: true });
      setSaveState('Image moved', true);
      markChanged();
    }

    function ensureEditorSelection(force = false) {
      if (force || !selectionIsInsideEditor()) {
        restoreSelection();
        return;
      }
      editor.focus();
    }

    function applyEditorCommand(command, value = null, options = {}) {
      if (
        (command === 'undo' || command === 'redo') &&
        activeEditable &&
        activeEditable !== editor &&
        !editor.contains(activeEditable)
      ) {
        activeEditable.focus();
        document.execCommand(command, false, null);
        markChanged();
        updateToolbarState();
        return true;
      }
      if (commandTargetsBody(command) && !bodyIsActiveTarget()) {
        showBodyOnlyStatus();
        return false;
      }
      ensureEditorSelection(Boolean(options.forceRestore));
      document.execCommand(command, false, value);
      rememberSelection();
      markChanged();
      updateToolbarState();
      return true;
    }

    function applyColor(command, value) {
      if (!value) {
        return;
      }
      applyEditorCommand(command, value, { forceRestore: true });
    }

    function createTrailingParagraph() {
      const paragraph = document.createElement('p');
      paragraph.append(document.createElement('br'));
      return paragraph;
    }

    function currentEditorRange() {
      ensureEditorSelection();
      const selection = window.getSelection();
      return selection && selection.rangeCount ? selection.getRangeAt(0) : null;
    }

    function insertSoftLineBreak() {
      const range = currentEditorRange();
      if (!range || rangeIsInsideFigure(range)) {
        return;
      }
      range.deleteContents();
      const br = document.createElement('br');
      const caret = document.createTextNode('\u200B');
      range.insertNode(br);
      br.after(caret);
      range.setStart(caret, 0);
      range.setEnd(caret, caret.textContent.length);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      savedRange = range.cloneRange();
      lastBodyCursorRange = range.cloneRange();
      markChanged();
      scheduleToolbarStateUpdate();
    }

    function splitListItemAtRange(item, range) {
      range.deleteContents();
      const list = item.closest('ul, ol');
      if (!list) {
        return false;
      }
      const tailRange = document.createRange();
      tailRange.setStart(range.startContainer, range.startOffset);
      tailRange.setEnd(item, item.childNodes.length);
      const tail = tailRange.extractContents();
      const itemWasEmpty = !nodeHasVisualContent(item);

      if (itemWasEmpty) {
        const paragraph = createTrailingParagraph();
        list.after(paragraph);
        item.remove();
        if (!list.children.length) {
          list.remove();
        }
        placeCaretInside(paragraph);
        return true;
      }

      normalizeEmptyTextBlock(item);
      const nextItem = document.createElement('li');
      nextItem.dataset.blockId = blockId('item');
      if (nodeHasVisualContent(tail)) {
        nextItem.append(tail);
      }
      normalizeEmptyTextBlock(nextItem);
      item.after(nextItem);
      placeCaretAtStart(nextItem);
      return true;
    }

    function insertParagraphBreak() {
      if (selectedFigure && document.activeElement === selectedFigure) {
        const paragraph = ensureEditableParagraphAfterFigure(selectedFigure);
        clearFigureSelection();
        placeCaretInside(paragraph);
        markChanged();
        return;
      }

      const range = currentEditorRange();
      if (!range || rangeIsInsideFigure(range)) {
        const paragraph = createTrailingParagraph();
        if (selectedFigure && editor.contains(selectedFigure)) {
          selectedFigure.after(paragraph);
        } else {
          editor.append(paragraph);
        }
        clearFigureSelection();
        placeCaretInside(paragraph);
        markChanged();
        return;
      }

      const block = textBlockFromRange(range);
      if (isListItemElement(block)) {
        if (splitListItemAtRange(block, range)) {
          markChanged();
          scheduleToolbarStateUpdate();
        }
        return;
      }

      if (isEditableTextBlockElement(block)) {
        range.deleteContents();
        const tailRange = document.createRange();
        tailRange.setStart(range.startContainer, range.startOffset);
        tailRange.setEnd(block, block.childNodes.length);
        const tail = tailRange.extractContents();
        const beforeHasContent = nodeHasVisualContent(block);
        const afterHasContent = nodeHasVisualContent(tail);
        const nextParagraph = createTrailingParagraph();
        nextParagraph.dataset.blockId = blockId('paragraph');
        if (afterHasContent) {
          nextParagraph.replaceChildren(tail);
        }
        normalizeEmptyTextBlock(block);
        normalizeEmptyTextBlock(nextParagraph);
        block.after(nextParagraph);
        if (!beforeHasContent && afterHasContent) {
          placeCaretInside(block);
        } else {
          placeCaretAtStart(nextParagraph);
        }
        markChanged();
        scheduleToolbarStateUpdate();
        return;
      }

      const paragraph = createTrailingParagraph();
      range.deleteContents();
      range.insertNode(paragraph);
      placeCaretInside(paragraph);
      markChanged();
      scheduleToolbarStateUpdate();
    }

    function uploadTitleForImage() {
      return titleField.value.trim() || docName.value.trim() || 'Untitled Article';
    }

    function updateFigureFromSuccessfulUpload(figure, uploaded) {
      const uploadedUrl = safeImagePublishUrl(uploaded?.url);
      if (!uploadedUrl) {
        throw new Error('Upload completed without a usable image URL.');
      }

      const image = figure.querySelector('img') || document.createElement('img');
      if (!image.parentElement) {
        figure.querySelector('.image-missing')?.replaceWith(image);
        figure.prepend(image);
      }

      const currentObjectUrl = figure.dataset.objectUrl || '';
      figure.style.removeProperty('--figure-natural-width');
      image.addEventListener('load', () => updateFigureNaturalWidth(figure), { once: true });
      image.src = uploadedUrl;
      image.alt = figure.querySelector('.figure-alt')?.value || uploaded.alt || '';
      figure.dataset.savedSrc = uploadedUrl;
      figure.dataset.uploadedUrl = uploadedUrl;
      figure.dataset.objectKey = uploaded.object_key || uploaded.objectKey || '';
      delete figure.dataset.localTooLarge;
      delete figure.dataset.localByteEstimate;
      delete figure.dataset.localDataUrlLength;
      delete figure.dataset.uploadToken;
      delete figure.dataset.uploadError;
      setFigureUploadState(figure, 'uploaded');

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        imageObjectUrls.delete(currentObjectUrl);
        delete figure.dataset.objectUrl;
      }
      if (image.complete) {
        updateFigureNaturalWidth(figure);
      }
      stagedImageFiles.delete(figure);
    }

    async function stageFigureUpload(figure, file) {
      const error = validateStagedImageFile(file);
      if (error) {
        setFigureUploadState(figure, 'failed', error);
        markChanged();
        return;
      }

      const publishKey = getPublisherPublishKey();
      if (!publishKey) {
        setFigureUploadState(figure, 'needs-key', 'Publisher access key is required before image upload.');
        setSaveState('Publisher key needed', true);
        markChanged();
        return;
      }

      const uploadToken = blockId('upload');
      figure.dataset.uploadToken = uploadToken;
      stagedImageFiles.set(figure, file);
      setFigureUploadState(figure, 'uploading');
      markChanged();

      try {
        const uploadFile = shouldCompressStagedImage(file)
          ? await compressStagedImage(file, { fileName: 'narrative-image.jpg' })
          : file;
        if (figure.dataset.uploadToken !== uploadToken) {
          return;
        }

        const formData = new FormData();
        formData.append('image', uploadFile);
        formData.append('date', publishDate.value || new Date().toISOString().slice(0, 10));
        formData.append('title', uploadTitleForImage());
        formData.append('alt', figure.querySelector('.figure-alt')?.value || '');
        formData.append('caption', figure.querySelector('.figure-caption')?.textContent.trim() || '');

        const response = await fetch(UPLOAD_GHOST_IMAGE_ENDPOINT, {
          method: 'POST',
          headers: {
            'x-publish-key': publishKey
          },
          body: formData
        });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload || payload.ok === false || !payload.uploaded) {
          throw new Error(payload?.error || `Image upload failed (${response.status})`);
        }
        if (figure.dataset.uploadToken !== uploadToken) {
          return;
        }
        updateFigureFromSuccessfulUpload(figure, payload.uploaded);
        markChanged();
      } catch (uploadError) {
        if (figure.dataset.uploadToken !== uploadToken) {
          return;
        }
        delete figure.dataset.uploadToken;
        setFigureUploadState(figure, 'failed', uploadError.message || 'Image upload failed.');
        markChanged();
      }
    }

    function retryFigureUpload(figure) {
      const storedFile = stagedImageFiles.get(figure);
      if (storedFile) {
        stageFigureUpload(figure, storedFile);
        return;
      }

      const src = figure.dataset.savedSrc || figure.querySelector('img')?.getAttribute('src') || '';
      const file = src.startsWith('data:')
        ? dataUrlToFile(src, figure.dataset.localFileName || 'staged-image.png', figure.dataset.localMime || '')
        : null;
      if (!file) {
        setFigureUploadState(figure, 'failed', 'Replace this image to retry upload.');
        markChanged();
        return;
      }
      stageFigureUpload(figure, file);
    }

    function retryImagesWaitingForKey() {
      if (!getPublisherPublishKey()) {
        return;
      }
      editor.querySelectorAll('.publisher-figure[data-upload-status="needs-key"]').forEach((figure) => {
        retryFigureUpload(figure);
      });
    }

    function insertFigure(file, range) {
      if (!file || !String(file.type || '').startsWith('image/')) {
        return;
      }

      if (range) {
        savedRange = range.cloneRange();
      }

      const imageUrl = URL.createObjectURL(file);
      imageObjectUrls.add(imageUrl);

      const figure = createFigureElement({
        src: imageUrl,
        fileName: file.name || '',
        mime: file.type || '',
        displaySize: 'medium',
        alignment: 'center',
        wrapMode: 'none',
        uploadStatus: 'local'
      });
      figure.dataset.objectUrl = imageUrl;

      persistFigureFile(figure, file);
      stagedImageFiles.set(figure, file);

      insertNodeAtSavedRange(figure);
      const paragraph = createTrailingParagraph();
      figure.after(paragraph);
      placeCaretInside(paragraph);
      stageFigureUpload(figure, file);
    }

    function replaceFigureImage(figure, file) {
      if (!figure || !file || !String(file.type || '').startsWith('image/')) {
        return;
      }
      revokeFigureUrl(figure);
      delete figure.dataset.uploadedUrl;
      delete figure.dataset.objectKey;
      delete figure.dataset.uploadError;
      delete figure.dataset.uploadToken;
      const imageUrl = URL.createObjectURL(file);
      imageObjectUrls.add(imageUrl);
      figure.dataset.objectUrl = imageUrl;
      let image = figure.querySelector('img');
      if (!image) {
        image = document.createElement('img');
        figure.querySelector('.image-missing')?.replaceWith(image);
      }
      figure.style.removeProperty('--figure-natural-width');
      image.addEventListener('load', () => updateFigureNaturalWidth(figure), { once: true });
      image.src = imageUrl;
      image.alt = figure.querySelector('.figure-alt')?.value || '';
      image.draggable = false;
      image.setAttribute('data-file-name', file.name || '');
      image.setAttribute('data-mime', file.type || '');
      figure.dataset.localFileName = file.name || '';
      figure.dataset.localMime = file.type || '';
      setFigureUploadState(figure, 'local');
      persistFigureFile(figure, file);
      stagedImageFiles.set(figure, file);
      markChanged();
      stageFigureUpload(figure, file);
    }

    function persistFigureFile(figure, file) {
      if (!window.FileReader || !figure || !file) {
        return;
      }
      const reader = new FileReader();
      reader.addEventListener('load', () => {
        if (figure.dataset.uploadStatus === 'uploaded') {
          return;
        }
        const result = String(reader.result || '');
        if (result.length > MAX_INLINE_IMAGE_DATA_URL_LENGTH) {
          delete figure.dataset.savedSrc;
          figure.dataset.localTooLarge = 'true';
          figure.dataset.localByteEstimate = String(dataUrlByteEstimate(result));
          figure.dataset.localDataUrlLength = String(result.length);
          setSaveState('Image saved as placeholder', true);
        } else {
          figure.dataset.savedSrc = result;
          delete figure.dataset.localTooLarge;
          delete figure.dataset.localByteEstimate;
          delete figure.dataset.localDataUrlLength;
        }
        markChanged();
      });
      reader.readAsDataURL(file);
    }

    function wireFigure(figure) {
      if (!figure || figure.dataset.wired === 'true') {
        return;
      }
      const image = figure.querySelector('img');
      const caption = figure.querySelector('.figure-caption');
      const alt = figure.querySelector('.figure-alt');
      const sizeButtons = figure.querySelectorAll('.figure-size-option');
      const alignButtons = figure.querySelectorAll('.figure-align-option');
      const wrapButtons = figure.querySelectorAll('.figure-wrap-option');
      const dragHandle = figure.querySelector('[data-role="drag"]');
      const moveUp = figure.querySelector('[data-role="move-up"]');
      const moveDown = figure.querySelector('[data-role="move-down"]');
      const moveCursor = figure.querySelector('[data-role="move-cursor"]');
      const retry = figure.querySelector('[data-role="retry"]');
      const replace = figure.querySelector('[data-role="replace"]');
      const remove = figure.querySelector('[data-role="remove"]');

      figure.addEventListener('pointerdown', () => {
        selectFigure(figure);
      });

      figure.addEventListener('click', (event) => {
        selectFigure(figure, {
          focus: !event.target.closest('button, input, .figure-caption')
        });
      });

      figure.addEventListener('pointerleave', () => {
        delete figure.dataset.controlsHidden;
      });

      figure.addEventListener('focus', () => {
        selectFigure(figure);
      });

      figure.addEventListener('keydown', (event) => {
        if (event.target !== figure) {
          return;
        }
        if (event.key === 'Backspace' || event.key === 'Delete') {
          event.preventDefault();
          removeFigure(figure);
        } else if (event.key === 'Escape') {
          clearFigureSelection();
          editor.focus();
        }
      });

      if (caption) {
        caption.contentEditable = 'true';
        caption.addEventListener('focus', () => {
          selectFigure(figure);
          setActiveEditable(caption);
        });
        caption.addEventListener('input', markChanged);
      }

      if (alt) {
        alt.addEventListener('focus', () => {
          selectFigure(figure);
          setActiveEditable(alt);
        });
        alt.addEventListener('input', () => {
          const currentImage = figure.querySelector('img');
          if (currentImage) {
            currentImage.alt = alt.value;
          }
          markChanged();
        });
      }

      if (image) {
        image.addEventListener('load', () => updateFigureNaturalWidth(figure));
        if (image.complete) {
          updateFigureNaturalWidth(figure);
        }
      }

      sizeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          selectFigure(figure);
          setFigureDisplaySize(figure, button.dataset.size);
        });
      });

      alignButtons.forEach((button) => {
        button.addEventListener('click', () => {
          selectFigure(figure);
          setFigureAlignment(figure, button.dataset.alignment);
        });
      });

      wrapButtons.forEach((button) => {
        button.addEventListener('click', () => {
          selectFigure(figure);
          setFigureWrapMode(figure, button.dataset.wrapMode);
        });
      });

      if (dragHandle) {
        dragHandle.title = 'Drag to move';
        dragHandle.addEventListener('dragstart', (event) => {
          beginFigureDrag(figure, event);
        });
        dragHandle.addEventListener('dragend', () => {
          endFigureDrag();
        });
      }

      if (moveUp) {
        moveUp.addEventListener('click', () => {
          moveFigureByBlock(figure, 'up');
        });
      }

      if (moveDown) {
        moveDown.addEventListener('click', () => {
          moveFigureByBlock(figure, 'down');
        });
      }

      if (moveCursor) {
        moveCursor.addEventListener('click', () => {
          moveFigureToCursor(figure);
        });
      }

      if (retry) {
        retry.title = 'Retry upload';
        retry.addEventListener('click', () => {
          selectFigure(figure);
          retryFigureUpload(figure);
        });
      }

      if (replace) {
        replace.title = 'Replace image';
        replace.addEventListener('click', () => {
          selectFigure(figure);
          activeFigure = figure;
          localImageInput.click();
        });
      }

      if (remove) {
        remove.title = 'Remove image';
        remove.addEventListener('click', () => {
          removeFigure(figure);
        });
      }

      figure.dataset.wired = 'true';
      syncFigureStatus(figure);
      syncFigureSizeControls(figure);
      syncFigurePlacementControls(figure);
      setFigureChromeFocusable(figure, figure.classList.contains('is-selected'));
    }

    function wireAllFigures() {
      editor.querySelectorAll('.publisher-figure').forEach(wireFigure);
    }

    function revokeFigureUrl(figure) {
      const url = figure && figure.dataset.objectUrl;
      if (!url) {
        return;
      }
      URL.revokeObjectURL(url);
      imageObjectUrls.delete(url);
      delete figure.dataset.objectUrl;
    }

    function rangeFromPoint(x, y) {
      if (document.caretRangeFromPoint) {
        return document.caretRangeFromPoint(x, y);
      }
      if (document.caretPositionFromPoint) {
        const position = document.caretPositionFromPoint(x, y);
        if (!position) {
          return null;
        }
        const range = document.createRange();
        range.setStart(position.offsetNode, position.offset);
        range.collapse(true);
        return range;
      }
      return null;
    }

    function commandButton(command) {
      return toolbar.querySelector(`[data-command="${command}"]`);
    }

    function setButtonPressed(button, active) {
      if (!button) {
        return;
      }
      button.classList.toggle('is-active', Boolean(active));
      if (button.hasAttribute('aria-pressed')) {
        button.setAttribute('aria-pressed', String(Boolean(active)));
      }
    }

    function setButtonDisabled(button, disabled) {
      if (!button) {
        return;
      }
      button.disabled = Boolean(disabled);
      button.setAttribute('aria-disabled', String(Boolean(disabled)));
    }

    function queryCommandState(command) {
      try {
        return Boolean(document.queryCommandState(command));
      } catch (error) {
        return false;
      }
    }

    function queryCommandEnabled(command) {
      try {
        return Boolean(document.queryCommandEnabled(command));
      } catch (error) {
        return true;
      }
    }

    function selectedList() {
      const element = selectedElement();
      return element && editor.contains(element)
        ? element.closest('ul, ol')
        : null;
    }

    function selectedLineSpacingTarget() {
      const element = selectedElement();
      if (!element || !editor.contains(element)) {
        return null;
      }
      return element.closest('ul, ol, p, h2, blockquote') || editor;
    }

    function selectedAlignmentTarget() {
      const element = selectedElement();
      if (!element || !editor.contains(element)) {
        return null;
      }
      return element.closest('li, p, h2, blockquote') || editor;
    }

    function normalizeAlignment(value) {
      const alignment = String(value || '').toLowerCase();
      if (alignment === 'center') {
        return 'center';
      }
      if (alignment === 'right' || alignment === 'end') {
        return 'right';
      }
      return 'left';
    }

    function getCurrentAlignment() {
      const target = selectedAlignmentTarget();
      if (!target) {
        return 'left';
      }
      return normalizeAlignment(window.getComputedStyle(target).textAlign);
    }

    function getElementLineSpacing(element) {
      if (!element) {
        return '';
      }
      return lineSpacingValues.find((value) => {
        return element.classList.contains(lineSpacingClasses[value]);
      }) || '';
    }

    function getCurrentLineSpacing() {
      const target = selectedLineSpacingTarget();
      if (!target) {
        return '1.5';
      }
      return getElementLineSpacing(target) || '1.5';
    }

    function applyLineSpacingClass(element, value) {
      if (!element || !lineSpacingClasses[value]) {
        return;
      }
      Object.values(lineSpacingClasses).forEach((className) => {
        element.classList.remove(className);
      });
      element.classList.add(lineSpacingClasses[value]);
    }

    function applyLineSpacing(value) {
      if (!lineSpacingClasses[value]) {
        return;
      }
      restoreSelection();
      const target = selectedLineSpacingTarget() || editor;
      applyLineSpacingClass(target, value);
      updateLineSpacingState(value);
      setSaveState(`Line spacing ${value}`, true);
      rememberSelection();
      markChanged();
    }

    function updateLineSpacingState(value = getCurrentLineSpacing()) {
      lineSpacingValue.textContent = value;
      lineSpacingBtn.dataset.tooltip = `Line spacing ${value}`;
      lineSpacingBtn.title = `Line spacing ${value}`;
      lineSpacingPopover.querySelectorAll('.spacing-option').forEach((option) => {
        option.setAttribute('aria-pressed', String(option.dataset.spacing === value));
      });
    }

    function activeInlineElement(selector) {
      const element = selectedElement();
      return element && editor.contains(element)
        ? element.closest(selector)
        : null;
    }

    function rgbToHex(value) {
      const color = String(value || '').trim();
      if (/^#[0-9a-f]{6}$/i.test(color)) {
        return color.toLowerCase();
      }
      const match = color.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?/i);
      if (!match) {
        return '';
      }
      if (match[4] !== undefined && Number(match[4]) === 0) {
        return '';
      }
      return `#${[1, 2, 3].map((index) => {
        return Number(match[index]).toString(16).padStart(2, '0');
      }).join('')}`;
    }

    function updateColorSwatch(command, color) {
      const hex = rgbToHex(color);
      if (!hex) {
        return;
      }
      if (command === 'foreColor') {
        textColorBtn.style.setProperty('--tool-color', hex);
      }
      if (command === 'hiliteColor') {
        highlightBtn.style.setProperty('--highlight-color', hex);
      }
    }

    function updateColorPopoverSwatches(color) {
      const hex = rgbToHex(color);
      colorPopover.querySelectorAll('.color-swatch-btn').forEach((button) => {
        button.setAttribute('aria-pressed', String(Boolean(hex) && button.dataset.color.toLowerCase() === hex));
      });
      if (hex) {
        customColorInput.value = hex;
      }
    }

    function positionPopover(popover, anchor) {
      const anchorRect = anchor.getBoundingClientRect();
      const margin = 10;
      popover.hidden = false;
      const popoverRect = popover.getBoundingClientRect();
      const left = Math.min(
        Math.max(margin, anchorRect.left + (anchorRect.width / 2) - (popoverRect.width / 2)),
        window.innerWidth - popoverRect.width - margin
      );
      const top = Math.min(
        anchorRect.bottom + 8,
        window.innerHeight - popoverRect.height - margin
      );
      popover.style.left = `${left}px`;
      popover.style.top = `${Math.max(margin, top)}px`;
    }

    function closeToolbarPopover() {
      if (!activePopover) {
        return;
      }
      activePopover.hidden = true;
      activePopover = null;
      activeColorCommand = '';
      activeColorButton = null;
      lineSpacingBtn.setAttribute('aria-expanded', 'false');
      textColorBtn.setAttribute('aria-expanded', 'false');
      highlightBtn.setAttribute('aria-expanded', 'false');
    }

    function openToolbarPopover(popover, anchor) {
      if (activePopover && activePopover !== popover) {
        closeToolbarPopover();
      }
      activePopover = popover;
      ignoreNextSelectionClose = true;
      window.setTimeout(() => {
        ignoreNextSelectionClose = false;
      }, 120);
      positionPopover(popover, anchor);
    }

    function openColorPopover(command, anchor) {
      activeColorCommand = command;
      activeColorButton = anchor;
      colorPopoverTitle.textContent = command === 'foreColor' ? 'Text Color' : 'Highlight';
      const element = selectedElement();
      const style = element ? window.getComputedStyle(element) : null;
      const currentColor = command === 'foreColor'
        ? rgbToHex(style?.color) || '#244f9e'

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decryption Required | Outside The World</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&display=swap');

        :root {
            --brand-purple: #9b59b6;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--brand-purple);
            font-family: 'Fira Code', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* SCANLINE EFFECT */
        body::after {
            content: " "; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(155, 89, 182, 0.02), rgba(155, 89, 182, 0.01), rgba(155, 89, 182, 0.02));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 100; opacity: 0.2;
        }

        .terminal-box {
            max-width: 400px;
            width: 90%;
            padding: 40px;
            border: 1px solid rgba(155, 89, 182, 0.2);
            background: rgba(155, 89, 182, 0.02);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .terminal-header {
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0.8;
        }

        input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            color: white;
            font-family: 'Fira Code', monospace;
            font-size: 1rem;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            transition: 0.4s;
            letter-spacing: 2px;
        }

        input:focus {
            border-color: var(--brand-purple);
            box-shadow: 0 0 20px rgba(155, 89, 182, 0.3);
            background: rgba(155, 89, 182, 0.05);
        }

        .status-msg {
            font-size: 0.6rem;
            margin-top: 30px;
            letter-spacing: 3px;
            color: #555;
            text-transform: uppercase;
        }

        .error-shake {
            animation: shake 0.4s ease-in-out;
            border-color: #e74c3c !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .back-link {
            position: absolute;
            bottom: -60px;
            left: 0;
            width: 100%;
            text-decoration: none;
            color: #444;
            font-size: 0.6rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .back-link:hover { color: var(--brand-purple); }
    </style>
</head>
<body>

    <div class="terminal-box">
        <div class="terminal-header">UPLINK_ENCRYPTED // AREA_03</div>
        
        <input type="password" id="passkey" placeholder="DECRYPTION_KEY" onkeypress="handleInput(event)">
        
        <div class="status-msg" id="status">WAITING_FOR_KEY...</div>

        <a href="personal.html" class="back-link">[ ABORT_CONNECTION ]</a>
    </div>

    <script>
        // THE DEADBOLT LOGIC
        // To change your password: Go to any Base64 encoder online, 
        // type your pass, and replace the string below.
        const SECRET_HASH = "WW91clBhc3N3b3JkSGVyZQ=="; // Currently: 'YourPasswordHere'

        function handleInput(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById('passkey');
                const status = document.getElementById('status');
                
                status.innerText = "AUTHENTICATING...";

                setTimeout(() => {
                    if (btoa(input.value) === SECRET_HASH) {
                        status.innerText = "ACCESS_GRANTED // DECRYPTING...";
                        status.style.color = "#2ecc71";
                        setTimeout(() => {
                            window.location.href = "transform_zion.html"; 
                        }, 1000);
                    } else {
                        status.innerText = "ACCESS_DENIED // KEY_INVALID";
                        status.style.color = "#e74c3c";
                        input.classList.add('error-shake');
                        input.value = "";
                        setTimeout(() => {
                            input.classList.remove('error-shake');
                            status.innerText = "WAITING_FOR_KEY...";
                            status.style.color = "#555";
                        }, 1500);
                    }
                }, 800);
            }
        }
    </script>
</body>
</html>

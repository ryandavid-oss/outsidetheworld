	   @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@300;400;500&family=Inter:wght@300;400;900&family=Fira+Code:wght@300;500&display=swap');

        :root {
            --amethyst: #9b59b6;
            --page-bg: var(--bg-dark, #050505);
            --page-blue: var(--brand-blue, #6395ee);
            --page-teal: var(--brand-teal, #a0bef5);
            --border-low: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(4, 7, 10, 0.7);
        }

        body {
            background-color: var(--page-bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 1. SIDEBAR / DIRECTORY */
        .directory {
            width: 380px;
            border-right: 1px solid var(--border-low);
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(4, 7, 10, 0.96) 0%, rgba(4, 7, 10, 0.9) 100%);
            z-index: 100;
            flex-shrink: 0;
        }

        .dir-header {
            padding: 36px 36px 24px;
            border-bottom: 1px solid var(--border-low);
            text-align: center;
        }

        .hero-logo-container {
            min-height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* LOGO AS BACK BUTTON [Requirement 1, 4, & 5] */
        .sidebar-logo {
            width: 282px;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .sidebar-logo:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .tuning-knob {
            padding: 26px 36px 24px;
            position: relative;
        }

        .knob-label {
            font-family: 'Fira Code';
            font-size: 0.55rem;
            color: #8ca5ab;
            letter-spacing: 2.4px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
            text-align: left;
        }

        select.freq-filter {
            background: rgba(11, 16, 20, 0.96);
            border: 1px solid rgba(160, 190, 245, 0.18);
            color: var(--page-teal);
            font-family: 'Fira Code';
            font-size: 0.72rem;
            letter-spacing: 1px;
            padding: 14px 42px 14px 14px;
            width: 100%;
            cursor: pointer;
            outline: none;
            appearance: none;
            border-radius: 16px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
        }

        select.freq-filter:hover,
        select.freq-filter:focus {
            border-color: rgba(160, 190, 245, 0.34);
            background: rgba(13, 19, 24, 0.98);
        }

        .filter-wrap {
            position: relative;
        }

        .filter-wrap::after {
            content: "⌄";
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(160, 190, 245, 0.75);
            font-size: 0.95rem;
            pointer-events: none;
        }

        .knob-helper {
            margin: 12px 0 0;
            font-size: 0.68rem;
            line-height: 1.6;
            color: #7d8d92;
        }

        .file-list {
            flex-grow: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .file-item {
            padding: 20px 40px;
            cursor: pointer;
            transition: 0.3s;
            border-left: 3px solid transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .file-item.active {
            background: rgba(155, 89, 182, 0.1);
            border-left-color: var(--amethyst);
        }

        .file-item h3 {
            font-family: 'Fira Code';
            font-size: 0.75rem;
            margin: 0 0 5px 0;
            color: #eee;
            font-weight: 500;
        }

        .file-item span {
            font-size: 0.55rem;
            color: #7f8f95;
            letter-spacing: 1.5px;
        }

        /* 2. READER VIEW */
        .extraction-pane {
            flex-grow: 1;
            padding: 60px;
            overflow-y: auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 80px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            border-radius: 28px;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1);
            box-sizing: border-box;
        }

        .glass-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .poem-title {
            font-family: 'Inter';
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: -1px;
            margin: 0 0 10px 0;
            color: #fff;
        }

        .poem-meta {
            font-family: 'Fira Code';
            font-size: 0.6rem;
            color: var(--page-teal);
            margin-bottom: 40px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .poem-share {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin: -18px 0 34px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #8ca5ab;
            font-family: 'Fira Code', monospace;
            font-size: 0.62rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            transition: color 0.24s ease, transform 0.24s ease;
        }

        .poem-share:hover,
        .poem-share:focus-visible {
            color: var(--page-blue);
            transform: translateY(-1px);
            outline: none;
        }

        .poem-share-status {
            color: #7f8f95;
        }

        .poem-body {
            font-family: 'IBM Plex Serif', serif;
            font-size: 1.05rem;
            line-height: 2.1;
            color: #d8d5cf;
            white-space: pre-line;
            font-weight: 400;
            text-wrap: pretty;
        }

        /* --- MOBILE ARCHITECTURE --- */
        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                overflow-y: auto;
                height: auto;
            }

            .directory {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-low);
            }

            .dir-header {
                padding: 40px 20px 20px;
            }

            .hero-logo-container {
                min-height: 72px;
            }

            .sidebar-logo {
                width: 220px;
            }

            .tuning-knob {
                padding: 20px 20px 30px;
            }

            .knob-helper {
                font-size: 0.7rem;
            }

            .file-list {
                max-height: 45vh;
                border-top: 1px solid var(--border-low);
            }

            .file-item {
                padding: 20px;
            }

            .extraction-pane {
                padding: 20px;
                min-height: 60vh;
            }

            .glass-card {
                padding: 50px 25px;
                border-radius: 22px;
                border: none;
                background: rgba(0, 0, 0, 0.85);
            }

            .poem-title {
                font-size: 1.5rem;
            }

            .poem-body {
                font-size: 1rem;
                line-height: 1.9;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-low);
        }
  
/* THE CLEAN ATMOSPHERIC WASH */

 <body>
  <div id="cursor-ring">
  </div>
  <div id="cursor-dot">
  </div>
  <aside class="directory">
   <div class="dir-header">
    <a href="flotsam.html">
     <div class="hero-logo-container">
      <img alt="BACK TO INTERFACE" class="sidebar-logo hero-logo" src="Images/Equal.svg"/>
     </div>
    </a>
   </div>
   <div class="tuning-knob">
    <label class="knob-label">
     Tune by topic
    </label>
    <div class="filter-wrap">
     <select class="freq-filter" id="freq-select" onchange="filterFrequencies()">
      <option value="ALL">
       TONE / THEME
      </option>
     </select>
    </div>
    <p class="knob-helper">
     Shift the archive by signal family, tone, or recurring subject.
    </p>
   </div>
   <div class="file-list" id="file-list">
   </div>
  </aside>
  <main class="extraction-pane">
   <div class="glass-card" id="glass-container">
   </div>
  </main>
  <script src="poetry_data.js">
  </script>
  <script>
   function initArchive() {
            const list = document.getElementById('file-list');
            const select = document.getElementById('freq-select');

            // Extract unique frequencies
            const frequencies = [...new Set(archive.map(p => p.frequency))].sort();
            frequencies.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                select.appendChild(opt);
            });

            renderList("ALL");
        }

        function renderList(filter) {
            const list = document.getElementById('file-list');
            list.innerHTML = "";

            archive.forEach((poem, index) => {
                if (filter === "ALL" || poem.frequency === filter) {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.setAttribute('data-id', index);
                    item.onclick = () => {
                        displayPoem(index);
                        if (window.innerWidth <= 1024) {
                            document.querySelector('.extraction-pane').scrollIntoView({ behavior: 'smooth' });
                        }
                    };
                    item.innerHTML = `
                        <h3>${poem.title}</h3>
                        <span>[${poem.frequency}] // ${poem.date}</span>
                    `;
                    list.appendChild(item);
                }
            });
        }

        function filterFrequencies() {
            const val = document.getElementById('freq-select').value;
            renderList(val);
        }

        function updateUrlForPoem(poem, replace = false) {
            const url = new URL(window.location.href);
            url.searchParams.set('poem', poem.id || '');
            const next = `${url.pathname}${url.search}${url.hash}`;
            const state = { poemId: poem.id || '' };

            if (replace) {
                history.replaceState(state, '', next);
            } else {
                history.pushState(state, '', next);
            }
        }

        function findPoemIndexById(poemId) {
            if (!poemId) return -1;
            return archive.findIndex((poem) => poem.id === poemId);
        }

        function buildShareUrl(poem) {
            const url = new URL(window.location.href);
            url.searchParams.set('poem', poem.id || '');
            return url.toString();
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                ta.remove();
                return ok;
            }
        }

        async function sharePoemLink(index) {
            const poem = archive[index];
            if (!poem) return;

            const shareUrl = buildShareUrl(poem);
            const shareTitle = poem.title || 'Verse Archive Entry';
            const statusEl = document.getElementById('share-status');

            try {
                if (navigator.share) {
                    await navigator.share({
                        title: shareTitle,
                        text: `${shareTitle} // Outside The World`,
                        url: shareUrl
                    });
                    if (statusEl) statusEl.textContent = 'LINK_SHARED';
                    return;
                }

                const ok = await copyToClipboard(shareUrl);
                if (statusEl) statusEl.textContent = ok ? 'LINK_COPIED' : 'COPY_FAILED';
            } catch {
                if (statusEl) statusEl.textContent = 'SHARE_CANCELLED';
            }
        }

        function displayPoem(index, options = {}) {
            const container = document.getElementById('glass-container');
            const poem = archive[index];
            if (!poem) return;
            const { replaceUrl = false } = options;

            // VIBRANCY RESTORED: Transparent center + Screen blend mode
            document.body.style.background = `
                radial-gradient(circle at center, transparent 0%, rgba(5,5,5,0.9) 100%),
                ${poem.thumbprint}
            `;

            document.body.style.backgroundBlendMode = "screen";
            document.body.style.backgroundColor = "#050505";

            container.classList.remove('visible');

            setTimeout(() => {
                container.innerHTML = `
                    <h1 class="poem-title">${poem.title}</h1>
                    <div class="poem-meta">SIGNAL: ${poem.frequency} // ORIGIN: ${poem.date}</div>
                    <button class="poem-share" type="button" onclick="sharePoemLink(${index})">
                        <span>COPY / SHARE LINK</span>
                        <span class="poem-share-status" id="share-status">READY</span>
                    </button>
                    <div class="poem-body">${poem.body}</div>
                `;
                container.classList.add('visible');
                container.scrollTop = 0;
            }, 400);

            document.querySelectorAll('.file-item').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-id') == index);
            });

            updateUrlForPoem(poem, replaceUrl);
        }

        // THIS WAS THE MISSING PIECE:
        window.onload = () => {
            initArchive();
            const requestedPoemId = new URLSearchParams(window.location.search).get('poem');
            const requestedIndex = findPoemIndexById(requestedPoemId);

            if (requestedIndex >= 0) {
                const requestedPoem = archive[requestedIndex];
                const select = document.getElementById('freq-select');
                if (select && requestedPoem.frequency) {
                    select.value = requestedPoem.frequency;
                    renderList(requestedPoem.frequency);
                }
                displayPoem(requestedIndex, { replaceUrl: true });
            } else if (archive.length > 0) {
                displayPoem(0, { replaceUrl: true });
            }
        };

        window.addEventListener('popstate', () => {
            const requestedPoemId = new URLSearchParams(window.location.search).get('poem');
            const requestedIndex = findPoemIndexById(requestedPoemId);
            if (requestedIndex >= 0) {
                const requestedPoem = archive[requestedIndex];
                const select = document.getElementById('freq-select');
                if (select && requestedPoem.frequency) {
                    select.value = requestedPoem.frequency;
                    renderList(requestedPoem.frequency);
                }
                displayPoem(requestedIndex, { replaceUrl: true });
            }
        });
  </script>

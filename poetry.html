<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verse Archive | Outside The World</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;900&family=Fira+Code:wght@300;500&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap');

        :root {
            --brand-blue: #6395EE;
            --brand-teal: #91AFB3;
            --amethyst: #9b59b6;
            --bg-dark: #050505;
            --border-low: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            color: white; font-family: 'Inter', sans-serif;
            margin: 0; display: flex; height: 100vh; overflow: hidden;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 1. SIDEBAR (LOGO & TUNING) */
        .directory {
            width: 380px; border-right: 1px solid var(--border-low);
            display: flex; flex-direction: column; background: #050505;
            z-index: 100;
        }

        .dir-header { padding: 40px; border-bottom: 1px solid var(--border-low); }
        
        /* HERO LOGO [Requirement 4] */
        .sidebar-logo {
            width: 140px; filter: brightness(0) invert(1);
            opacity: 0.6; margin-bottom: 30px;
        }

        /* TUNING KNOB (FREQUENCY SELECTOR) [Requirement 1] */
        .tuning-knob {
            padding: 0 40px 20px;
        }
        .knob-label {
            font-family: 'Fira Code'; font-size: 0.55rem; color: #555;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; display: block;
        }
        select.freq-filter {
            background: transparent; border: 1px solid var(--border-low);
            color: var(--brand-teal); font-family: 'Fira Code'; font-size: 0.7rem;
            padding: 8px; width: 100%; cursor: pointer; outline: none;
            transition: 0.3s;
        }
        select.freq-filter:hover { border-color: var(--brand-teal); }

        .file-list { flex-grow: 1; overflow-y: auto; }
        .file-item {
            padding: 20px 40px; cursor: pointer; transition: 0.3s;
            border-left: 3px solid transparent; border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .file-item:hover { background: rgba(255, 255, 255, 0.03); }
        .file-item.active { background: rgba(155, 89, 182, 0.1); border-left-color: var(--amethyst); }
        .file-item h3 { font-family: 'Fira Code'; font-size: 0.75rem; margin: 0 0 5px 0; color: #eee; font-weight: 500; }
        .file-item span { font-size: 0.55rem; color: #444; letter-spacing: 1.5px; }

        /* 2. READER VIEW (GLASS CARD) [Requirement 2] */
        .extraction-pane { 
            flex-grow: 1; padding: 60px; overflow-y: auto; position: relative; 
            display: flex; justify-content: center; align-items: flex-start;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 80px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            opacity: 0; transform: translateY(20px);
            transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }
        .glass-card.visible { opacity: 1; transform: translateY(0); }

        /* TITLES & BODY [Requirement 3 & 5] */
        .poem-title {
            font-family: 'Inter'; font-weight: 900; font-size: 1.8rem;
            letter-spacing: -1px; margin: 0 0 10px 0; color: #fff;
        }

        .poem-meta { 
            font-family: 'Fira Code'; font-size: 0.6rem; color: var(--brand-teal); 
            margin-bottom: 40px; letter-spacing: 3px; text-transform: uppercase;
        }

        .poem-body { 
            font-family: 'Merriweather', serif; 
            font-size: 1.05rem; /* Slightly smaller font */
            line-height: 2.1; 
            color: #ccc; white-space: pre-line; font-weight: 300;
        }

        .back-signal {
            position: fixed; top: 40px; right: 40px; z-index: 200;
            font-family: 'Fira Code'; font-size: 0.6rem; color: #444;
            text-decoration: none; letter-spacing: 3px;
        }
        .back-signal:hover { color: #fff; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-low); }
    </style>
</head>
<body>

    <a href="index.html" class="back-signal">TERMINATE_SESSION [ESC]</a>

    <aside class="directory">
        <div class="dir-header">
            <img src="Images/Equal.svg" class="sidebar-logo" alt="OTW">
        </div>
        
        <div class="tuning-knob">
            <label class="knob-label">Filter Frequency</label>
            <select id="freq-select" class="freq-filter" onchange="filterFrequencies()">
                <option value="ALL">ALL_SIGNALS</option>
            </select>
        </div>

        <div class="file-list" id="file-list"></div>
    </aside>

    <main class="extraction-pane">
        <div id="glass-container" class="glass-card">
            </div>
    </main>

    <script src="poetry_data.js"></script>

    <script>
        function initArchive() {
            const list = document.getElementById('file-list');
            const select = document.getElementById('freq-select');
            
            // Extract unique frequencies for the "Tuning Knob"
            const frequencies = [...new Set(archive.map(p => p.frequency))].sort();
            frequencies.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                select.appendChild(opt);
            });

            renderList("ALL");
        }

        function renderList(filter) {
            const list = document.getElementById('file-list');
            list.innerHTML = "";
            
            archive.forEach((poem, index) => {
                if (filter === "ALL" || poem.frequency === filter) {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.setAttribute('data-id', index);
                    item.onclick = () => displayPoem(index);
                    item.innerHTML = `
                        <h3>${poem.title}</h3>
                        <span>[${poem.frequency}] // ${poem.date}</span>
                    `;
                    list.appendChild(item);
                }
            });
        }

        function filterFrequencies() {
            const val = document.getElementById('freq-select').value;
            renderList(val);
        }

        function displayPoem(index) {
            const container = document.getElementById('glass-container');
            const poem = archive[index];
            
            // Update Atmospheric Thumbprint
            document.body.style.background = `
                radial-gradient(circle at bottom right, rgba(0,0,0,0.8) 0%, #050505 100%),
                ${poem.thumbprint}
            `;
            document.body.style.backgroundBlendMode = "overlay";

            container.classList.remove('visible');
            
            setTimeout(() => {
                container.innerHTML = `
                    <h1 class="poem-title">${poem.title}</h1>
                    <div class="poem-meta">SIGNAL: ${poem.frequency} // ORIGIN: ${poem.date}</div>
                    <div class="poem-body">${poem.body}</div>
                `;
                container.classList.add('visible');
                container.scrollTop = 0;
            }, 400);

            // Set Active State
            document.querySelectorAll('.file-item').forEach(el => {
                el.classList.toggle('active', el.getAttribute('data-id') == index);
            });
        }

        window.onload = () => {
            initArchive();
            if (archive.length > 0) displayPoem(0);
        };
    </script>
</body>
</html>

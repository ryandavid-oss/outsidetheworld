<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verse Archive | Outside The World</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;900&family=Fira+Code:wght@300;500&family=Merriweather:ital,wght@0,300;0,700;1,300&display=swap');

:root {
    --brand-blue: #6395EE;
    --brand-teal: #91AFB3;
    --amethyst: #9b59b6; /* New accent color */
    --bg-dark: #050505;
    --border-low: rgba(145, 175, 179, 0.1);
}

body {
    background-color: var(--bg-dark);
    color: white; font-family: 'Inter', sans-serif;
    margin: 0; display: flex; height: 100vh; overflow: hidden;
}

/* SIDEBAR REFINEMENT */
.directory {
    width: 350px; border-right: 1px solid var(--border-low);
    display: flex; flex-direction: column; background: rgba(5,5,5,1);
    z-index: 10;
}

.dir-header { padding: 40px; border-bottom: 1px solid var(--border-low); }
.dir-header h1 { font-size: 0.7rem; letter-spacing: 5px; color: var(--brand-teal); text-transform: uppercase; margin: 0; }

.file-list { flex-grow: 1; overflow-y: auto; }
.file-item {
    padding: 20px 40px; cursor: pointer; transition: 0.3s;
    border-left: 3px solid transparent; border-bottom: 1px solid rgba(255,255,255,0.02);
}
.file-item:hover { background: rgba(155, 89, 182, 0.05); }
.file-item.active { background: rgba(155, 89, 182, 0.1); border-left-color: var(--amethyst); }
.file-item h3 { font-family: 'Fira Code'; font-size: 0.75rem; margin: 0 0 5px 0; color: #eee; }
.file-item span { font-size: 0.55rem; color: #444; letter-spacing: 2px; }

/* THE READER VIEW (COLORIZED) */
.extraction-pane { 
    flex-grow: 1; padding: 100px; overflow-y: auto; position: relative; 
    /* Subtle background glow */
    background: radial-gradient(circle at bottom right, rgba(155, 89, 182, 0.05) 0%, transparent 50%);
}

.poem-container { max-width: 600px; margin: 0 auto; opacity: 0; transform: translateY(15px); transition: 0.8s cubic-bezier(0.2, 1, 0.3, 1); }
.poem-container.visible { opacity: 1; transform: translateY(0); }

.poem-meta { 
    font-family: 'Fira Code'; font-size: 0.65rem; color: var(--amethyst); 
    margin-bottom: 50px; letter-spacing: 4px; border-bottom: 1px solid var(--border-low);
    padding-bottom: 10px;
}

.poem-body { 
    font-family: 'Merriweather', serif; font-size: 1.25rem; line-height: 2.3; 
    color: #d1d1d1; white-space: pre-line; font-weight: 300;
}

/* Back Link */
.back-signal {
    position: fixed; top: 40px; right: 40px; z-index: 100;
    font-family: 'Fira Code'; font-size: 0.6rem; color: #444;
    text-decoration: none; letter-spacing: 3px;
}
.back-signal:hover { color: var(--amethyst); }
        /* SCROLLBAR STYLING */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-low); }
    </style>
</head>
<body>

    <a href="index.html" class="back-signal">TERMINATE_SESSION [ESC]</a>

    <aside class="directory">
        <div class="dir-header">
            <h1>Verse_Extraction.log</h1>
        </div>
        <div class="file-list" id="file-list">
            </div>
    </aside>

    <main class="extraction-pane">
        <div id="display-area" class="poem-container">
            </div>
    </main>

<script src="poetry_data.js"></script>

    <script>
        // 2. THE ARCHIVE LOGIC
        function loadArchive() {
            const list = document.getElementById('file-list');
            
            // Check if archive data exists
            if (typeof archive === 'undefined' || archive.length === 0) {
                list.innerHTML = '<div class="file-item"><span>ERROR: NO_SIGNALS_FOUND</span></div>';
                return;
            }

            archive.forEach((poem, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.onclick = () => displayPoem(index);
                item.innerHTML = `
                    <h3>${poem.title}</h3>
                    <span>${poem.date} // SIGNAL_DETECTED</span>
                `;
                list.appendChild(item);
            });
        }

function displayPoem(index) {
    const area = document.getElementById('display-area');
    const poem = archive[index];
    
    // 1. UPDATE ATMOSPHERIC THUMBPRINT
    // This changes the background glow based on the poem's color chord
    document.body.style.background = `
        radial-gradient(circle at bottom right, rgba(255,255,255,0.03) 0%, #050505 100%),
        ${poem.thumbprint}
    `;
    document.body.style.backgroundBlendMode = "overlay";

    area.classList.remove('visible');
    
    setTimeout(() => {
        area.innerHTML = `
            <div class="poem-meta">
                [SIGNAL: ${poem.frequency}] // [ORIGIN: ${poem.date}]
            </div>
            <div class="poem-body">${poem.body}</div>
            
            <div style="margin-top: 60px; font-family: 'Fira Code'; font-size: 0.55rem; opacity: 0.3;">
                [SCANNING_SOCIAL_RESIDUE_FOR_CROSS_LINKS...]
            </div>
        `;
        area.classList.add('visible');
    }, 300);

    // Update Sidebar
    document.querySelectorAll('.file-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
    });
}
        // 3. INITIALIZE ON LOAD
        window.onload = () => {
            loadArchive();
            if (typeof archive !== 'undefined' && archive.length > 0) {
                displayPoem(0); 
            }
        };
    </script>
</body>
</html>

  <style>
        :root {
            --brand-blue: #6395EE;
            --brand-teal: #91AFB3;
            --bg-dark: #0a0a0a;
            --border-teal: rgba(145, 175, 179, 0.2);
        }

        body {
            background-color: var(--bg-dark);
            color: white; font-family: 'Inter', sans-serif;
            margin: 0; padding: 100px 20px;
            display: flex; justify-content: center;
        }

        /* TRON CONTAINER */
        .post-vessel { 
            max-width: 800px; width: 100%; 
            padding: 60px; background: rgba(145, 175, 179, 0.02);
            position: relative; border: 1px solid rgba(145, 175, 179, 0.1);
            backdrop-filter: blur(10px);
        }

        /* TRON BORDER ANIMATION (MATCHES PERSONAL.HTML) */
        .post-vessel::before {
            content: ""; position: absolute; top: 0; right: 0; width: 0; height: 2px;
            background: var(--brand-teal); box-shadow: 0 0 15px var(--brand-teal);
            animation: draw-top-left 1.2s ease-out forwards;
        }
        .post-vessel::after {
            content: ""; position: absolute; top: 0; right: 0; width: 2px; height: 0;
            background: var(--brand-teal); box-shadow: 0 0 15px var(--brand-teal);
            animation: draw-right-bottom 1.2s ease-out forwards;
        }

        @keyframes draw-top-left {
            0% { width: 0; height: 2px; right: 0; top: 0; }
            50% { width: 100%; height: 2px; right: 0; top: 0; }
            100% { width: 100%; height: 100%; right: 0; top: 0; border-left: 2px solid var(--brand-teal); background: transparent; }
        }

        @keyframes draw-right-bottom {
            0% { height: 0; width: 2px; top: 0; right: 0; }
            50% { height: 100%; width: 2px; top: 0; right: 0; }
            100% { height: 100%; width: 100%; top: 0; right: 0; border-bottom: 2px solid var(--brand-teal); background: transparent; }
        }

        .back-nav { position: fixed; top: 40px; left: 40px; z-index: 100; }
        .node-link { 
            font-family: 'Fira Code'; font-size: 0.65rem; color: var(--brand-teal); 
            text-decoration: none; letter-spacing: 2px;
        }

        .post-date { font-family: 'Fira Code'; font-size: 0.8rem; color: var(--brand-teal); margin-bottom: 10px; display: block; }
        .post-title { font-size: 2.5rem; font-weight: 900; line-height: 1.1; margin: 0 0 40px 0; letter-spacing: -1px; }
        
        .md-render {
            font-family: 'Merriweather', serif; font-weight: 300; 
            font-size: 1.1rem; line-height: 1.9; color: #d1d1d1; 
        }

        /* SPACE FIXES */
        .md-render p:first-child { margin-top: 0; }

        .md-render img {
            display: block;
            max-width: min(100%, 720px);
            height: auto;
            margin: 38px auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 20px 52px rgba(238, 238, 238, 0.13),
                0 5px 22px rgba(160, 190, 245, 0.1),
                0 18px 44px rgba(0, 0, 0, 0.42);
        }

        .md-render figure,
        .md-render .otw-figure {
            margin: 38px auto;
            max-width: min(100%, var(--otw-figure-max-width, 720px));
        }

        .md-render figure img,
        .md-render .otw-figure img {
            margin: 0 auto;
        }

        .md-render figure figcaption,
        .md-render .otw-figure figcaption {
            margin-top: 12px;
            color: rgba(209, 209, 209, 0.72);
            font-size: 0.9rem;
            line-height: 1.5;
            text-align: center;
        }

        .md-render .otw-figure--x-small {
            --otw-figure-max-width: 220px;
            --otw-figure-wrap-width: 180px;
        }

        .md-render .otw-figure--small {
            --otw-figure-max-width: 320px;
            --otw-figure-wrap-width: 240px;
        }

        .md-render .otw-figure--medium {
            --otw-figure-max-width: 520px;
            --otw-figure-wrap-width: 340px;
        }

        .md-render .otw-figure--large {
            --otw-figure-max-width: 760px;
            --otw-figure-wrap-width: 460px;
        }

        .md-render .otw-figure--original {
            --otw-figure-max-width: 100%;
            --otw-figure-wrap-width: 52%;
        }

        .md-render .otw-figure--x-small,
        .md-render .otw-figure--small,
        .md-render .otw-figure--medium,
        .md-render .otw-figure--large {
            width: min(100%, var(--otw-figure-max-width, 720px));
        }

        .md-render .otw-figure--x-small img,
        .md-render .otw-figure--small img,
        .md-render .otw-figure--medium img,
        .md-render .otw-figure--large img {
            width: 100%;
        }

        .md-render .otw-figure--align-left {
            margin-left: 0;
            margin-right: auto;
        }

        .md-render .otw-figure--align-center {
            margin-left: auto;
            margin-right: auto;
        }

        .md-render .otw-figure--align-right {
            margin-left: auto;
            margin-right: 0;
        }

        .md-render .otw-figure--wrap-left,
        .md-render .otw-figure--wrap-right {
            clear: none;
            width: min(100%, var(--otw-figure-wrap-width, 340px));
            max-width: min(100%, var(--otw-figure-wrap-width, 340px));
            margin-top: 0.35rem;
            margin-bottom: 1rem;
        }

        .md-render .otw-figure--wrap-left {
            float: left;
            margin-left: 0;
            margin-right: 1.5rem;
        }

        .md-render .otw-figure--wrap-right {
            float: right;
            margin-left: 1.5rem;
            margin-right: 0;
        }

        @media (max-width: 720px) {
            .md-render .otw-figure--wrap-left,
            .md-render .otw-figure--wrap-right {
                float: none;
                clear: both;
                width: min(100%, var(--otw-figure-max-width, 520px));
                max-width: min(100%, var(--otw-figure-max-width, 520px));
                margin: 38px auto;
            }
        }

  <script>
   function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const fileToFind = params.get('file');
            const display = document.getElementById('post-content');

            if (typeof current_narrative !== 'undefined' && fileToFind) {
                const post = current_narrative.find(p => p.file === fileToFind);
                
                if (post) {
                    document.title = `${post.title} | OTW`;
                    display.innerHTML = `
                        <span class="post-date">${post.date.toUpperCase()}</span>
                        <h1 class="post-title">${post.title}</h1>
                        <div class="md-render">${window.renderOtwPost ? window.renderOtwPost(post) : window.renderOtwMarkdown ? window.renderOtwMarkdown(post.body) : marked.parse(post.body)}</div>
                    `;
                    return;
                }
            }
            display.innerHTML = "<h1>ERROR: SIGNAL_LOST</h1><p>The requested residue could not be recovered from the matrix.</p>";
        }

        window.onload = loadPost;
  </script>

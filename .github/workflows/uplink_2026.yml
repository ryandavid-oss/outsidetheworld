name: OTW_2026_Narrative_Sync

on:
  push:
    paths:
      - 'current_narrative/**'
      - 'narrative_sync.py'
      - 'tools/build_narrative_index.py'
      - 'tools/test_narrative_index.py'
      - 'tools/check_performance_budgets.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install publishing dependencies
        run: python -m pip install pillow

      - name: Run Narrative Sync
        run: |
          python narrative_sync.py
          python tools/build_narrative_index.py
          python tools/test_narrative_index.py
          python tools/generate_atom_feed.py
          python tools/build_discovery.py
          python tools/build_frontpage_payload.py
          python tools/test_frontpage_payload.py
          python tools/check_performance_budgets.py
          python tools/validate_discovery.py
          git add narrative_data.js narrative_index.json frontpage_payload.json atom.xml sitemap.xml threads.html archive poems iotd fragments wayback Images/og/archive
          python tools/audit_public_site.py --strict
          echo "--- VERIFYING FILE CONTENT ---"
          cat narrative_data.js  # This will show the content in the GitHub log
          echo "--- VERIFICATION COMPLETE ---"

      - name: Commit and Push
        run: |
          git config --global user.name "OTW-Bot"
          git config --global user.email "bot@outsidetheworld.com"
          git diff --quiet && git diff --staged --quiet || (git commit -m "Uplink sync" && git push)

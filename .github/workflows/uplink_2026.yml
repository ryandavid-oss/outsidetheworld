name: OTW_2026_Narrative_Sync

on:
  push:
    paths:
      - 'current_narrative/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false # We will handle credentials manually
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Narrative Sync
        run: python narrative_sync.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "OTW-Narrative-Bot"
          git config --global user.email "bot@outsidetheworld.com"
          git add narrative_data.js
          
          # Check if there are changes to commit
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Uplink: New 2026 narrative residue synced"
            # Manually inject the token into the remote URL for the push
            git push "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref }}
          else
            echo "No changes to commit"
          fi
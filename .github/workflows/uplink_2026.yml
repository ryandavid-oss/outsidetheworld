name: OTW_2026_Narrative_Sync

on:
  push:
    paths:
      - 'current_narrative/**'
      - 'narrative_sync.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Run Narrative Sync
        run: |
          python narrative_sync.py
          echo "--- VERIFYING FILE CONTENT ---"
          cat narrative_data.js  # This will show the content in the GitHub log
          echo "--- VERIFICATION COMPLETE ---"

      - name: Commit and Push
        run: |
          git config --global user.name "OTW-Bot"
          git config --global user.email "bot@outsidetheworld.com"
          git add narrative_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Uplink sync" && git push)
name: OTW_2026_Narrative_Sync

on:
  push:
    paths:
      - 'current_narrative/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Explicitly hand the bot the keys
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Narrative Sync
        run: python narrative_sync.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "OTW-Narrative-Bot"
          git config --global user.email "bot@outsidetheworld.com"
          git add narrative_data.js
          # This line prevents the "128" error by checking if there's actually a change
          git diff --quiet && git diff --staged --quiet || (git commit -m "Uplink: New 2026 narrative residue synced" && git push origin HEAD:${{ github.ref }})
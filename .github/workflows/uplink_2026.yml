name: OTW_2026_Narrative_Sync

on:
  push:
    paths:
      - 'current_narrative/**'
      - 'narrative_sync.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install publishing dependencies
        run: python -m pip install pillow

      - name: Run Narrative Sync
        run: |
          python narrative_sync.py
          python tools/generate_atom_feed.py
          python tools/build_discovery.py
          python tools/validate_discovery.py
          echo "--- VERIFYING FILE CONTENT ---"
          cat narrative_data.js  # This will show the content in the GitHub log
          echo "--- VERIFICATION COMPLETE ---"

      - name: Commit and Push
        run: |
          git config --global user.name "OTW-Bot"
          git config --global user.email "bot@outsidetheworld.com"
          git add narrative_data.js atom.xml sitemap.xml threads.html archive poems iotd fragments wayback Images/og/archive
          git diff --quiet && git diff --staged --quiet || (git commit -m "Uplink sync" && git push)

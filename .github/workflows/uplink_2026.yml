name: OTW_2026_Narrative_Sync

on:
  push:
    paths:
      - 'current_narrative/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Narrative Sync
        run: |
          touch narrative_data.js
          python narrative_sync.py

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "OTW-Narrative-Bot"
          git config --global user.email "bot@outsidetheworld.com"
          
          # We check if the file exists before adding to prevent 128
          if [ -f narrative_data.js ]; then
            git add narrative_data.js
            
            # Only commit if there are actual changes
            if ! git diff --cached --quiet; then
              git commit -m "Uplink: New 2026 narrative synced"
              git push
            else
              echo "No changes detected in narrative_data.js"
            fi
          else
            echo "Error: narrative_data.js was not generated."
            exit 1
          fi
name: OTW_Uplink_Protocol

on:
  push:
    paths:
      - 'blogger_posts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest # FIXED: Changed from 'runs-with' to 'runs-on'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Goldilocks Purifier
        run: python purify_v5.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "OTW-Archive-Bot"
          git config --global user.email "bot@outsidetheworld.com"
          git add wayback_purified.js
          git commit -m "Uplink: New digital residue incorporated into ledger" || exit 0
          git push
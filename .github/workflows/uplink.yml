name: OTW_Uplink_Protocol

on:
  push:
    paths:
      - 'blogger_posts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest # FIXED: Changed from 'runs-with' to 'runs-on'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Goldilocks Purifier
        run: |
          python tools/purify_v5.py
          python tools/build_discovery.py
          python tools/audit_wayback_media.py --local-only --strict
          python tools/validate_discovery.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "OTW-Archive-Bot"
          git config --global user.email "bot@outsidetheworld.com"
          git add wayback_purified.js sitemap.xml threads.html wayback poems iotd fragments
          git commit -m "Uplink: New digital residue incorporated into ledger" || exit 0
          git push

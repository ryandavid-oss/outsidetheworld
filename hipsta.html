<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>
        Hipsta Project | Outside The World
    </title>
    <link href="favicon.svg" rel="icon" type="image/svg+xml" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Fira+Code:wght@300;500&display=swap');

        :root {
            --brand-teal: #91AFB3;
            --brand-blue: #6395EE;
            --bg-dark: #0a0a0a;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
        }

        /* 1. FIXED NAVIGATION BLOCK */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3500;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: linear-gradient(to bottom, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0) 100%);
            /* Ensure the nav itself is centered */
            display: flex;
            justify-content: center;
            padding: 40px 0;
        }

        /* Center the script-injected container */
        .hero-logo-container {
            display: flex !important;
            justify-content: center !important;
            width: 100%;
        }

        .nav-logo {
            width: 220px;
            pointer-events: auto;
            filter: drop-shadow(0 0 20px rgba(99, 149, 238, 0.3));
        }

        /* 2. THE HEADER AREA - RECALIBRATED */
        .header-area {
            text-align: center;
            /* Recalculated: clears the 220px logo + padding without the "canyon" */
            padding-top: 220px;
            margin-bottom: 60px;
            position: relative;
            z-index: 10;
        }

        .header-area h1 {
            font-size: 2.5rem;
            letter-spacing: 15px;
            text-transform: uppercase;
            margin: 0;
            color: white;
            font-weight: 900;
        }

        .status-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: var(--brand-teal);
            border: 1px solid rgba(145, 175, 179, 0.3);
            padding: 6px 15px;
            display: inline-block;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* 3. VAULT GRID */
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px 100px;
        }

        .artifact-card {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        /* MOBILE ARCHITECTURE */
        @media (max-width: 768px) {
            nav {
                padding: 20px 0 !important;
            }

            .nav-logo {
                width: 75vw !important;
                max-width: 280px;
            }

            .header-area {
                padding-top: 160px;
                /* Tighter for mobile */
            }

            .header-area h1 {
                font-size: 1.3rem !important;
                letter-spacing: 6px !important;
            }

            .vault-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 0 10px;
            }
        }
    </style>
    <link href="theme.css" rel="stylesheet" />
    <meta content="#0a0a0a" name="theme-color" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport" />
</head>

<body>
    <div id="cursor-ring">
    </div>
    <div id="cursor-dot">
    </div>
    <nav>
        <a href="flotsam.html" style="display: inline-block; pointer-events: auto;">
            <div class="hero-logo-container">
                <img alt="Back" class="nav-logo hero-logo" src="Images/Equal.svg" />
            </div>
        </a>
    </nav>
    <div class="header-area">
        <div class="status-tag">
            TYPE: VISUAL_RECLAMATION // PROJECT: HIPSTA_2011
        </div>
        <h1>
            Hipsta_Project 2011
        </h1>
    </div>
    <div class="vault-grid" id="grid">
    </div>
    <div id="modal" onclick="closeModalOnEmpty(event)" onscroll="handleScroll(this)">
        <div id="modal-backdrop">
        </div>
        <button class="btn-back" onclick="closeModal()">
            [ CLOSE_X ]
        </button>
        <div class="modal-content" id="modal-inner">
        </div>
    </div>
    <div id="mission-overlay" onclick="closeMission()">
        <div class="mission-content">
            <h3>
                Original Directive: 2011
            </h3>
            <div id="mission-type-target">
            </div>
            <div style="margin-top: 50px; font-size: 0.7rem; opacity: 0.5;">
                [ CLICK ANYWHERE TO EXIT_ ]
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <script>
        async function loadVault() {
            try {
                const response = await fetch('hipsta_manifest.json');
                const artifacts = await response.json();
                const grid = document.getElementById('grid');

                artifacts.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'artifact-card';
                    card.innerHTML = `<img src="${item.image}" alt="${item.title}" loading="lazy">`;
                    card.onclick = () => openArtifact(item.file, item.image);
                    grid.appendChild(card);
                });
            } catch (e) { console.error("Manifest load error:", e); }
        }

        async function openArtifact(file, imageUrl) {
            const response = await fetch(file);
            const markdown = await response.text();
            document.getElementById('modal-backdrop').style.backgroundImage = `url(${imageUrl})`;
            document.getElementById('modal-inner').innerHTML = marked.parse(markdown);
            const modal = document.getElementById('modal');
            modal.style.display = 'block';
            setTimeout(() => { modal.classList.add('active'); }, 10);
            modal.scrollTop = 0;
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; document.body.style.overflow = 'auto'; }, 500);
        }

        function closeModalOnEmpty(event) {
            if (event.target.id === 'modal' || event.target.id === 'modal-backdrop') closeModal();
        }

        const manifesto = `> PROJECT_NAME: THE IPHONE PHOTO PROJECT\n\nWith the right circumstances, photography that comes from our phones can be striking. With this in mind, I started this project.\n\nEvery picture you see here comes from an <span class="highlight">iPhone 4 or 4S</span>. The app of choice is <span class="highlight">Hipstamatic</span>, a wonderful, inspiring invention that adds character and depth.\n\n> MY GOAL:\n\nIt's my desire that this archive only adds credibility to the claim that the iPhone is capable of brilliant photography.\n\n> STATUS: RECLAIMED 2026`;

        let isTyping = false;
        function revealMission() {
            if (isTyping) return;
            isTyping = true;
            const overlay = document.getElementById('mission-overlay');
            const target = document.getElementById('mission-type-target');
            overlay.style.display = 'flex';
            target.innerHTML = "";
            let i = 0;
            function typeManifesto() {
                if (i < manifesto.length) {
                    if (manifesto.substring(i, i + 1) === '<') {
                        let tagEnd = manifesto.indexOf('>', i);
                        target.innerHTML += manifesto.substring(i, tagEnd + 1);
                        i = tagEnd + 1;
                    } else {
                        target.innerHTML += manifesto.charAt(i);
                        i++;
                    }
                    setTimeout(typeManifesto, 25);
                } else { isTyping = false; }
            }
            typeManifesto();
        }
        function closeMission() { document.getElementById('mission-overlay').style.display = 'none'; }
        document.querySelector('.status-tag').onclick = revealMission;

        loadVault();
    </script>
</body>

</html>

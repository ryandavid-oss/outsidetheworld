<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>Hipsta Project | Outside The World</title>
    <link href="favicon.svg" rel="icon" type="image/svg+xml" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Fira+Code:wght@300;500&display=swap');

        :root {
            --brand-teal: #91AFB3;
            --brand-blue: #6395EE;
            --bg-dark: #0a0a0a;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
        }

        body::after {
            content: " ";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
            z-index: 3000;
            opacity: 0.1;
        }

        /* 1. NAVIGATION - DESKTOP LEFT ALIGNMENT */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3500;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: linear-gradient(to bottom, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0) 100%);
            padding: 40px;
            /* Standard left-aligned padding */
            pointer-events: none;
        }

        .hero-logo-container {
            display: inline-block;
            /* Allows it to sit naturally on the left */
            pointer-events: auto;
        }

        .nav-logo {
            width: 220px;
            filter: drop-shadow(0 0 20px rgba(99, 149, 238, 0.2));
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-logo:hover {
            transform: scale(1.02);
            filter: drop-shadow(0 0 30px rgba(99, 149, 238, 0.4));
        }

        /* 2. HEADER AREA - CLEARING THE FROST */
        .header-area {
            text-align: center;
            /* Recalibrated for the left-aligned nav: 180px is plenty on desktop */
            padding-top: 180px;
            margin-bottom: 40px;
            position: relative;
            z-index: 10;
        }

        .header-area h1 {
            font-size: 2.5rem;
            letter-spacing: 15px;
            text-transform: uppercase;
            margin: 0;
            color: white;
            font-weight: 900;
        }

        .status-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: var(--brand-teal);
            border: 1px solid rgba(145, 175, 179, 0.3);
            padding: 6px 15px;
            display: inline-block;
            text-transform: uppercase;
            margin-bottom: 25px;
            cursor: pointer;
        }

        /* 3. YEAR NAV & GRID */
        .year-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 50px;
            position: relative;
            z-index: 10;
        }

        .year-btn {
            background: none;
            border: 1px solid rgba(145, 175, 179, 0.2);
            color: var(--brand-teal);
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            padding: 8px 18px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .year-btn:hover,
        .year-btn.active {
            background: var(--brand-teal);
            color: black;
            border-color: var(--brand-teal);
        }

        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px 100px;
        }

        .artifact-card {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }

        .artifact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: 0.6s;
        }

        .artifact-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        /* 4. MODAL */
        #modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.98);
            z-index: 4000;
            display: none;
            overflow-y: scroll;
        }

        .modal-content {
            max-width: 900px;
            width: 95%;
            margin: 100px auto;
            text-align: center;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 75vh;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 40px;
        }

        .btn-back {
            position: fixed;
            top: 30px;
            right: 40px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--brand-teal);
            color: var(--brand-teal);
            padding: 12px 24px;
            z-index: 5000;
            cursor: pointer;
        }

        /* 5. MOBILE OVERRIDES - THE MONOLITH REVEAL */
        @media (max-width: 768px) {
            nav {
                padding: 20px 0 !important;
                display: flex;
                justify-content: center;
                /* Center the nav block itself */
            }

            .hero-logo-container {
                display: flex !important;
                justify-content: center !important;
                width: 100%;
            }

            .nav-logo {
                width: 75vw !important;
                max-width: 280px;
                margin: 0 auto;
            }

            body {
                /* Mobile requires more clearance for the tall centered logo */
                padding: 220px 10px 60px !important;
            }

            .header-area {
                padding-top: 0;
            }

            /* Padding handled by body on mobile */
            .header-area h1 {
                font-size: 1.3rem !important;
                letter-spacing: 6px !important;
            }

            .vault-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2px;
                padding: 0 5px;
            }
        }
    </style>

    <link href="theme.css" rel="stylesheet" />
    <meta content="#0a0a0a" name="theme-color" />
    <meta content="black-translucent" name="apple-mobile-web-app-status-bar-style" />
</head>

<body>
    <div id="cursor-ring"></div>
    <div id="cursor-dot"></div>

    <nav>
        <a href="flotsam.html" class="hero-logo-container">
            <img alt="Back" class="nav-logo" src="Images/Equal.svg" />
        </a>
    </nav>

    <div class="header-area">
        <div class="status-tag" onclick="revealMission()">
            TYPE: VISUAL_RECLAMATION // PROJECT: HIPSTA_2011
        </div>
        <h1>Hipsta_Project</h1>
    </div>

    <div class="year-nav" id="year-filter"></div>
    <div class="vault-grid" id="grid"></div>

    <div id="modal" onclick="if(event.target == this) closeModal()">
        <div id="modal-backdrop"
            style="position:fixed; top:0; left:0; width:100%; height:100%; background-size:cover; filter:blur(80px); opacity:0.3; z-index:-1;">
        </div>
        <button class="btn-back" onclick="closeModal()">[ CLOSE_X ]</button>
        <div class="modal-content" id="modal-inner"></div>
    </div>

    <div id="mission-overlay" onclick="closeMission()"
        style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:6000; display:none; justify-content:center; align-items:center; padding:40px; backdrop-filter:blur(20px);">
        <div class="mission-content"
            style="max-width:700px; font-family:'Fira Code', monospace; color:var(--brand-teal); line-height:1.8;">
            <h3
                style="color:white; letter-spacing:5px; text-transform:uppercase; border-bottom:1px solid var(--brand-teal); padding-bottom:10px; margin-bottom:30px;">
                Original Directive: 2011</h3>
            <div id="mission-type-target"></div>
            <div style="margin-top: 50px; font-size: 0.7rem; opacity: 0.5;">[ CLICK ANYWHERE TO EXIT_ ]</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let allArtifacts = [];
        const manifesto = `> PROJECT_NAME: THE IPHONE PHOTO PROJECT\n\nPhotography from our phones can be striking. Using the iPhone 4/4S and Hipstamatic, this archive adds credibility to the mobile format.\n\n> STATUS: RECLAIMED 2026`;

        async function loadVault() {
            try {
                const response = await fetch('hipsta_manifest.json');
                allArtifacts = await response.json();

                const years = [...new Set(allArtifacts.map(item => {
                    const match = item.date ? item.date.match(/20\d{2}/) : null;
                    return match ? match[0] : "Other";
                }))].sort().reverse();

                const filterContainer = document.getElementById('year-filter');
                filterContainer.innerHTML = "";

                years.forEach(year => {
                    const btn = document.createElement('button');
                    btn.className = 'year-btn';
                    btn.innerText = year;
                    btn.onclick = () => filterByYear(year, btn);
                    filterContainer.appendChild(btn);
                });

                if (years.length > 0) filterByYear(years[0], filterContainer.firstChild);
            } catch (e) { console.error("Manifest error:", e); }
        }

        function filterByYear(year, btn) {
            document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const grid = document.getElementById('grid');
            grid.innerHTML = "";
            const filtered = allArtifacts.filter(item => item.date && item.date.includes(year));
            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'artifact-card';
                card.innerHTML = `<img src="${item.image}" loading="lazy">`;
                card.onclick = () => openArtifact(item.file, item.image);
                grid.appendChild(card);
            });
        }

        async function openArtifact(file, imgUrl) {
            const res = await fetch(file);
            const md = await res.text();
            document.getElementById('modal-inner').innerHTML = marked.parse(md);
            document.getElementById('modal-backdrop').style.backgroundImage = `url(${imgUrl})`;
            document.getElementById('modal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function revealMission() {
            document.getElementById('mission-overlay').style.display = 'flex';
            document.getElementById('mission-type-target').innerText = manifesto;
        }
        function closeMission() { document.getElementById('mission-overlay').style.display = 'none'; }

        document.addEventListener('DOMContentLoaded', loadVault);
    </script>
</body>

</html>

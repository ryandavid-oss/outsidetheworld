<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Social Residue | Outside The World</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="preload" as="font" href="/assets/fonts/inter-latin-variable.woff2" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" as="font" href="/assets/fonts/fira-code-latin-variable.woff2" type="font/woff2" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/fonts/otw-fonts.css?v=20260722a" />
    <style>
        :root {
            --nav-offset: 140px;
        }

        body {
    background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: white;
            margin: 0;
            padding-top: var(--nav-offset) !important;
            padding-bottom: 60px;
            background-color: #0a0a0a;
            overflow-x: hidden;

        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3500;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: linear-gradient(to bottom, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0) 100%);
            display: flex;
            justify-content: flex-start;
            padding: 30px 40px;
            pointer-events: none;
        }

        .hero-logo-container {
            display: flex !important;
            pointer-events: auto;
        }

        .nav-logo {
            width: 220px;
            filter: drop-shadow(0 0 20px rgba(145, 175, 179, 0.2));
        }

        .header-area {
            text-align: center;
            margin: 0 auto 40px;
            position: relative;
            z-index: 10;
        }

        .header-area h1 {
            font-size: 2.5rem !important;
            letter-spacing: 15px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .year-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 50px;
            position: relative;
            z-index: 10;
        }

        .year-btn {
            background: none;
            border: 1px solid rgba(145, 175, 179, 0.2);
            color: #91AFB3;
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            padding: 8px 18px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .year-btn:hover,
        .year-btn.active {
            background: #91AFB3;
            color: black;
            border-color: #91AFB3;
        }

        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .artifact-card {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.06);
            aspect-ratio: 1/1;
            overflow: hidden;
            cursor: pointer;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .artifact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: 0.4s;
        }

        .artifact-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        #modal {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            overflow-y: auto;
            opacity: 0;
            transition: 0.3s;
        }

        #modal.active {
            display: block;
            opacity: 1;
        }

        .modal-content {
            max-width: 800px;
            width: 90%;
            margin: 100px auto;
            text-align: center;
        }

        .modal-content .markdown {
            text-align: left;
            line-height: 1.8;
            color: #ccc;
        }

        .modal-content .markdown p {
            margin-bottom: 25px;
            display: block;
        }

        .modal-content .markdown img {
            max-width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            nav {
                justify-content: center !important;
                padding: 20px 0 !important;
            }

            .hero-logo-container {
                width: 100% !important;
                justify-content: center !important;
            }

            .nav-logo {
                width: 80vw !important;
                max-width: 280px;
            }

            body {
    background-color: #0a0a0a;
                padding-top: 180px !important;
            }

            .header-area h1 {
                font-size: 1.2rem !important;
                letter-spacing: 5px;
            }

            .vault-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2px;
            }
        }
    
/* THE CLEAN ATMOSPHERIC WASH */

    </style>
</head>

<body>
    <nav><a href="flotsam.html" class="hero-logo-container"><img class="nav-logo" src="Images/Equal.svg"
                alt="Back" /></a></nav>
    <header class="header-area">
        <h1>Social Residue</h1>
    </header>
    <div class="year-nav" id="year-filter"></div>
    <div class="vault-grid" id="grid"></div>
    <div id="load-more-trigger" style="height:20px;"></div>
    <div id="modal">
        <button onclick="closeModal()"
            style="position:fixed; top:20px; right:20px; z-index:5000; background:black; color:#91AFB3; border:1px solid #91AFB3; padding:10px 20px; cursor:pointer;">[
            CLOSE_X ]</button>
        <div class="modal-content" id="modal-inner"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        let allArtifacts = [], filteredArtifacts = [], currentIndex = 0, batchSize = 25;
        const params = new URLSearchParams(window.location.search);
        const requestedFile = params.get('file');
        const requestedIndex = params.get('post');

        function syncNav() {
            const nav = document.querySelector('nav');
            if (nav && window.innerWidth > 768) { document.documentElement.style.setProperty('--nav-offset', (nav.offsetHeight + 20) + 'px'); }
        }
        window.addEventListener('resize', syncNav); window.addEventListener('load', syncNav);

        async function loadVault() {
            try {
                const res = await fetch('./insta_manifest.json'); allArtifacts = await res.json();
                const years = [...new Set(allArtifacts.map(item => item.date.match(/20\d{2}/)?.[0] || "Other"))].sort().reverse();
                const filterContainer = document.getElementById('year-filter');
                years.forEach(year => {
                    const btn = document.createElement('button'); btn.className = 'year-btn'; btn.innerText = year;
                    btn.onclick = () => filterByYear(year, btn); filterContainer.appendChild(btn);
                });
                if (years.length > 0) filterByYear(years[0], filterContainer.firstChild);

                if (requestedFile || requestedIndex) {
                    const requestedItem = allArtifacts.find((item, index) =>
                        item.file === requestedFile || String(index) === requestedIndex
                    );
                    if (requestedItem) {
                        openArtifact(requestedItem);
                    }
                }

                const observer = new IntersectionObserver((entries) => { if (entries[0].isIntersecting) renderNextBatch(); }, { threshold: 0.1 });
                observer.observe(document.getElementById('load-more-trigger'));
            } catch (e) { console.error(e); }
        }

        function filterByYear(year, btn) {
            document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
            filteredArtifacts = allArtifacts.filter(item => item.date.includes(year));
            document.getElementById('grid').innerHTML = ""; currentIndex = 0;
            renderNextBatch(); window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderNextBatch() {
            if (currentIndex >= filteredArtifacts.length) return;
            const grid = document.getElementById('grid'), nextBatch = filteredArtifacts.slice(currentIndex, currentIndex + batchSize);
            nextBatch.forEach(item => {
                const card = document.createElement('div'); card.className = 'artifact-card';
                card.innerHTML = `<img src="${item.image}" loading="lazy">`; card.onclick = () => openArtifact(item);
                grid.appendChild(card);
            });
            currentIndex += batchSize; syncNav();
        }

        async function openArtifact(item) {
            const modal = document.getElementById('modal'), inner = document.getElementById('modal-inner');
            inner.innerHTML = `<p style="font-family:monospace; color:#91AFB3;">[ LOADING_FILE... ]</p>`;
            modal.classList.add('active'); document.body.style.overflow = 'hidden';
            const res = await fetch(item.file); const md = await res.text();
            inner.innerHTML = `<div class="markdown">${marked.parse(md, { breaks: true })}</div>`;
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); document.body.style.overflow = 'auto'; }
        loadVault();
    </script>
</body>

</html>

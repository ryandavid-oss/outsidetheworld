    <style>
        :root {
            --nav-offset: 140px;
            /* will be overwritten by syncNav() */
        }

        body {
            background: #0a0a0a;
            font-family: Inter, sans-serif;
            color: #fff;
            margin: 0;
            padding-top: var(--nav-offset) !important;
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        /* =========================
     TOP NAV (fixed, two-column)
     ========================= */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3500;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            background: linear-gradient(to bottom, rgba(10, 10, 10, 0.98) 0%, rgba(10, 10, 10, 0) 100%);

            padding: 22px 0;
            pointer-events: none;
            /* keep “only logo/title clickable” feel */
            transition: padding 220ms ease, background 220ms ease;
        }

        .top-nav-inner {
            max-width: 1600px;
            /* wider rails = less “pulled to center” */
            margin: 0 auto;
            padding: 0 28px;
            /* slightly tighter than 40px */
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 22px;
        }

        .top-nav .hero-logo-container {
            pointer-events: auto;
            display: flex;
            align-items: center;
        }

        .top-nav .nav-logo {
            width: 220px;
            max-width: 42vw;
            /* prevents logo from visually hogging the row */
            height: auto;
            filter: drop-shadow(0 0 20px rgba(99, 149, 238, 0.25));
            transition: width 220ms ease, filter 220ms ease;
        }

        .top-nav .nav-right {
            pointer-events: auto;
            flex: 1;
            min-width: 0;
            text-align: right;
        }

        .status-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: #91AFB3;
            border: 1px solid rgba(145, 175, 179, 0.25);
            padding: 6px 15px;
            display: inline-block;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .top-nav .status-tag {
            margin: 0 0 8px;
        }

        .top-nav .nav-title {
            margin: 0;
            font-size: 1.35rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            font-weight: 900;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: font-size 220ms ease, letter-spacing 220ms ease;
        }

        .top-nav.is-compact {
            padding: 9px 0;
            background: rgba(10, 10, 10, 0.91);
        }

        .top-nav.is-compact .nav-logo {
            width: 154px;
            filter: drop-shadow(0 0 13px rgba(99, 149, 238, 0.20));
        }

        .top-nav.is-compact .status-tag {
            display: none;
        }

        .top-nav.is-compact .nav-title {
            font-size: 0.82rem;
            letter-spacing: 7px;
        }

        /* =========================
     HERO (Image of the Day)
     ========================= */
        .hero {
            max-width: 1400px;
            margin: 0 auto 54px;
            padding: 0 20px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(300px, 0.8fr);
            grid-template-areas:
                "heading heading"
                "visual meta";
            min-height: min(78vh, 820px);
        }

        .hero-heading {
            grid-area: heading;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-width: 0;
            min-height: clamp(150px, 15vw, 220px);
            padding: clamp(30px, 4vw, 58px) clamp(28px, 5vw, 70px);
            display: grid;
            place-items: center;
            text-align: center;
            background: #0b0c0e;
            border-bottom: 1px solid rgba(160, 190, 245, 0.14);
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.035), inset 0 -1px rgba(0, 0, 0, 0.55);
        }

        .hero-heading::before {
            content: "";
            position: absolute;
            z-index: -2;
            inset: -34px;
            background-image: var(--hero-atmosphere, none);
            background-position: center;
            background-size: cover;
            filter: blur(38px) saturate(1.18) brightness(0.64);
            transform: scale(1.09);
            opacity: 0.74;
        }

        .hero-heading::after {
            content: "";
            position: absolute;
            z-index: -1;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(6, 8, 11, 0.76), rgba(6, 8, 11, 0.30) 50%, rgba(6, 8, 11, 0.76)),
                linear-gradient(180deg, rgba(8, 10, 13, 0.18), rgba(8, 10, 13, 0.58));
        }

        .hero-visual {
            grid-area: visual;
            position: relative;
            isolation: isolate;
            min-width: 0;
            min-height: min(78vh, 820px);
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #050505;
        }

        .hero-atmosphere {
            position: absolute;
            z-index: -1;
            inset: -11%;
            background-image: var(--hero-atmosphere, none);
            background-position: center;
            background-size: cover;
            filter: blur(46px) saturate(1.05) brightness(0.58);
            transform: scale(1.12);
            opacity: 0.38;
        }

        .hero-card.is-portrait .hero-atmosphere {
            inset: -7%;
            filter: blur(30px) saturate(1.22) brightness(0.74);
            transform: scale(1.1);
            opacity: 0.76;
        }

        .hero-card.is-portrait .hero-visual::before {
            content: "";
            position: absolute;
            z-index: 0;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(4, 5, 7, 0.42), rgba(4, 5, 7, 0.08) 30%, rgba(4, 5, 7, 0.08) 70%, rgba(4, 5, 7, 0.42)),
                linear-gradient(180deg, rgba(4, 5, 7, 0.18), transparent 28%, transparent 72%, rgba(4, 5, 7, 0.24));
        }

        .hero-visual::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                linear-gradient(90deg, rgba(5, 5, 5, 0.16), transparent 24%, transparent 76%, rgba(5, 5, 5, 0.16)),
                radial-gradient(rgba(255, 255, 255, 0.07) 0.7px, transparent 0.7px);
            background-size: auto, 3px 3px;
            opacity: 0.24;
            mix-blend-mode: overlay;
        }

        .hero-img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: min(78vh, 820px);
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 20px 50px rgba(0, 0, 0, 0.38));
        }

        .hero-card.is-portrait .hero-img {
            filter:
                drop-shadow(-20px 0 34px rgba(0, 0, 0, 0.32))
                drop-shadow(20px 0 34px rgba(0, 0, 0, 0.32));
        }

        .hero-meta {
            grid-area: meta;
            position: relative;
            z-index: 3;
            padding: clamp(28px, 4vw, 58px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
            text-align: left;
            background:
                linear-gradient(145deg, rgba(14, 15, 17, 0.98), rgba(8, 9, 11, 0.96)),
                #0b0c0e;
            border-left: 1px solid rgba(160, 190, 245, 0.12);
        }

        .hero-date {
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #A0BEF5;
            text-transform: uppercase;
            margin: 0 0 18px;
        }

        .hero-title {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 18ch;
            font-weight: 900;
            letter-spacing: 0.035em;
            text-transform: uppercase;
            margin: 0;
            font-size: clamp(2.5rem, 5vw, 5.25rem);
            line-height: 0.92;
            text-align: center;
            text-shadow: 0 4px 34px rgba(0, 0, 0, 0.62);
            overflow-wrap: anywhere;
        }

        .hero-description {
            width: 100%;
        }

        .hero-caption {
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.72;
            max-width: 42ch;
            margin: 0;
            font-size: 1rem;
        }

        .hero-caption > :first-child { margin-top: 0; }
        .hero-caption > :last-child { margin-bottom: 0; }
        .hero-caption p { margin: 0 0 0.9rem; }
        .hero-caption ul,
        .hero-caption ol { width: fit-content; margin: 0.8rem 0; text-align: left; }
        .hero-caption blockquote {
            max-width: 62ch;
            margin: 1rem 0;
            border-left: 3px solid rgba(160, 190, 245, 0.65);
            padding-left: 1rem;
            text-align: left;
        }
        .hero-caption a { color: #A0BEF5; }

        .hero-actions {
            margin-top: 24px;
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            flex-wrap: wrap;
        }

        .hero-btn {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 14px;
            border: 1px solid rgba(145, 175, 179, 0.30);
            background: rgba(145, 175, 179, 0.08);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 160ms ease, color 160ms ease, background 160ms ease, transform 160ms ease;
        }

        .hero-btn:hover,
        .hero-btn:focus-visible {
            border-color: #91AFB3;
            background: rgba(145, 175, 179, 0.14);
            transform: translateY(-1px);
        }

        .hero-btn--primary {
            border-color: rgba(160, 190, 245, 0.58);
            background: rgba(99, 149, 238, 0.16);
            color: #dfeaff;
        }

        .hero-paths {
            width: 100%;
            margin-top: 32px;
            padding-top: 18px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid rgba(145, 175, 179, 0.14);
        }

        .hero-paths .hero-btn {
            width: 100%;
            min-height: 42px;
        }

        .hero-card.is-landscape {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-areas:
                "heading"
                "visual"
                "meta";
            min-height: 0;
        }

        .hero-card.is-landscape .hero-visual {
            min-height: min(72vh, 760px);
        }

        .hero-card.is-landscape .hero-img {
            height: min(72vh, 760px);
        }

        .hero-card.is-landscape .hero-meta {
            display: grid;
            grid-template-columns: minmax(280px, 1fr) minmax(270px, auto);
            gap: 18px 40px;
            align-items: start;
            padding: 30px clamp(26px, 4vw, 56px) 32px;
            border-left: 0;
            border-top: 1px solid rgba(160, 190, 245, 0.12);
        }

        .hero-card.is-landscape .hero-description {
            grid-column: 1;
            grid-row: 1 / span 2;
        }

        .hero-card.is-landscape .hero-caption {
            max-width: 70ch;
        }

        .hero-card.is-landscape .hero-actions {
            grid-column: 2;
            grid-row: 1;
            margin-top: 0;
            justify-content: flex-end;
        }

        .hero-card.is-landscape .hero-paths {
            grid-column: 2;
            grid-row: 2;
            min-width: 270px;
            margin-top: 0;
            padding-top: 0;
            border-top: 0;
        }

        /* =========================
     ARCHIVE GRID
     ========================= */
        .archive-shell {
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-label {
            margin: 0 0 14px;
            padding: 0 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: rgba(145, 175, 179, 0.75);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-label::after {
            content: "";
            height: 1px;
            flex: 1;
            background: rgba(145, 175, 179, 0.18);
        }

        .archive-count {
            color: rgba(255, 255, 255, 0.42);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .month-jump {
            margin: 0 20px 34px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(160, 190, 245, 0.32) transparent;
        }

        .month-jump a {
            flex: 0 0 auto;
            padding: 8px 10px;
            border: 1px solid rgba(145, 175, 179, 0.18);
            color: rgba(255, 255, 255, 0.62);
            font-family: 'Fira Code', monospace;
            font-size: 0.56rem;
            letter-spacing: 1.8px;
            text-decoration: none;
            text-transform: uppercase;
            transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
        }

        .month-jump a:hover,
        .month-jump a:focus-visible {
            color: #dfeaff;
            border-color: rgba(160, 190, 245, 0.55);
            background: rgba(99, 149, 238, 0.10);
        }

        .month-section {
            scroll-margin-top: 95px;
            margin-bottom: 42px;
        }

        .month-header {
            margin: 0 20px 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #a0bef5;
            font-family: 'Fira Code', monospace;
            font-size: 0.68rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .month-header::after {
            content: "";
            height: 1px;
            flex: 1;
            background: linear-gradient(90deg, rgba(160, 190, 245, 0.30), rgba(145, 175, 179, 0.08));
        }

        .month-header span:last-child {
            color: rgba(255, 255, 255, 0.38);
            font-size: 0.56rem;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            padding: 0 20px;
        }

        .artifact-card {
            display: block;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.06);
            aspect-ratio: 1/1;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            color: inherit;
            text-decoration: none;
            outline: none;
        }

        .artifact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(15%);
            transition: 0.35s;
            display: block;
        }

        .artifact-card:hover img,
        .artifact-card:focus-visible img {
            filter: grayscale(0%);
            transform: scale(1.04);
        }

        .artifact-copy {
            position: absolute;
            z-index: 2;
            left: 10px;
            right: 10px;
            bottom: 10px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
            pointer-events: none;
        }

        .artifact-title,
        .artifact-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 8px;
            backdrop-filter: blur(8px);
        }

        .artifact-title {
            max-width: calc(100% - 82px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #fff;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .artifact-card:hover .artifact-title,
        .artifact-card:focus-visible .artifact-title {
            opacity: 1;
            transform: translateY(0);
        }

        .artifact-card:focus-visible {
            border-color: rgba(160, 190, 245, 0.75);
            box-shadow: 0 0 0 2px rgba(99, 149, 238, 0.18);
        }

        /* =========================

            .top-nav.is-compact {

            }

            .top-nav .nav-right {

            }

            .artifact-title,
            .artifact-tag {
                width: fit-content;
                max-width: 100%;
                padding: 4px 5px;
                font-size: 0.46rem;
                letter-spacing: 1px;
            }

            .artifact-title {

                opacity: 1;

            }
        }

        @media (prefers-reduced-motion: reduce) {
            .top-nav,
            .top-nav .nav-logo,
            .top-nav .nav-title,
            .hero-btn,
            .artifact-card img,
            .artifact-title {
                transition: none;
            }
        }

        /* =========================
   OTW JE NE SAIS QUOI
   1) Header signal line
   2) Subtle hero film grain
   ========================= */

        /* 1) Signature OTW signal line under the header */

            position: fixed;

        .top-nav::after {

    <script>
        // Dynamic clearance
        function syncNav() {
            const nav = document.querySelector('.top-nav');
            if (!nav) return;

            const buffer = window.innerWidth > 768 ? 8 : 10;
            document.documentElement.style.setProperty('--nav-offset', (nav.offsetHeight + buffer) + 'px');
        }
        window.addEventListener('resize', syncNav);
        window.addEventListener('load', syncNav);

        function syncCompactNav() {
            const nav = document.querySelector('.top-nav');
            if (!nav) return;
            nav.classList.toggle('is-compact', window.scrollY > 120);
        }
        window.addEventListener('scroll', syncCompactNav, { passive: true });
        window.addEventListener('load', syncCompactNav);

        // MANIFEST: newest first
        // Create: image_manifest.json (array of objects)
        // [{ "date":"2026-03-05", "title":"...", "caption":"...", "image":"Images/IOTD/2026-03-05.jpg" }, ...]
        function normalizeManifest(items) {
            const seenEntries = new Set();
            const normalized = [];

            items.forEach((item) => {
                if (!item || typeof item !== 'object') return;

                const date = String(item.date || '').trim();
                const title = String(item.title || '').trim();
                const caption = String(item.caption || '').trim();
                const image = String(item.image || '').trim();
                const id = String(item.id || '').trim();
                const publishedAt = String(item.publishedAt || '').trim();

                if (!date || !image) return;
                if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
                const key = id || image;
                if (seenEntries.has(key)) return;

                seenEntries.add(key);
                normalized.push({ id, date, publishedAt, title, caption, image });
            });

            normalized.sort((a, b) => {
                const stampOrder = String(b.publishedAt || b.date).localeCompare(String(a.publishedAt || a.date));
                return stampOrder || String(b.id || b.image).localeCompare(String(a.id || a.image));
            });
            return normalized;
        }

        async function loadManifest() {
            const res = await fetch('image_manifest.json', { cache: 'default' });
            if (!res.ok) throw new Error('MANIFEST_LOAD_FAIL');
            const data = await res.json();
            if (!Array.isArray(data) || !data.length) throw new Error('MANIFEST_EMPTY');

            const normalized = normalizeManifest(data);
            if (!normalized.length) throw new Error('MANIFEST_INVALID');
            return normalized;
        }

        async function loadResponsiveMedia() {
            try {
                const response = await fetch('responsive_media.json', { cache: 'default' });
                if (!response.ok) throw new Error('RESPONSIVE_MEDIA_LOAD_FAIL');
                const payload = await response.json();
                return payload && payload.sources && typeof payload.sources === 'object'
                    ? payload.sources
                    : {};
            } catch (error) {
                console.warn('Responsive media metadata unavailable; using original images.', error);
                return {};
            }
        }

        function imagePlan(source, responsiveMedia, sizes) {
            const media = responsiveMedia[source];
            const variants = Array.isArray(media && media.variants) ? media.variants : [];
            return {
                src: variants.length ? variants[Math.min(variants.length - 1, 2)].url : source,
                srcset: variants.map((variant) => `${variant.url} ${variant.width}w`).join(', '),
                sizes,
                original: media && media.original ? media.original : source,
                width: Number(media && media.width) || 0,
                height: Number(media && media.height) || 0
            };
        }

        function activateImage(image) {
            if (!image || image.dataset.loaded === 'true') return;
            image.dataset.loaded = 'true';
            if (image.dataset.srcset) image.srcset = image.dataset.srcset;
            if (image.dataset.sizes) image.sizes = image.dataset.sizes;
            image.src = image.dataset.src;
        }

        function observeArchiveImages(images) {
            if (!('IntersectionObserver' in window)) {
                images.forEach(activateImage);
                return;
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    activateImage(entry.target);
                    observer.unobserve(entry.target);
                });
            }, { rootMargin: '500px 0px' });

            images.forEach((image) => observer.observe(image));
        }

        function recordStem(item) {
            return item.id || `${item.date}-${String(item.title || 'image')
                .toLowerCase()
                .replace(/&/g, ' and ')
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '')}`;
        }

        function recordUrl(item) {
            return `iotd/${recordStem(item)}.html`;
        }

        function orientationFor(width, height) {
            if (!width || !height) return 'portrait';
            const ratio = width / height;
            if (ratio > 1.14) return 'landscape';
            if (ratio < 0.88) return 'portrait';
            return 'square';
        }

        function applyHeroOrientation(card, width, height) {
            card.classList.remove('is-landscape', 'is-portrait', 'is-square');
            card.classList.add(`is-${orientationFor(width, height)}`);
        }

        function cssImageUrl(value) {
            const escaped = String(value || '')
                .replace(/\\/g, '\\\\')
                .replace(/"/g, '\\"')
                .replace(/[\r\n]/g, '');
            return `url("${escaped}")`;
        }

        function isPreviousDay(currentDate, candidateDate) {
            const current = Date.parse(`${currentDate}T00:00:00Z`);
            const candidate = Date.parse(`${candidateDate}T00:00:00Z`);
            return Number.isFinite(current) && Number.isFinite(candidate) && current - candidate === 86400000;
        }

        function renderHeroTitle(element, value) {
            const title = String(value || 'DAILY_SIGNAL');
            const parts = title.split('_');
            element.replaceChildren();
            parts.forEach((part, index) => {
                element.append(document.createTextNode(part));
                if (index < parts.length - 1) {
                    element.append(document.createTextNode('_'));
                    element.append(document.createElement('wbr'));
                }
            });
        }

        function setHero(item, items, responsiveMedia) {
            const heroCard = document.getElementById('heroCard');
            const heroImg = document.getElementById('heroImg');
            const heroAtmosphere = document.getElementById('heroAtmosphere');
            const heroDate = document.getElementById('heroDate');
            const heroTitle = document.getElementById('heroTitle');
            const heroCaption = document.getElementById('heroCaption');
            const heroRecord = document.getElementById('heroRecord');
            const heroOpen = document.getElementById('heroOpen');
            const heroDownload = document.getElementById('heroDownload');
            const heroPrevious = document.getElementById('heroPrevious');
            const heroRandom = document.getElementById('heroRandom');

            const plan = imagePlan(
                item.image,
                responsiveMedia,
                '(max-width: 768px) 100vw, (max-width: 1320px) 66vw, 960px'
            );
            heroImg.decoding = 'async';
            heroImg.loading = 'eager';
            heroImg.fetchPriority = 'high';
            heroImg.onload = () => applyHeroOrientation(
                heroCard,
                heroImg.naturalWidth || plan.width,
                heroImg.naturalHeight || plan.height
            );
            if (plan.srcset) heroImg.srcset = plan.srcset;
            heroImg.sizes = plan.sizes;
            if (plan.width && plan.height) {
                heroImg.width = plan.width;
                heroImg.height = plan.height;
                applyHeroOrientation(heroCard, plan.width, plan.height);
            }
            heroImg.onerror = () => {
                heroImg.removeAttribute('srcset');
                heroImg.removeAttribute('sizes');
                if (heroImg.src !== new URL(plan.original, window.location.href).href) {
                    heroImg.src = plan.original;
                }
            };
            heroImg.src = plan.src;
            heroCard.style.setProperty('--hero-atmosphere', cssImageUrl(plan.src));
            heroAtmosphere.style.setProperty('--hero-atmosphere', cssImageUrl(plan.src));
            heroImg.alt = item.title ? `${item.title} // Image of the day` : 'Image of the day';
            heroDate.textContent = (item.date || '').replaceAll('-', '_');
            renderHeroTitle(heroTitle, item.title || 'DAILY_SIGNAL');
            if (window.renderOtwMarkdown) heroCaption.innerHTML = window.renderOtwMarkdown(item.caption || '');
            else heroCaption.textContent = item.caption || '';

            heroRecord.href = recordUrl(item);
            heroOpen.href = plan.original;
            heroDownload.href = plan.original;

            const previous = items[1];
            if (previous) {
                heroPrevious.hidden = false;
                heroPrevious.href = recordUrl(previous);
                heroPrevious.textContent = isPreviousDay(item.date, previous.date)
                    ? 'YESTERDAY'
                    : 'PREVIOUS_SIGNAL';
            } else {
                heroPrevious.hidden = true;
            }

            const randomCandidates = items.slice(1);
            heroRandom.disabled = randomCandidates.length === 0;
            heroRandom.onclick = () => {
                if (!randomCandidates.length) return;
                const selected = randomCandidates[Math.floor(Math.random() * randomCandidates.length)];
                window.location.assign(recordUrl(selected));
            };

            // If you want iMessage preview to always show today:
            // (iMessage caches hard; but this helps browsers)
            const absoluteImage = new URL(plan.original, window.location.origin).toString();
            document.querySelector('meta[property="og:image"]')?.setAttribute('content', absoluteImage);
            document.querySelector('meta[property="og:image:alt"]')?.setAttribute('content', heroImg.alt);
            document.querySelector('meta[name="twitter:image"]')?.setAttribute('content', absoluteImage);
        }

        function monthLabel(monthKey) {
            const [year, month] = monthKey.split('-').map(Number);
            return new Intl.DateTimeFormat('en-US', {
                month: 'long',
                year: 'numeric',
                timeZone: 'UTC'
            }).format(new Date(Date.UTC(year, month - 1, 1))).replaceAll(' ', '_').toUpperCase();
        }

        function monthShortLabel(monthKey) {
            const [year, month] = monthKey.split('-').map(Number);
            return new Intl.DateTimeFormat('en-US', {
                month: 'long',
                timeZone: 'UTC'
            }).format(new Date(Date.UTC(year, month - 1, 1))).toUpperCase();
        }

        function buildGrid(items, responsiveMedia) {
            const archiveMonths = document.getElementById('archiveMonths');
            const monthJump = document.getElementById('monthJump');
            const archiveCount = document.getElementById('archiveCount');
            archiveMonths.innerHTML = '';
            monthJump.innerHTML = '';
            archiveCount.textContent = `${items.length} SIGNALS`;
            const pendingImages = [];
            const grouped = new Map();

            items.forEach((item) => {
                const monthKey = item.date.slice(0, 7);
                if (!grouped.has(monthKey)) grouped.set(monthKey, []);
                grouped.get(monthKey).push(item);
            });

            grouped.forEach((monthItems, monthKey) => {
                const sectionId = `month-${monthKey}`;
                const jump = document.createElement('a');
                jump.href = `#${sectionId}`;
                jump.textContent = `${monthShortLabel(monthKey)} · ${monthItems.length} ${monthItems.length === 1 ? 'IMAGE' : 'IMAGES'}`;
                monthJump.appendChild(jump);

                const section = document.createElement('section');
                section.className = 'month-section';
                section.id = sectionId;

                const heading = document.createElement('h2');
                heading.className = 'month-header';
                const headingLabel = document.createElement('span');
                headingLabel.textContent = monthLabel(monthKey);
                const headingCount = document.createElement('span');
                headingCount.textContent = `${monthItems.length} ${monthItems.length === 1 ? 'SIGNAL' : 'SIGNALS'}`;
                heading.append(headingLabel, headingCount);

                const grid = document.createElement('div');
                grid.className = 'vault-grid';
                section.append(heading, grid);
                archiveMonths.appendChild(section);

                monthItems.forEach((item) => {
                    if (item === items[0]) return;

                    const card = document.createElement('a');
                    card.className = 'artifact-card';
                    card.href = recordUrl(item);
                    card.setAttribute('aria-label', `${item.title || 'Image of the Day'}, ${item.date}`);
                    const plan = imagePlan(
                        item.image,
                        responsiveMedia,
                        '(max-width: 768px) 34vw, (max-width: 1400px) 25vw, 340px'
                    );
                    const image = document.createElement('img');
                    image.alt = item.title || 'archive image';
                    image.loading = 'lazy';
                    image.decoding = 'async';
                    image.fetchPriority = 'low';
                    image.dataset.src = plan.src;
                    image.dataset.srcset = plan.srcset;
                    image.dataset.sizes = plan.sizes;
                    if (plan.width && plan.height) {
                        image.width = plan.width;
                        image.height = plan.height;
                    }
                    image.onerror = () => {
                        image.removeAttribute('srcset');
                        image.removeAttribute('sizes');
                        if (image.src !== new URL(plan.original, window.location.href).href) {
                            image.src = plan.original;
                        }
                    };

                    const copy = document.createElement('div');
                    copy.className = 'artifact-copy';
                    const title = document.createElement('span');
                    title.className = 'artifact-title';
                    title.textContent = item.title || 'UNTITLED_SIGNAL';
                    const tag = document.createElement('span');
                    tag.className = 'artifact-tag';
                    tag.textContent = (item.date || '').replaceAll('-', '_');
                    copy.append(title, tag);
                    card.append(image, copy);
                    grid.appendChild(card);
                    pendingImages.push(image);
                });
            });

            observeArchiveImages(pendingImages);
        }

        (async function init() {
            try {
                const [items, responsiveMedia] = await Promise.all([
                    loadManifest(),
                    loadResponsiveMedia()
                ]);
                const hero = items[0];

                setHero(hero, items, responsiveMedia);
                buildGrid(items, responsiveMedia);

                syncNav();
                syncCompactNav();
            } catch (e) {
                console.error(e);
                document.getElementById('heroTitle').textContent = 'ERROR_LOADING_SIGNAL';
                document.getElementById('heroCaption').textContent = 'Check image_manifest.json and file paths.';
            }
        })();
    </script>

<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Image of the Day | Outside The World</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="theme.css" />

    <!-- Social preview -->
    <meta property="og:site_name" content="Outside The World" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Image of the Day | Outside The World" />
    <meta property="og:description" content="Daily signal capture from Outside The World." />
    <meta property="og:url" content="https://outsidetheworld.com/image_of_the_day.html" />
    <!-- Optional: you can set this dynamically later; for now set a default -->
    <meta property="og:image" content="https://outsidetheworld.com/Images/og/otw-feed-1200x630.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Fira+Code:wght@300;500&display=swap" />

    <style>
        :root {
            --nav-offset: 160px;
        }

        body {
            background: #0a0a0a;
            font-family: Inter, sans-serif;
            color: #fff;
            margin: 0;
            padding-top: var(--nav-offset) !important;
            padding-bottom: 70px;
            overflow-x: hidden;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3500;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: linear-gradient(to bottom, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0) 100%);
            display: flex;
            justify-content: flex-start;
            padding: 30px 40px;
            pointer-events: none;
        }

        .hero-logo-container {
            display: flex !important;
            pointer-events: auto;
        }

        .nav-logo {
            width: 220px;
            filter: drop-shadow(0 0 20px rgba(99, 149, 238, 0.25));
        }

        header {
            text-align: center;
            margin: 0 auto 30px;
            position: relative;
            z-index: 10;
            padding: 0 20px;
        }

        .status-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: #91AFB3;
            border: 1px solid rgba(145, 175, 179, 0.25);
            padding: 6px 15px;
            display: inline-block;
            text-transform: uppercase;
            margin-bottom: 14px;
            opacity: 0.9;
        }

        header h1 {
            font-size: 2.0rem;
            letter-spacing: 12px;
            text-transform: uppercase;
            font-weight: 900;
            margin: 8px 0 0;
        }

        /* HERO (Image of the Day) */
        .hero {
            max-width: 1100px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .hero-img {
            width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            background: #050505;
        }

        .hero-meta {
            padding: 18px 18px 20px;
            text-align: center;
        }

        .hero-date {
            font-family: 'Fira Code', monospace;
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #A0BEF5;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .hero-title {
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0 0 10px;
            font-size: 1.2rem;
        }

        .hero-caption {
            color: rgba(255, 255, 255, 0.78);
            line-height: 1.7;
            max-width: 900px;
            margin: 0 auto;
            font-size: 1rem;
        }

        .hero-actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .hero-btn {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 14px;
            border: 1px solid rgba(145, 175, 179, 0.30);
            background: rgba(145, 175, 179, 0.08);
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .hero-btn:hover {
            border-color: #91AFB3;
            background: rgba(145, 175, 179, 0.14);
        }

        /* ARCHIVE GRID */
        .section-label {
            max-width: 1400px;
            margin: 0 auto 10px;
            padding: 0 20px;
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: rgba(145, 175, 179, 0.75);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-label::after {
            content: "";
            height: 1px;
            flex: 1;
            background: rgba(145, 175, 179, 0.18);
        }

        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .artifact-card {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.06);
            aspect-ratio: 1/1;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .artifact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(15%);
            transition: 0.35s;
            display: block;
        }

        .artifact-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.04);
        }

        /* small date tag overlay */
        .artifact-tag {
            position: absolute;
            bottom: 10px;
            left: 10px;
            font-family: 'Fira Code', monospace;
            font-size: 0.55rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 8px;
            backdrop-filter: blur(8px);
        }

        @media (max-width:768px) {
            nav {
                justify-content: center;
                padding: 20px 0;
            }

            .hero-logo-container {
                width: 100%;
                justify-content: center;
            }

            .nav-logo {
                width: 80vw;
                max-width: 280px;
            }

            body {
                padding-top: 200px !important;
            }

            header h1 {
                font-size: 1.2rem;
                letter-spacing: 5px;
            }

            .vault-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2px;
                padding: 0 5px;
            }

            .section-label {
                padding: 0 10px;
            }

            .hero {
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <a href="personal.html" class="hero-logo-container">
            <img class="nav-logo" src="Images/Equal.svg" alt="Back" />
        </a>
    </nav>

    <header>
        <div class="status-tag">TYPE: DAILY_SIGNAL // STREAM: IMAGE_OF_THE_DAY</div>
        <h1>Image_Of_The_Day</h1>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-card">
            <img id="heroImg" class="hero-img" src="" alt="Image of the day" />
            <div class="hero-meta">
                <div id="heroDate" class="hero-date">LOADING_DATE…</div>
                <h2 id="heroTitle" class="hero-title">LOADING_TITLE…</h2>
                <p id="heroCaption" class="hero-caption">LOADING_CAPTION…</p>

                <div class="hero-actions">
                    <a id="heroOpen" class="hero-btn" href="#" target="_blank" rel="noopener">OPEN_IMAGE</a>
                    <a id="heroDownload" class="hero-btn" href="#" download>DOWNLOAD</a>
                </div>
            </div>
        </div>
    </section>

    <!-- ARCHIVE -->
    <div class="section-label">ARCHIVE_GRID</div>
    <div class="vault-grid" id="grid"></div>

    <script>
        // Dynamic clearance
        function syncNav() {
            const nav = document.querySelector('nav');
            if (nav && window.innerWidth > 768) {
                document.documentElement.style.setProperty('--nav-offset', (nav.offsetHeight + 30) + 'px');
            }
        }
        window.addEventListener('resize', syncNav);
        window.addEventListener('load', syncNav);

        // MANIFEST: newest first
        // Create: image_manifest.json (array of objects)
        // [{ "date":"2026-03-05", "title":"...", "caption":"...", "image":"Images/IOTD/2026-03-05.jpg" }, ...]
        async function loadManifest() {
            const res = await fetch('image_manifest.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('MANIFEST_LOAD_FAIL');
            const data = await res.json();
            if (!Array.isArray(data) || !data.length) throw new Error('MANIFEST_EMPTY');

            // Sort newest date first (expects YYYY-MM-DD)
            data.sort((a, b) => {
                const ad = String(a.date || '');
                const bd = String(b.date || '');
                // lexical compare works for ISO dates
                return bd.localeCompare(ad);
            });

            return data;
        }

        function setHero(item) {
            const heroImg = document.getElementById('heroImg');
            const heroDate = document.getElementById('heroDate');
            const heroTitle = document.getElementById('heroTitle');
            const heroCaption = document.getElementById('heroCaption');
            const heroOpen = document.getElementById('heroOpen');
            const heroDownload = document.getElementById('heroDownload');

            heroImg.src = item.image;
            heroImg.alt = item.title || 'Image of the day';
            heroDate.textContent = (item.date || '').replaceAll('-', '_');
            heroTitle.textContent = item.title || 'DAILY_SIGNAL';
            heroCaption.textContent = item.caption || '';

            heroOpen.href = item.image;
            heroDownload.href = item.image;

            // If you want iMessage preview to always show today:
            // (iMessage caches hard; but this helps browsers)
            document.querySelector('meta[property="og:image"]')?.setAttribute('content', 'https://outsidetheworld.com/' + item.image.replace(/^\//, ''));
        }

        function buildGrid(items, heroDate) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            items.forEach((item) => {
                if (item.date === heroDate) return; // skip the hero item

                const card = document.createElement('div');
                card.className = 'artifact-card';
                card.innerHTML = `
      <img src="${item.image}" loading="lazy" alt="${item.title || 'archive image'}">
      <div class="artifact-tag">${(item.date || '').replaceAll('-', '_')}</div>
    `;
                card.onclick = () => window.open(item.image, '_blank', 'noopener');
                grid.appendChild(card);
            });
        }

        (async function init() {
            try {
                const items = await loadManifest();
                const hero = items[0];

                setHero(hero);
                buildGrid(items, hero.date);

                syncNav();
            } catch (e) {
                console.error(e);
                document.getElementById('heroTitle').textContent = 'ERROR_LOADING_SIGNAL';
                document.getElementById('heroCaption').textContent = 'Check image_manifest.json and file paths.';
            }
        })();
    </script>
</body>

</html>

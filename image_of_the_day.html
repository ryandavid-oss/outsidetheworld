            margin: 0 auto;
            padding: 0 20px;

        .artifact-card {
            display: block;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.06);

            overflow: hidden;

        .artifact-card img {

            object-fit: cover;

        }

        .artifact-card:hover img {

        .artifact-tag {

        /* =========================
   OTW JE NE SAIS QUOI
   1) Header signal line
   2) Subtle hero film grain

            background-size: 3px 3px;

            opacity: 0.055;
            /* keep it low */
            mix-blend-mode: overlay;
            /* gentle texture */
        }

    <script>
        // Dynamic clearance
        function syncNav() {
            const nav = document.querySelector('.top-nav');
            if (!nav) return;

            const buffer = window.innerWidth > 768 ? 8 : 10;
            document.documentElement.style.setProperty('--nav-offset', (nav.offsetHeight + buffer) + 'px');
        }
        window.addEventListener('resize', syncNav);
        window.addEventListener('load', syncNav);

        // MANIFEST: newest first
        // Create: image_manifest.json (array of objects)
        // [{ "date":"2026-03-05", "title":"...", "caption":"...", "image":"Images/IOTD/2026-03-05.jpg" }, ...]
        function normalizeManifest(items) {
            const seenDates = new Set();
            const normalized = [];

            items.forEach((item) => {
                if (!item || typeof item !== 'object') return;

                const date = String(item.date || '').trim();
                const title = String(item.title || '').trim();
                const caption = String(item.caption || '').trim();
                const image = String(item.image || '').trim();

                if (!date || !image) return;
                if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
                if (seenDates.has(date)) return;

                seenDates.add(date);
                normalized.push({ date, title, caption, image });
            });

            normalized.sort((a, b) => String(b.date).localeCompare(String(a.date)));
            return normalized;
        }

        async function loadManifest() {
            const res = await fetch('image_manifest.json', { cache: 'default' });
            if (!res.ok) throw new Error('MANIFEST_LOAD_FAIL');
            const data = await res.json();
            if (!Array.isArray(data) || !data.length) throw new Error('MANIFEST_EMPTY');

            const normalized = normalizeManifest(data);
            if (!normalized.length) throw new Error('MANIFEST_INVALID');
            return normalized;
        }

        async function loadResponsiveMedia() {
            try {
                const response = await fetch('responsive_media.json', { cache: 'default' });
                if (!response.ok) throw new Error('RESPONSIVE_MEDIA_LOAD_FAIL');
                const payload = await response.json();
                return payload && payload.sources && typeof payload.sources === 'object'
                    ? payload.sources
                    : {};
            } catch (error) {
                console.warn('Responsive media metadata unavailable; using original images.', error);
                return {};
            }
        }

        function imagePlan(source, responsiveMedia, sizes) {
            const media = responsiveMedia[source];
            const variants = Array.isArray(media && media.variants) ? media.variants : [];
            return {
                src: variants.length ? variants[Math.min(variants.length - 1, 2)].url : source,
                srcset: variants.map((variant) => `${variant.url} ${variant.width}w`).join(', '),
                sizes,
                original: media && media.original ? media.original : source,
                width: Number(media && media.width) || 0,
                height: Number(media && media.height) || 0
            };
        }

        function activateImage(image) {
            if (!image || image.dataset.loaded === 'true') return;
            image.dataset.loaded = 'true';
            if (image.dataset.srcset) image.srcset = image.dataset.srcset;
            if (image.dataset.sizes) image.sizes = image.dataset.sizes;
            image.src = image.dataset.src;
        }

        function observeArchiveImages(images) {
            if (!('IntersectionObserver' in window)) {
                images.forEach(activateImage);
                return;
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    activateImage(entry.target);
                    observer.unobserve(entry.target);
                });
            }, { rootMargin: '500px 0px' });

            images.forEach((image) => observer.observe(image));
        }

        function setHero(item, responsiveMedia) {
            const heroImg = document.getElementById('heroImg');
            const heroDate = document.getElementById('heroDate');
            const heroTitle = document.getElementById('heroTitle');
            const heroCaption = document.getElementById('heroCaption');
            const heroOpen = document.getElementById('heroOpen');
            const heroDownload = document.getElementById('heroDownload');

            const plan = imagePlan(
                item.image,
                responsiveMedia,
                '(max-width: 768px) 100vw, (max-width: 1320px) 94vw, 1280px'
            );
            heroImg.decoding = 'async';
            heroImg.loading = 'eager';
            heroImg.fetchPriority = 'high';
            if (plan.srcset) heroImg.srcset = plan.srcset;
            heroImg.sizes = plan.sizes;
            if (plan.width && plan.height) {
                heroImg.width = plan.width;
                heroImg.height = plan.height;
            }
            heroImg.onerror = () => {
                heroImg.removeAttribute('srcset');
                heroImg.removeAttribute('sizes');
                if (heroImg.src !== new URL(plan.original, window.location.href).href) {
                    heroImg.src = plan.original;
                }
            };
            heroImg.src = plan.src;
            heroImg.alt = item.title ? `${item.title} // Image of the day` : 'Image of the day';
            heroDate.textContent = (item.date || '').replaceAll('-', '_');
            heroTitle.textContent = item.title || 'DAILY_SIGNAL';
            heroCaption.textContent = item.caption || '';

            heroOpen.href = plan.original;
            heroDownload.href = plan.original;

            // If you want iMessage preview to always show today:
            // (iMessage caches hard; but this helps browsers)
            const absoluteImage = new URL(plan.original, window.location.origin).toString();
            document.querySelector('meta[property="og:image"]')?.setAttribute('content', absoluteImage);
            document.querySelector('meta[property="og:image:alt"]')?.setAttribute('content', heroImg.alt);
            document.querySelector('meta[name="twitter:image"]')?.setAttribute('content', absoluteImage);
        }

        function buildGrid(items, heroDate, responsiveMedia) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const pendingImages = [];

            items.forEach((item) => {
                if (item.date === heroDate) return; // skip the hero item

                const card = document.createElement('a');
                card.className = 'artifact-card';
                card.href = `iotd/${item.date}-${String(item.title || 'image').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')}.html`;
                const plan = imagePlan(
                    item.image,
                    responsiveMedia,
                    '(max-width: 768px) 34vw, (max-width: 1400px) 25vw, 340px'
                );
                const image = document.createElement('img');
                image.alt = item.title || 'archive image';
                image.loading = 'lazy';
                image.decoding = 'async';
                image.fetchPriority = 'low';
                image.dataset.src = plan.src;
                image.dataset.srcset = plan.srcset;
                image.dataset.sizes = plan.sizes;
                if (plan.width && plan.height) {
                    image.width = plan.width;
                    image.height = plan.height;
                }
                image.onerror = () => {
                    image.removeAttribute('srcset');
                    image.removeAttribute('sizes');
                    if (image.src !== new URL(plan.original, window.location.href).href) {
                        image.src = plan.original;
                    }
                };

                const tag = document.createElement('div');
                tag.className = 'artifact-tag';
                tag.textContent = (item.date || '').replaceAll('-', '_');
                card.append(image, tag);
                grid.appendChild(card);
                pendingImages.push(image);
            });

            observeArchiveImages(pendingImages);
        }

        (async function init() {
            try {
                const [items, responsiveMedia] = await Promise.all([
                    loadManifest(),
                    loadResponsiveMedia()
                ]);
                const hero = items[0];

                setHero(hero, responsiveMedia);
                buildGrid(items, hero.date, responsiveMedia);

                syncNav();
            } catch (e) {
                console.error(e);
                document.getElementById('heroTitle').textContent = 'ERROR_LOADING_SIGNAL';
                document.getElementById('heroCaption').textContent = 'Check image_manifest.json and file paths.';
            }
        })();
    </script>

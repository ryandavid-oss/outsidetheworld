<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Outside The World - Blogs, Photography, powered by Burningham</title>
    <style>
        body {
            margin: 0;
            padding: 40px 0;
            font-family: Arial, sans-serif;
        }

        /* The container for each interactive box */
        .rollover {
            display: block;
            position: relative;
            width: 336px;
            height: 120px;
            overflow: hidden;
            line-height: 0;
        }

        /* Stack images on top of each other */
        .rollover img {
            position: absolute;
            top: 0;
            left: 0;
            width: 336px;
            height: 120px;
            border: 0;
            transition: opacity 0.3s ease-in-out;
        }

        /* The "Hover" image starts invisible */
        .rollover .hover-img {
            opacity: 0;
            z-index: 2;
        }

        /* The "Base" image stays underneath */
        .rollover .base-img {
            position: relative;
            /* This keeps the cell height correct */
            z-index: 1;
        }

        /* When mouse touches the link, fade in the top image */
        .rollover:hover .hover-img {
            opacity: 1;
        }

        .copyright {
            color: #999999;
            font-size: 11px;
            margin-top: 20px;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>

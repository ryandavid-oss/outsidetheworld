<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Personnel_Log | RyanDavid Burningham</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500;700&family=Inter:wght@300;400;700;900&display=swap');

        :root {
            --apple-blue: #6395EE;   /* FOUNDERS & PIONEERS */
            --apple-green: #32CD32;  /* CO-WORKERS */
            --apple-pink: #FF69B4;   /* RYAN_DAVID */
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: #ccc;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 0;
            line-height: 1.8;
            overflow-x: hidden;
        }

        /* ATMOSPHERIC SCANLINES */
        body::after {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(99, 149, 238, 0.02), rgba(99, 149, 238, 0.01), rgba(99, 149, 238, 0.02));
            background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 1000; opacity: 0.2;
        }

        nav { padding: 60px 40px 20px; text-align: left; z-index: 1001; position: relative; }
        .nav-logo { width: 220px; filter: drop-shadow(0 0 20px rgba(99, 149, 238, 0.4)); }

        header { padding: 20px 40px 60px; text-align: center; }
        h1 { font-size: 2.8rem; color: #fff; margin: 0; letter-spacing: -1px; font-weight: 900; text-transform: uppercase; }

        .typewriter-box { font-family: 'Fira Code', monospace; font-size: 1.2rem; color: var(--apple-blue); margin-top: 15px; min-height: 1.5rem; display: inline-block; }
        .cursor { display: inline-block; width: 10px; height: 18px; background-color: var(--apple-blue); margin-left: 5px; animation: blink 1s infinite; vertical-align: middle; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .content-grid { max-width: 900px; margin: 0 auto; padding: 60px 20px; }
        .narrative p { margin-bottom: 30px; font-size: 1.15rem; font-weight: 300; }
        
        .blog-extract { background: rgba(255,255,255,0.03); border-left: 3px solid var(--apple-blue); padding: 40px; margin: 40px 0; font-family: 'Fira Code', monospace; font-size: 0.95rem; color: #aaa; }
        .extract-header { color: var(--apple-blue); font-size: 0.75rem; margin-bottom: 20px; display: block; letter-spacing: 2px; }

        /* RESTORED FLEX-WRAP SCROLLING LIST */
        .matrix-section {
            height: 500px; position: relative; margin: 80px 0;
            border: 1px solid rgba(255,255,255,0.05); overflow: hidden;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }

        #name-wall {
            display: flex; flex-wrap: wrap; gap: 15px 40px; padding: 40px;
            justify-content: center; 
            animation: scrollWall 180s linear infinite; /* Reset to original stable speed */
        }

        .name-entry { font-family: 'Fira Code'; font-size: 0.65rem; color: #222; text-transform: uppercase; white-space: nowrap; }
        .pink-name { color: var(--apple-pink) !important; font-weight: 700; font-size: 0.85rem; }
        .blue-name { color: var(--apple-blue) !important; font-weight: 600; }
        .green-name { color: var(--apple-green) !important; font-weight: 600; }
        .highlight::before { content: "⌘ "; }

        @keyframes scrollWall { 
            from { transform: translateY(0); } 
            to { transform: translateY(-50%); } 
        }

        /* SIGNATURE BLEND-MODE REPAIR */
        .signature-container { margin-top: 50px; text-align: right; }
        .signature-img { 
            max-width: 280px; 
            filter: invert(1) brightness(2) contrast(150%);
            mix-blend-mode: screen; /* Strips black background on-the-fly */
            opacity: 0.9; 
        }

        .system-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 5000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(20px); cursor: zoom-out; }
        .system-overlay img, .system-overlay iframe { max-width: 90%; max-height: 90%; border: 1px solid #333; }

        footer { padding: 100px 40px; text-align: center; font-family: 'Fira Code'; font-size: 0.6rem; letter-spacing: 4px; color: #333; }
        .cmd-egg { color: var(--apple-blue); cursor: pointer; transition: 0.3s; margin: 0 15px; }

        @media (max-width: 768px) { nav { text-align: center; } h1 { font-size: 1.6rem; } .typewriter-box { font-size: 0.9rem; } }
    </style>
</head>

        function generateWall() {
            let names = [{n: pink, t: 'pink-name highlight'}, ...blue.map(n=>({n, t:'blue-name'})), ...green.map(n=>({n, t:'green-name'})), ...gray.map(n=>({n, t:''}))];

            wall.innerHTML = [...names, ...names, ...names].map(i=>`<span class="name-entry ${i.t}">${i.n}</span>`).join('');

        const typeT = document.getElementById('typewriter-target');
        const recordText = "SERVICE_RECORD // 2009-2014 // RyanDavid Burningham";
        let idx = 0;
        function type() { if(idx < recordText.length) { typeT.textContent += recordText.charAt(idx++); setTimeout(type, 70); } }

        function openOverlay(id) { document.getElementById(id).style.display = 'flex'; }
        function closeOverlay(id) { document.getElementById(id).style.display = 'none'; }
        window.onload = () => { generateWall(); setTimeout(type, 1000); };

    <style>
        :root {
            --nav-offset: 180px;
        }

        body {
    background-color: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: white;
            margin: 0;
            padding-top: var(--nav-offset) !important;
            padding-bottom: 60px;
            background-color: #0a0a0a;
            overflow-x: hidden;

        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3500;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: linear-gradient(to bottom, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0) 100%);
            display: flex;
            justify-content: flex-start;
            padding: 30px 40px;
            pointer-events: none;
        }

        .hero-logo-container {
            display: flex !important;
            pointer-events: auto;
        }

        .nav-logo {
            width: 220px;
            filter: drop-shadow(0 0 20px rgba(99, 149, 238, 0.3));
        }

        .header-area {
            text-align: center;
            margin: 0 auto 60px;
            position: relative;
            z-index: 10;
        }

        .header-area h1 {
            font-size: 2.5rem !important;
            letter-spacing: 15px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .artifact-card {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.06);
            aspect-ratio: 1/1;
            overflow: hidden;
            cursor: pointer;
        }

        .artifact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: 0.4s;
        }

        .artifact-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        #modal {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            overflow-y: auto;
            opacity: 0;
            transition: 0.3s;
        }

        #modal.active {
            display: block;
            opacity: 1;
        }

        .modal-content {
            max-width: 800px;
            width: 90%;
            margin: 100px auto;
            text-align: center;
        }

        .modal-content .markdown {
            text-align: left;
            line-height: 1.8;
            color: #ccc;
        }

        .modal-content .markdown p {
            margin-bottom: 25px;
            display: block;
        }

        .modal-content .markdown img {
            max-width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 20px 0 40px;
        }

        @media (max-width: 768px) {
            nav {
                justify-content: center !important;
                padding: 20px 0 !important;
            }

            .hero-logo-container {
                width: 100% !important;
                justify-content: center !important;
            }

            .nav-logo {
                width: 80vw !important;
                max-width: 280px;
            }

            body {
    background-color: #0a0a0a;
                padding-top: 180px !important;
            }

            .header-area h1 {
                font-size: 1.2rem !important;
                letter-spacing: 5px;
            }

            .vault-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }
        }
    
/* THE CLEAN ATMOSPHERIC WASH */

    </style>

<body>
    <nav><a href="flotsam.html" class="hero-logo-container"><img class="nav-logo" src="Images/Equal.svg"
                alt="Back" /></a></nav>
    <header class="header-area">
        <h1>The Favorites List</h1>
    </header>
    <div class="vault-grid" id="grid"></div>
    <div id="modal">
        <div id="modal-backdrop"
            style="position:fixed; inset:0; background-size:cover; filter:blur(60px); opacity:0.3; z-index:-1;"></div>
        <button onclick="closeModal()"
            style="position:fixed; top:20px; right:20px; z-index:5000; background:black; color:#91AFB3; border:1px solid #91AFB3; padding:10px 20px; cursor:pointer;">[
            CLOSE_X ]</button>
        <div class="modal-content" id="modal-inner"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        function syncNav() { const nav = document.querySelector('nav'); if (nav && window.innerWidth > 768) { document.documentElement.style.setProperty('--nav-offset', (nav.offsetHeight + 40) + 'px'); } }
        window.addEventListener('resize', syncNav); window.addEventListener('load', syncNav);
        async function loadVault() {
            const res = await fetch('favorites_manifest.json'); const artifacts = await res.json();
            const grid = document.getElementById('grid');
            artifacts.forEach(item => {
                const btn = document.createElement('div'); btn.className = 'artifact-card';
                btn.innerHTML = `<img src="${item.image}" loading="lazy">`; btn.onclick = () => openArtifact(item);
                grid.appendChild(btn);
            });
            syncNav();
        }
        async function openArtifact(item) {
            const modal = document.getElementById('modal'); const inner = document.getElementById('modal-inner');
            document.getElementById('modal-backdrop').style.backgroundImage = `url(${item.image})`;
            inner.innerHTML = `<p style="font-family:monospace; color:#91AFB3;">[ LOADING_FILE... ]</p>`;
            modal.classList.add('active'); document.body.style.overflow = 'hidden';
            const res = await fetch(item.file); const md = await res.text();
            inner.innerHTML = `<div class="markdown">${marked.parse(md, { breaks: true })}</div>`;
        }
        function closeModal() { document.getElementById('modal').classList.remove('active'); document.body.style.overflow = 'auto'; }
        loadVault();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>The Favorites List | Outside The World</title>
    <link href="favicon.svg" rel="icon" type="image/svg+xml" />

    <link href="theme.css" rel="stylesheet" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Fira+Code:wght@300;500&display=swap');

        body {
            /* JavaScript will handle the top padding dynamically */
            padding: 0 20px 60px;
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
        }

        /* 2. NAVIGATION - DESKTOP LEFT, MOBILE CENTER */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3500;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: linear-gradient(to bottom, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0) 100%);
            display: flex;
            justify-content: flex-start;
            /* Desktop Default */
            padding: 40px;
            pointer-events: none;
        }

        /* Override the global container to prevent it from forcing a center on desktop */
        .hero-logo-container {
            display: flex !important;
            justify-content: flex-start !important;
            width: auto !important;
            padding: 0 !important;
            pointer-events: auto;
        }

        .nav-logo {
            width: 220px;
            filter: drop-shadow(0 0 20px rgba(99, 149, 238, 0.3));
        }

        /* 3. HEADER AREA */
        .header-area {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
            z-index: 10;
        }

        .header-area h1 {
            font-size: 2.5rem;
            letter-spacing: 15px;
            text-transform: uppercase;
            margin: 0;
            color: white;
            font-weight: 900;
        }

        /* 4. GRID */
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .artifact-card {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.05);
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
        }

        /* 5. MOBILE OVERRIDES */
        @media (max-width: 768px) {
            nav {
                justify-content: center !important;
                padding: 20px 0 !important;
            }

            .hero-logo-container {
                width: 100% !important;
                justify-content: center !important;
            }

            .nav-logo {
                width: 80vw !important;
                max-width: 280px;
            }

            .header-area h1 {
                font-size: 1.3rem !important;
                letter-spacing: 6px !important;
            }

            .vault-grid {
                grid-template-columns: repeat(2, 1fr);
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>
    <div id="cursor-ring">
    </div>
    <div id="cursor-dot">
    </div>
    <nav>
        <a href="flotsam.html" style="display: inline-block; pointer-events: auto;">
            <div class="hero-logo-container">
                <img alt="Back" class="nav-logo hero-logo" src="Images/Equal.svg" />
            </div>
        </a>
    </nav>
    <div class="header-area">
        <div class="status-tag" onclick="revealMission()">
            TYPE: CULTURAL_RESIDUE // PROJECT: FAVORITES_2011
        </div>
        <h1>
            The Favorites List
        </h1>
    </div>
    <div class="vault-grid" id="grid">
    </div>
    <div id="modal" onclick="closeModalOnEmpty(event)">
        <div id="modal-backdrop">
        </div>
        <button class="btn-back" onclick="closeModal()">
            [ CLOSE_X ]
        </button>
        <div class="modal-content" id="modal-inner">
        </div>
    </div>
    <div id="mission-overlay" onclick="closeMission()">
        <div class="mission-content">
            <h3>
                Original Directive: 2011
            </h3>
            <div id="mission-type-target">
            </div>
            <div style="margin-top: 50px; font-size: 0.7rem; opacity: 0.5;">
                [ CLICK ANYWHERE TO EXIT_ ]
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
    <script>
        async function loadVault() {
            try {
                const response = await fetch('favorites_manifest.json');
                const artifacts = await response.json();
                const grid = document.getElementById('grid');

                artifacts.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'artifact-card';
                    card.innerHTML = `<img src="${item.image}" alt="${item.title}" loading="lazy">`;
                    card.onclick = () => openArtifact(item.file, item.image);
                    grid.appendChild(card);
                });
            } catch (e) { console.error("Manifest load error:", e); }
        }

        async function openArtifact(file, imageUrl) {
            const response = await fetch(file);
            const markdown = await response.text();
            document.getElementById('modal-backdrop').style.backgroundImage = `url(${imageUrl})`;
            document.getElementById('modal-inner').innerHTML = marked.parse(markdown);
            const modal = document.getElementById('modal');
            modal.style.display = 'block';
            setTimeout(() => { modal.classList.add('active'); }, 10);
            modal.scrollTop = 0;
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; document.body.style.overflow = 'auto'; }, 500);
        }

        function closeModalOnEmpty(event) {
            if (event.target.id === 'modal' || event.target.id === 'modal-backdrop') closeModal();
        }

        // UPDATED MANIFESTO FOR FAVORITE THINGS [cite: 98, 100, 102]
        const manifesto = `> PROJECT_NAME: THE FAVORITES LIST\n\nGreetings, travelers. If you've come here by way of The iPhone Photo Project, i hope you find this an entertaining diversion.\n\nHere, you'll find a list catalogue of my <span class="highlight">favorite things</span>. One for each day, ending the 31st of December.\n\nI loved the idea of getting to know someone better by learning about their <span class="highlight">treasures, vices, needs, and brand choices</span>.\n\n> STATUS: RECLAIMED 2026`;

        let isTyping = false;
        function revealMission() {
            if (isTyping) return;
            isTyping = true;
            const overlay = document.getElementById('mission-overlay');
            const target = document.getElementById('mission-type-target');
            overlay.style.display = 'flex';
            target.innerHTML = "";
            let i = 0;
            function typeManifesto() {
                if (i < manifesto.length) {
                    if (manifesto.substring(i, i + 1) === '<') {
                        let tagEnd = manifesto.indexOf('>', i);
                        target.innerHTML += manifesto.substring(i, tagEnd + 1);
                        i = tagEnd + 1;
                    } else {
                        target.innerHTML += manifesto.charAt(i);
                        i++;
                    }
                    setTimeout(typeManifesto, 25);
                } else { isTyping = false; }
            }
            typeManifesto();
        }
        function closeMission() { document.getElementById('mission-overlay').style.display = 'none'; }
        document.querySelector('.status-tag').onclick = revealMission;

        loadVault();
    </script>
    <script>
        function syncBodyToNav() {
            const nav = document.querySelector('nav');
            if (!nav) return;

            if (window.innerWidth > 768) {
                // Adds 40px of breathing room below the blur zone
                document.body.style.paddingTop = (nav.offsetHeight + 40) + "px";
            } else {
                // On mobile, the CSS 130px padding-top will take over
                document.body.style.paddingTop = "180px";
            }
        }

        window.addEventListener("load", syncBodyToNav);
        window.addEventListener("resize", syncBodyToNav);

        // Run it once immediately if content is already loaded
        syncBodyToNav();
    </script>
</body>

</html>

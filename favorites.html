<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Favorites List | Outside The World</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="theme.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&family=Fira+Code:wght@300;500&display=swap');

        :root {
            --nav-offset: 200px;
            /* Safe fallback */
        }

        body {
            font-family: 'Inter', sans-serif;
            color: white;
            margin: 0;
            /* NUCLEAR FIX: Forces the padding to beat theme.css */
            padding-top: calc(var(--nav-offset) + 40px) !important;
            padding-bottom: 60px;
            background-color: #0a0a0a;
            background-image:
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 3px 100%;
            overflow-x: hidden;
        }

        /* NAV RECLAMATION */
        .fav-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 3500;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: linear-gradient(to bottom, rgba(10, 10, 10, 1) 0%, rgba(10, 10, 10, 0) 100%);
            display: flex;
            justify-content: flex-start;
            padding: 30px 40px;
            pointer-events: none;
        }

        .fav-nav a {
            pointer-events: auto;
            display: inline-flex;
        }

        .fav-nav-logo {
            width: 220px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(99, 149, 238, 0.3));
        }

        /* HEADER AREA */
        .header-area {
            text-align: center;
            margin: 0 auto 60px auto;
            position: relative;
            z-index: 10;
        }

        .header-area h1 {
            font-size: 2.5rem !important;
            /* Forced size */
            letter-spacing: 15px;
            text-transform: uppercase;
            margin: 20px 0 0 0;
            font-weight: 900;
        }

        /* GRID */
        .vault-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .artifact-card {
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            position: relative;
        }

        .artifact-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%);
            transition: 0.4s;
        }

        .artifact-card:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        /* MODAL TYPOGRAPHY FIX (Preventing "Crazy Big" words) */
        #modal {
            position: fixed;
            inset: 0;
            z-index: 4000;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            overflow-y: auto;
            opacity: 0;
            transition: 0.3s;
        }

        #modal.active {
            display: block;
            opacity: 1;
        }

        .modal-content {
            max-width: 800px;
            width: 90%;
            margin: 100px auto;
            text-align: center;
        }

        /* Scaled down title for the modal */
        .modal-content h1 {
            font-size: 2rem !important;
            letter-spacing: 8px;
            margin-bottom: 10px;
        }

        .modal-content h2 {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            color: #91AFB3;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        .modal-content .markdown {
            text-align: left;
            line-height: 1.8;
            color: #ccc;
        }

        .modal-content .markdown img {
            max-width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .fav-nav {
                justify-content: center;
                padding: 20px 0;
            }

            .fav-nav-logo {
                width: 80vw;
            }

            body {
                padding-top: 220px !important;
            }

            .header-area h1 {
                font-size: 1.2rem !important;
                letter-spacing: 5px;
            }

            .vault-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 5px;
            }
        }
    </style>
</head>

<body>
    <nav class="fav-nav">
        <a href="flotsam.html"><img class="fav-nav-logo" src="Images/Equal.svg" alt="Back" /></a>
    </nav>

    <header class="header-area">
        <div class="status-tag" id="statusTag">TYPE: CULTURAL_RESIDUE // PROJECT: FAVORITES_2011</div>
        <h1>The Favorites List</h1>
    </header>

    <div class="vault-grid" id="grid"></div>

    <div id="modal">
        <div id="modal-backdrop"
            style="position:fixed; inset:0; background-size:cover; filter:blur(60px) brightness(0.2); opacity:0.5; z-index:-1;">
        </div>
        <button class="btn-back" onclick="closeModal()"
            style="position:fixed; top:20px; right:20px; z-index:5000; background:black; color:#91AFB3; border:1px solid #91AFB3; padding:10px 20px; cursor:pointer;">[
            CLOSE_X ]</button>
        <div class="modal-content" id="modal-inner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // AUTO-MEASURE SCRIPT
        function syncNav() {
            const nav = document.querySelector('.fav-nav');
            if (nav && window.innerWidth > 768) {
                document.documentElement.style.setProperty('--nav-offset', nav.offsetHeight + 'px');
            }
        }
        window.addEventListener('resize', syncNav);
        window.addEventListener('load', syncNav);

        async function loadVault() {
            const res = await fetch('favorites_manifest.json');
            const artifacts = await res.json();
            const grid = document.getElementById('grid');

            artifacts.forEach(item => {
                const btn = document.createElement('div');
                btn.className = 'artifact-card';
                btn.innerHTML = `<img src="${item.image}" loading="lazy">`;
                btn.onclick = () => openArtifact(item);
                grid.appendChild(btn);
            });
        }

        async function openArtifact(item) {
            const modal = document.getElementById('modal');
            const inner = document.getElementById('modal-inner');
            const backdrop = document.getElementById('modal-backdrop');

            // Setup background
            backdrop.style.backgroundImage = `url(${item.image})`;

            // CLEAN INJECTION: No duplicate images
            inner.innerHTML = `<p style="font-family:monospace; color:#91AFB3;">[ LOADING_FILE... ]</p>`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            const res = await fetch(item.file);
            const md = await res.text();

            // We let the Markdown handle the image and title
            inner.innerHTML = `<div class="markdown">${marked.parse(md)}</div>`;
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        loadVault();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Artifacts // Flotsam_Test</title>
    <meta name="theme-color" content="#050505">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500;700&family=Inter:wght@400;900&display=swap');

        :root {
            --brand-blue: #6395EE;
            --brand-teal: #91AFB3;
            --bg-dark: #050505;
            --border-low: rgba(145, 175, 179, 0.15);
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: env(safe-area-inset-top) 40px;
            overflow-x: hidden;
        }

        /* 1. TERMINAL HEADER */
        .terminal-header {
            max-width: 1200px;
            margin: 60px auto 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-low);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .header-title h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
        }

        .status-tag {
            font-family: 'Fira Code', monospace;
            font-size: 0.65rem;
            color: var(--brand-teal);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* 2. THE ARTIFACT RACK (GRID) */
        .artifact-rack {
            max-width: 1200px;
            margin: 0 auto 100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        /* 3. THE MUSEUM CASE (CARD) */
        .museum-case {
            background: #000;
            border: 1px solid var(--border-low);
            position: relative;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .museum-case:hover {
            border-color: var(--brand-blue);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        /* THE SIMULATED VIEWPORT */
        .viewport-container {
            width: 100%;
            height: 240px;
            background: #111;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid var(--border-low);
        }

        /* THE MAGIC SCALE: This shrinks the large 2009 page into a tiny card */
        .legacy-frame {
            width: 1024px;
            /* Simulated desktop width */
            height: 768px;
            /* Simulated desktop height */
            border: none;
            transform: scale(0.38);
            /* Scales the 1024px page down to fit ~390px */
            transform-origin: 0 0;
            pointer-events: none;
            /* User can't click links inside the thumbnail */
        }

        /* CASE OVERLAY FOR TEXTURE */
        .case-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.4) 0%, transparent 100%);
            pointer-events: none;
        }

        .case-info {
            padding: 20px;
            background: #080808;
        }

        .case-info h3 {
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            margin: 0 0 5px 0;
            color: var(--brand-blue);
        }

        .case-info p {
            font-size: 0.65rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 15px 0;
        }

        .boot-btn {
            display: inline-block;
            font-family: 'Fira Code', monospace;
            font-size: 0.6rem;
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            border: 1px solid #333;
            transition: 0.3s;
        }

        .boot-btn:hover {
            border-color: #fff;
            background: #fff;
            color: #000;
        }

        /* MOBILE TWEAKS */
        @media (max-width: 768px) {
            .artifact-rack {
                grid-template-columns: 1fr;
            }

            .terminal-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <header class="terminal-header">
        <div class="header-title">
            <span class="status-tag">DIRECTORY_RECOVERY // ACTIVE</span>
            <h1>FLOTSAM_ARCHIVES</h1>
        </div>
        <a href="personal.html"
            style="font-family:'Fira Code'; color:var(--brand-teal); text-decoration:none; font-size:0.7rem;">←
            EXIT_SYSTEM</a>
    </header>

    <main class="artifact-rack">

        <div class="museum-case">
            <div class="viewport-container">
                <iframe src="old_index_2009.html" class="legacy-frame"></iframe>
                <div class="case-overlay"></div>
            </div>
            <div class="case-info">
                <h3>OTW_INDEX_V2.1</h3>
                <p>Origin: 23 MAR 2009 // MS_FRONTPAGE</p>
                <a href="old_index_2009.html" class="boot-btn">BOOT_ARTIFACT</a>
            </div>
        </div>

        <div class="museum-case">
            <div class="viewport-container">
                <iframe src="index01.html" class="legacy-frame"></iframe>
                <div class="case-overlay"></div>
            </div>
            <div class="case-info">
                <h3>OTW_INDEX_V1.0</h3>
                <p>Origin: 26 APR 2002 // Hand-Coded Tables</p>
                <a href="index01.html" class="boot-btn">BOOT_ARTIFACT</a>
            </div>
        </div>

    </main>

    <footer style="text-align:center; padding: 40px; border-top: 1px solid var(--border-low);">
        <p style="font-family:'Fira Code'; font-size:0.5rem; color:#222; letter-spacing:4px;">© 2026
            DIGITAL_ARCHAEOLOGY_UNIT</p>
    </footer>

</body>

</html>
